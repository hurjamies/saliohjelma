const CARDIO_KINDS = ['Hyrox','Jumppa','Juoksu','Muu'];

function cardioSessions(person, kind){
  return store[person].sessions.filter(function(s){
    return s.pid === 'cardio' && (!kind || kind === 'all' || (s.kind || 'Muu') === kind);
  }).sort(function(a,b){ return (a.end || '') < (b.end || '') ? 1 : -1; });
}
function weekStartOf(d){
  const m = new Date(d); m.setHours(0,0,0,0); m.setDate(m.getDate() - monIndex(m)); return m;
}
function cardioWeeks(person, kind, weeks){
  const thisMonday = weekStartOf(new Date());
  const list = cardioSessions(person, kind);
  const out = [];
  for(let i = weeks - 1; i >= 0; i--){
    const st = new Date(thisMonday); st.setDate(thisMonday.getDate() - i*7);
    const en = new Date(st); en.setDate(st.getDate() + 7);
    let min = 0, cnt = 0;
    list.forEach(function(s){
      const d = new Date(s.end);
      if(d >= st && d < en){ min += num(s.minutes) || 0; cnt++; }
    });
    out.push({start:st, min:min, count:cnt});
  }
  return out;
}

function renderCardioTab(person){
  const kind = state.cardioKind;
  const list = cardioSessions(person, kind);
  const weeks = cardioWeeks(person, kind, 8);
  const thisWeek = weeks[weeks.length-1];
  const last4 = weeks.slice(-4);
  const avg4 = Math.round(last4.reduce(function(a,w){ return a + w.min; }, 0) / 4);
  const totalMin = list.reduce(function(a,s){ return a + (num(s.minutes) || 0); }, 0);

  let h = '<div class="pickrow" style="margin-bottom:10px">';
  h += '<button type="button" class="pickchip" data-ckindfilter="all" aria-pressed="' + (kind === 'all') + '">Kaikki</button>';
  CARDIO_KINDS.forEach(function(k){
    h += '<button type="button" class="pickchip" data-ckindfilter="' + k + '" aria-pressed="' + (kind === k) + '">' + k + '</button>';
  });
  h += '</div>';

  if(!list.length){
    h += '<div class="card" style="padding:18px"><p class="muted" style="margin:0">' +
      (kind === 'all' ? 'Ei vielä cardiokirjauksia. Kirjaa ensimmäinen etusivun Cardio-napista.'
                      : 'Ei kirjauksia lajilla ' + esc(kind) + '.') + '</p></div>';
    return h;
  }

  h += '<div class="stats">' +
    '<div class="stat"><b class="mono">' + thisWeek.min + '</b><span>min tällä viikolla</span></div>' +
    '<div class="stat"><b class="mono">' + avg4 + '</b><span>min/vk, 4 viikkoa</span></div>' +
    '<div class="stat"><b class="mono">' + list.length + '</b><span>kertaa yhteensä</span></div>' +
    '<div class="stat"><b class="mono">' + Math.round(totalMin/60*10)/10 + '</b><span>tuntia yhteensä</span></div>' +
    '</div>';

  h += '<div class="card chartbox" id="cardiobox" style="margin-top:10px"></div>';

  if(kind === 'all'){
    const byKind = {};
    list.forEach(function(s){
      const k = s.kind || 'Muu';
      if(!byKind[k]) byKind[k] = {min:0, cnt:0};
      byKind[k].min += num(s.minutes) || 0;
      byKind[k].cnt++;
    });
    h += '<div class="card" style="margin-top:10px;padding:12px 14px"><p class="eyebrow" style="margin-bottom:6px">Lajeittain</p>';
    CARDIO_KINDS.concat(Object.keys(byKind).filter(function(k){ return CARDIO_KINDS.indexOf(k) < 0; }))
      .forEach(function(k){
        if(!byKind[k]) return;
        h += '<div class="sumrow"><span>' + esc(k) + ' <span class="muted">· ' + byKind[k].cnt + ' kertaa</span></span>' +
             '<span class="mono">' + byKind[k].min + ' min</span></div>';
      });
    h += '</div>';
  }

  h += '<div class="card" style="margin-top:10px">';
  list.slice(0,30).forEach(function(s){
    h += '<div class="hitem"><span class="hd mono">' + fmtDate(s.end) + '</span><div style="min-width:0">' +
         '<h4>' + esc(s.kind || 'Cardio') + '</h4>' +
         '<p class="det">' + DAYNAMES[new Date(s.end).getDay()] + '</p></div>' +
         '<span class="chip cardio">' + (num(s.minutes) || '?') + ' min</span></div>';
  });
  h += '</div>';
  return h;
}

function drawCardioChart(){
  const box = document.getElementById('cardiobox');
  const weeks = cardioWeeks(state.person, state.cardioKind, 8);
  const w = Math.max(260, box.clientWidth - 12);
  const h = 180, padL = 36, padR = 12, padT = 22, padB = 30;
  const cs = getComputedStyle(document.body);
  const ink3 = cs.getPropertyValue('--ink-3').trim() || '#78828F';
  const ink2 = cs.getPropertyValue('--ink-2').trim() || '#4B5563';
  const line = cs.getPropertyValue('--line').trim() || '#D9DFE8';
  const acc = cs.getPropertyValue('--cardio').trim() || '#A05908';
  const max = Math.max(60, Math.max.apply(null, weeks.map(function(x){ return x.min; })));
  const plotH = h - padT - padB;
  const bw = (w - padL - padR) / weeks.length;
  const barW = Math.min(34, bw - 8);
  function y(v){ return padT + plotH * (1 - v/max); }

  let svg = '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h +
            '" role="img" aria-label="Cardiominuutit viikoittain">';
  [0, 0.5, 1].forEach(function(t){
    const v = max * t, yy = y(v);
    svg += '<line x1="' + padL + '" y1="' + yy + '" x2="' + (w-padR) + '" y2="' + yy + '" stroke="' + line + '" stroke-width="1"/>';
    svg += '<text x="' + (padL-8) + '" y="' + (yy+4) + '" text-anchor="end" font-size="11" fill="' + ink3 +
           '" font-family="IBM Plex Mono, monospace">' + Math.round(v) + '</text>';
  });
  const best = Math.max.apply(null, weeks.map(function(x){ return x.min; }));
  weeks.forEach(function(wk, i){
    const x = padL + i*bw + (bw - barW)/2;
    const top = y(wk.min);
    const hh = Math.max(wk.min > 0 ? 3 : 0, padT + plotH - top);
    if(hh > 0){
      svg += '<rect x="' + x.toFixed(1) + '" y="' + (padT + plotH - hh).toFixed(1) + '" width="' + barW.toFixed(1) +
             '" height="' + hh.toFixed(1) + '" rx="4" ry="4" fill="' + acc + '"' +
             (i === weeks.length-1 ? '' : ' opacity="0.72"') + '/>';
    }
    const isLabel = (wk.min > 0 && (i === weeks.length-1 || wk.min === best));
    if(isLabel){
      svg += '<text x="' + (x + barW/2).toFixed(1) + '" y="' + (padT + plotH - hh - 7).toFixed(1) +
             '" text-anchor="middle" font-size="11.5" font-weight="600" fill="' + ink2 +
             '" font-family="IBM Plex Mono, monospace">' + wk.min + '</text>';
    }
    if(i === 0 || i === weeks.length-1 || i === Math.floor(weeks.length/2)){
      svg += '<text x="' + (x + barW/2).toFixed(1) + '" y="' + (h-10) + '" text-anchor="middle" font-size="11" fill="' + ink3 +
             '" font-family="IBM Plex Mono, monospace">' + (wk.start.getDate() + '.' + (wk.start.getMonth()+1) + '.') + '</text>';
    }
  });
  svg += '</svg>';
  box.innerHTML = svg;

  const tip = document.createElement('div');
  tip.className = 'tt'; tip.hidden = true;
  box.appendChild(tip);
  box.onpointermove = function(ev){
    const r = box.getBoundingClientRect();
    const px = ev.clientX - r.left - 6;
    let i = Math.floor((px - padL) / bw);
    if(i < 0) i = 0; if(i > weeks.length-1) i = weeks.length-1;
    const wk = weeks[i];
    const en = new Date(wk.start); en.setDate(wk.start.getDate() + 6);
    tip.hidden = false;
    tip.innerHTML = '<b class="mono">' + wk.min + ' min</b> · ' + wk.count + ' kertaa<br>' +
      '<span class="muted">' + wk.start.getDate() + '.' + (wk.start.getMonth()+1) + '.–' + en.getDate() + '.' + (en.getMonth()+1) + '.</span>';
    tip.style.left = (padL + i*bw + bw/2 + 6) + 'px';
    tip.style.top = (y(wk.min) + 12) + 'px';
  };
  box.onpointerleave = function(){ tip.hidden = true; };
}

function chartPoints(person, key){
  const out = [];
  store[person].sessions.slice().sort(function(a,b){ return (a.end||'') < (b.end||'') ? -1 : 1; })
    .forEach(function(s){
      if(!progById(s.pid) || !s.entries) return;
      const arr = s.entries[key];
      if(!arr) return;
      const kg = topKg(arr);
      if(kg <= 0) return;
      const best = arr.filter(function(x){ return num(x.kg) === kg && num(x.reps) > 0; })
        .sort(function(a,b){ return num(b.reps) - num(a.reps); })[0];
      out.push({end:s.end, kg:kg, reps: best ? num(best.reps) : 0, pid:s.pid});
    });
  return out;
}

function drawChart(){
  const box = document.getElementById('chartbox');
  const pts = chartPoints(state.person, state.chartKey);
  const w = Math.max(260, box.clientWidth - 12);
  const h = 170, padL = 38, padR = 46, padT = 16, padB = 26;
  const ink3 = getComputedStyle(document.body).getPropertyValue('--ink-3').trim() || '#78828F';
  const ink2 = getComputedStyle(document.body).getPropertyValue('--ink-2').trim() || '#4B5563';
  const line = getComputedStyle(document.body).getPropertyValue('--line').trim() || '#D9DFE8';
  const acc = getComputedStyle(document.body).getPropertyValue('--up').trim() || '#4F46C7';
  const surf = getComputedStyle(document.body).getPropertyValue('--surface').trim() || '#fff';

  const kgs = pts.map(function(p){ return p.kg; });
  let min = Math.min.apply(null, kgs), max = Math.max.apply(null, kgs);
  if(min === max){ min = Math.max(0, min - 5); max = max + 5; }
  const span = max - min;
  const n = pts.length;
  function x(i){ return n === 1 ? (padL + (w - padL - padR)/2) : padL + (i/(n-1))*(w - padL - padR); }
  function y(v){ return padT + (1 - (v - min)/span) * (h - padT - padB); }

  let svg = '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" role="img" ' +
            'aria-label="Kehityskäyrä: raskain sarja kiloina">';
  [0,0.5,1].forEach(function(t){
    const v = min + span*t, yy = y(v);
    svg += '<line x1="' + padL + '" y1="' + yy + '" x2="' + (w-padR) + '" y2="' + yy + '" stroke="' + line + '" stroke-width="1"/>';
    svg += '<text x="' + (padL-8) + '" y="' + (yy+4) + '" text-anchor="end" font-size="11" fill="' + ink3 +
           '" font-family="IBM Plex Mono, monospace">' + Math.round(v) + '</text>';
  });
  if(n > 1){
    let d = '';
    pts.forEach(function(p,i){ d += (i ? ' L' : 'M') + x(i).toFixed(1) + ' ' + y(p.kg).toFixed(1); });
    svg += '<path d="' + d + '" fill="none" stroke="' + acc + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  }
  pts.forEach(function(p,i){
    const isLast = i === n-1;
    svg += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(p.kg).toFixed(1) + '" r="' + (isLast ? 5.5 : 4) +
           '" fill="' + (isLast ? acc : surf) + '" stroke="' + acc + '" stroke-width="2"/>';
  });
  if(n){
    const lastP = pts[n-1];
    const lbl = lastP.kg + ' kg';
    const fitsR = (x(n-1) + 10 + lbl.length * 7.4) <= w - 2;
    svg += '<text x="' + (fitsR ? (x(n-1)+10) : (x(n-1)-10)) + '" y="' + (y(lastP.kg)+4) + '"' +
           (fitsR ? '' : ' text-anchor="end"') + ' font-size="12" font-weight="600" fill="' + ink2 +
           '" font-family="IBM Plex Mono, monospace">' + lbl + '</text>';
    svg += '<text x="' + padL + '" y="' + (h-7) + '" font-size="11" fill="' + ink3 + '" font-family="IBM Plex Mono, monospace">' +
           fmtDate(pts[0].end) + '</text>';
    if(n > 1)
      svg += '<text x="' + (w-padR) + '" y="' + (h-7) + '" text-anchor="end" font-size="11" fill="' + ink3 +
             '" font-family="IBM Plex Mono, monospace">' + fmtDate(lastP.end) + '</text>';
  }
  svg += '</svg>';
  box.innerHTML = svg;

  const tip = document.createElement('div');
  tip.className = 'tt'; tip.hidden = true;
  box.appendChild(tip);
  box.onpointermove = function(ev){
    if(!n) return;
    const r = box.getBoundingClientRect();
    const px = ev.clientX - r.left - 6;
    let bi = 0, bd = 1e9;
    pts.forEach(function(p,i){ const d = Math.abs(x(i) - px); if(d < bd){ bd = d; bi = i; } });
    const p = pts[bi], pr = progById(p.pid);
    tip.hidden = false;
    tip.innerHTML = '<b class="mono">' + p.kg + ' kg</b> × ' + (p.reps || '–') + ' · ' + fmtDate(p.end) +
                    (pr ? '<br><span class="muted">' + esc(pr.day) + '</span>' : '');
    tip.style.left = (x(bi) + 6) + 'px';
    tip.style.top = (y(p.kg) + 12) + 'px';
  };
  box.onpointerleave = function(){ tip.hidden = true; };

  const t = document.getElementById('charttable');
  let rows = '<div style="padding:12px 14px"><p class="eyebrow" style="margin-bottom:6px">Kirjatut kerrat</p>';
  pts.slice(-10).reverse().forEach(function(p){
    const pr = progById(p.pid);
    rows += '<div class="sumrow"><span>' + fmtDate(p.end) + ' <span class="muted">' + esc(pr ? pr.day : '') + '</span></span>' +
            '<span class="mono">' + p.kg + ' kg × ' + (p.reps || '–') + '</span></div>';
  });
  rows += '</div>';
  t.innerHTML = rows;
}

/* ---------------- KALENTERI ---------------- */

const MONTHS = ['tammikuu','helmikuu','maaliskuu','huhtikuu','toukokuu','kesäkuu',
                'heinäkuu','elokuu','syyskuu','lokakuu','marraskuu','joulukuu'];
const WD_SHORT = ['Ma','Ti','Ke','To','Pe','La','Su'];

function isoAtNoon(iso){
  const b = iso.split('-');
  return new Date(+b[0], +b[1]-1, +b[2], 12, 0, 0).toISOString();
}
function sessionsOn(person, iso){
  return store[person].sessions.filter(function(s){
    return s.end && isoDay(new Date(s.end)) === iso;
  }).sort(function(a,b){ return (a.end || '') < (b.end || '') ? -1 : 1; });
}
function entryLabel(s){
  if(s.pid === 'cardio') return s.kind || 'Cardio';
  if(s.pid === 'rest') return 'Lepopäivä';
  const p = progById(s.pid);
  return p ? p.name : 'Treeni';
}
function entryDetail(s){
  if(s.pid === 'cardio') return (num(s.minutes) || '?') + ' min cardiota';
  if(s.pid === 'rest') return 'Ei treeniä';
  const p = progById(s.pid);
  if(!p) return '';
  let sets = 0;
  if(s.entries) for(const k in s.entries) sets += s.entries[k].length;
  return p.day + ' · ' + sets + ' sarjaa';
}
const KIND_SOFT   = {gym:'var(--up-soft)', cardio:'var(--cardio-soft)', rest:'var(--surface-2)'};
const KIND_STRONG = {gym:'var(--up)',       cardio:'var(--cardio)',    rest:'var(--rest)'};

function entryKindClass(s){
  if(s.pid === 'cardio') return 'cardio';
  if(s.pid === 'rest') return 'rest';
  return 'gym';
}
function entryTag(s){
  const k = entryKindClass(s);
  if(k === 'cardio') return {k:k, t:'C'};
  if(k === 'rest') return {k:k, t:'L'};
  const p = progById(s.pid);
  if(!p) return {k:'rest', t:'?'};
  return {k:k, t:(p.type === 'ala' ? 'A' : 'Y') + p.name.slice(-1)};
}
const KIND_ORDER = ['gym','cardio','rest'];
function sortKinds(kinds){
  return KIND_ORDER.filter(function(k){ return kinds.indexOf(k) >= 0; });
}
function dayStyle(kinds){
  if(!kinds.length) return '';
  return '--k:' + KIND_STRONG[kinds[0]];
}

function renderCalendar(){
  const person = state.person;
  const y = state.calY, m = state.calM;
  const first = new Date(y, m, 1);
  const offset = monIndex(first);
  const days = new Date(y, m+1, 0).getDate();
  const todayIso = isoDay(new Date());

  let gym = 0, cmin = 0, rest = 0;
  for(let d = 1; d <= days; d++){
    sessionsOn(person, isoDay(new Date(y, m, d))).forEach(function(s){
      if(progById(s.pid)) gym++;
      else if(s.pid === 'cardio') cmin += num(s.minutes) || 0;
      else if(s.pid === 'rest') rest++;
    });
  }

  let h = '<div class="phead"><button class="back" type="button" data-view="home">← Alkuvalikko</button>' +
    '<h1>Kalenteri</h1>' +
    '<p class="muted" style="font-size:13.5px;margin:6px 0 0">Napauta päivää, niin voit lisätä, vaihtaa, siirtää tai poistaa sen kirjaukset.</p></div>';

  h += '<div class="calnav">' +
    '<button type="button" class="iconbtn" data-calmove="-1" aria-label="Edellinen kuukausi">‹</button>' +
    '<b>' + MONTHS[m].charAt(0).toUpperCase() + MONTHS[m].slice(1) + ' ' + y + '</b>' +
    '<button type="button" class="iconbtn" data-calmove="1" aria-label="Seuraava kuukausi">›</button>' +
    '<button type="button" class="minibtn" data-calmove="0">Tänään</button>' +
    '</div>';

  h += '<div class="calgrid calhead">';
  WD_SHORT.forEach(function(d){ h += '<span>' + d + '</span>'; });
  h += '</div><div class="calgrid">';
  for(let i = 0; i < offset; i++) h += '<span class="calpad"></span>';
  for(let d = 1; d <= days; d++){
    const iso = isoDay(new Date(y, m, d));
    const logs = sessionsOn(person, iso);
    const tags = [], kinds = [];
    logs.forEach(function(s){
      const tg = entryTag(s);
      if(!tg) return;
      tags.push(tg);
      if(kinds.indexOf(tg.k) < 0) kinds.push(tg.k);
    });
    const ord = sortKinds(kinds);
    const codes = tags.slice(0,2).map(function(tg){ return tg.t; }).join('·') + (tags.length > 2 ? '+' : '');
    let stripe = '';
    if(ord.length > 1){
      stripe = '<span class="cstripe">' + ord.slice(1).map(function(k){
        return '<i class="s-' + k + '"></i>';
      }).join('') + '</span>';
    }
    h += '<button type="button" class="calday' + (iso === todayIso ? ' is-today' : '') +
         (logs.length ? ' has k-' + ord[0] : '') + '" data-calday="' + iso + '" style="' + dayStyle(ord) + '">' +
         '<span class="dn">' + d + '</span>' +
         '<span class="code">' + esc(codes) + '</span>' + stripe + '</button>';
  }
  h += '</div>';

  h += '<div class="callegend">' +
    '<span class="chip"><i class="sw s-gym"></i> Salitreeni</span>' +
    '<span class="chip"><i class="sw s-cardio"></i> Cardio</span>' +
    '<span class="chip"><i class="sw s-rest"></i> Lepo</span>' +
    '</div>';

  h += '<div class="stats" style="margin-top:14px">' +
    '<div class="stat"><b class="mono">' + gym + '</b><span>treeniä kuussa</span></div>' +
    '<div class="stat"><b class="mono">' + cmin + '</b><span>min cardiota</span></div>' +
    '<div class="stat"><b class="mono">' + rest + '</b><span>lepopäivää</span></div>' +
    '</div>';

  views.calendar.innerHTML = h;
}

/* Keskeneräisen treenin suoja: jos treeniin on kirjattu sarjoja, sitä ei
   korvata ilman vahvistusta. Pelkät esitäytetyt painot eivät ole kirjauksia. */
let pendingReplace = null;
function activeWork(){
  const a = store[state.person].active;
  if(!a || !a.entries) return null;
  let n = 0;
  for(const k in a.entries) (a.entries[k] || []).forEach(function(x){ if(num(x.reps) > 0 || x.done) n++; });
  return n ? {a:a, n:n} : null;
}
function guardReplace(what, proceed){
  const w = activeWork();
  if(!w){ proceed(); return; }
  const p = progById(w.a.pid);
  const name = p ? p.name : 'Treeni';
  pendingReplace = proceed;
  const lead = w.a.editId
    ? 'Muokkaat ' + fmtDate(w.a.forceEnd) + ' tallennettua treeniä ' + esc(name) + ' – muutoksia ei ole vielä tallennettu.'
    : esc(name) + ' on kesken: ' + w.n + ' ' + (w.n === 1 ? 'sarja' : 'sarjaa') + ' kirjattu, aloitettu ' + agoText(w.a.start) + '.';

function startEdit(id){
  const cur = store[state.person].active;
  if(cur && cur.editId !== id && activeWork()){
    guardReplace('Toisen treenin muokkaaminen', function(){ store[state.person].active = null; startEdit(id); });
    return;
  }
  const person = state.person;
  const s = store[person].sessions.filter(function(x){ return x.id === id; })[0];
  if(!s || !progById(s.pid)) return;
  const p = progById(s.pid);
  const entries = {};
  p.ex.forEach(function(e){
    const arr = (s.entries && s.entries[e.key]) || [];
    const rows = arr.map(function(x){
      return {kg:String(num(x.kg) || ''), reps:String(num(x.reps) || ''), rir:x.rir || '', done:true};
    });
    while(rows.length < e.sets) rows.push({kg:rows.length ? rows[rows.length-1].kg : '', reps:'', rir:'', done:false});
    entries[e.key] = rows;
  });
  store[person].active = {pid:s.pid, start:s.start || s.end, entries:entries, note:s.note || '',
                          editId:s.id, forceEnd:s.end};
  progDom = null; progChartKey = null;
  overlayEl.innerHTML = '';
  save(person);
  setView('program', s.pid);
}
function startOnDate(pid, iso){
  if(activeWork()){
    guardReplace('Uuden treenin kirjaaminen päivälle ' + fmtDate(isoAtNoon(iso)),
      function(){ store[state.person].active = null; startOnDate(pid, iso); });
    return;
  }
  const person = state.person;
  store[person].active = null;
  progDom = null; progChartKey = null;

  a.forceEnd = isoAtNoon(iso);

   ei avaa tallennusikkunaa. Jakovalikko toimii: iPhonessa "Tallenna Tiedostoihin",

function isTouchDevice(){
  try{ return window.matchMedia('(pointer: coarse)').matches; }catch(e){ return false; }

function shareableFile(fname, txt, mime){
  if(!navigator.share || !navigator.canShare || typeof File === 'undefined') return null;
  try{
    let f = new File([txt], fname, {type:mime});
    if(navigator.canShare({files:[f]})) return f;
    f = new File([txt], fname.replace(/\.[a-z0-9]+$/i, '') + '.txt', {type:'text/plain'});
    if(navigator.canShare({files:[f]})) return f;
  }catch(e){}
  return null;
}
function shareFile(f, ok, fail){
  navigator.share({files:[f], title:f.name}).then(function(){ ok(f.name); }, function(err){
    if(err && err.name === 'AbortError') return;   /* käyttäjä sulki jakovalikon */
    fail(err);
  });
}
function downloadViaLink(fname, txt, mime){
  try{
    const blob = new Blob([txt], {type:mime});
    const url = URL.createObjectURL(blob);
    const el = document.createElement('a');
    el.href = url; el.download = fname;
    document.body.appendChild(el); el.click();
    setTimeout(function(){ URL.revokeObjectURL(url); el.remove(); }, 1500);
    return true;
  }catch(e){ return false; }
}

/* ---- siirto WhatsAppilla ----
   Lähettäjän oman profiilin treenit pakataan (deflate) ja base64-koodataan
   viestiin tunnisteen SALIOHJELMA1: perään. Vastaanottaja liittää koko viestin,
   ja Tuo data poimii koodin viestin seasta. Vanhoissa selaimissa ilman
   pakkausta käytetään tunnistetta SALIOHJELMA0: (pakkaamaton). */
const XFER_RE = /SALIOHJELMA([01]):\s*([A-Za-z0-9+\/=\s]+)/;
const WA_URL_MAX = 6000;   /* tätä pidempi viesti kopioidaan leikepöydälle */
let waMessage = '';
function b64FromBytes(u8){
  let s = '';
  for(let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s);
}
function bytesFromB64(b){
  const s = atob(b);
  const u = new Uint8Array(s.length);
  for(let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
  return u;
}
function streamBytes(u8, stream){
  return new Response(new Blob([u8]).stream().pipeThrough(stream)).arrayBuffer()
    .then(function(b){ return new Uint8Array(b); });
}
function packTransfer(obj){
  const json = JSON.stringify(obj, function(k, v){ return (k === 'rir' && (v === '' || v == null)) ? undefined : v; });
  const u8 = new TextEncoder().encode(json);
  const plain = function(){ return 'SALIOHJELMA0:' + b64FromBytes(u8); };
  if(typeof CompressionStream === 'undefined') return Promise.resolve(plain());
  try{
    return streamBytes(u8, new CompressionStream('deflate-raw'))
      .then(function(c){ return 'SALIOHJELMA1:' + b64FromBytes(c); }, plain);
  }catch(e){ return Promise.resolve(plain()); }
}
/* palauttaa Promisen JSON-tekstistä, tai null jos tekstissä ei ole siirtokoodia */
function unpackTransfer(txt){
  const m = XFER_RE.exec(String(txt || ''));
  if(!m) return null;
  let bytes;
  try{ bytes = bytesFromB64(m[2].replace(/\s+/g, '')); }catch(e){ return Promise.reject(e); }
  if(m[1] === '0') return Promise.resolve(new TextDecoder().decode(bytes));
  if(typeof DecompressionStream === 'undefined') return Promise.reject(new Error('no-decompression'));
  return streamBytes(bytes, new DecompressionStream('deflate-raw'))
    .then(function(u){ return new TextDecoder().decode(u); });
}
function importAny(txt){
  const u = unpackTransfer(txt);
  if(!u){ applyImport(txt); return; }
  u.then(applyImport, function(){
    overlayEl.innerHTML = '<div class="ov"><div class="sheet" role="dialog" aria-label="Tuonti epäonnistui">' +
      '<h3>Viestiä ei voitu lukea</h3><p>Siirtokoodi on vajaa tai tämä selain on liian vanha purkamaan sitä. ' +
      'Varmista, että kopioit koko WhatsApp-viestin, ja yritä uudelleen.</p>' +
      '<div class="sticky-cta"><button class="btn primary" data-close="1">Sulje</button></div></div></div>';
  });
}

function copyFromTextarea(id){

  let ok = false;
  try{
    ta.removeAttribute('readonly');
    ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
    ok = document.execCommand('copy');
  }catch(e){ ok = false; }
  ta.setAttribute('readonly', 'readonly');
  if(!ok && navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(ta.value).then(function(){}, function(){});
    ok = true;   /* lopullinen tulos selviää vasta liittäessä */

  return ok;
}

function applyImport(txt){
  let obj = null;
  try{ obj = JSON.parse(txt); }catch(e){ obj = null; }
  const d = obj && obj.data ? obj.data : obj;
  if(!d || (!d.iida && !d.matti)){
    overlayEl.innerHTML = '<div class="ov"><div class="sheet" role="dialog" aria-label="Tuonti epäonnistui">' +

      '<div class="sticky-cta"><button class="btn primary" data-close="1">Sulje</button></div></div></div>';
    return;
  }
  let added = 0, skipped = 0;
  const perPerson = [];
  PERSONS.forEach(function(pn){
    const inc = d[pn];
    if(!inc || !Array.isArray(inc.sessions)) return;
    const clean = inc.sessions.filter(function(x){
      if(!x || typeof x !== 'object' || !x.id || !x.end) return false;
      if(isNaN(new Date(x.end).getTime())) return false;
      if(x.pid !== 'cardio' && x.pid !== 'rest' && !progById(x.pid)) return false;
      return true;
    });
    skipped += inc.sessions.length - clean.length;
    const before = store[pn].sessions.length;
    store[pn].sessions = mergeSessions(store[pn].sessions, clean);
    added += store[pn].sessions.length - before;
    perPerson.push(personName(pn) + ': ' + (store[pn].sessions.length - before) + ' uutta');
    writeLocal(pn);
    save(pn);
  });

    '<h3>Tiedot tuotu</h3><p>Uusia kirjauksia lisättiin ' + added + ' kpl' +
    (perPerson.length ? ' (' + perPerson.join(', ') + ')' : '') + '. Olemassa olevat säilyivät.' +
    (added && db ? ' Ne tallentuvat myös pilveen.' : '') +
    (skipped ? ' ' + skipped + ' vioittunutta tai tuntematonta kirjausta ohitettiin.' : '') + '</p>' +
    '<div class="sticky-cta"><button class="btn primary" data-close="1">Valmis</button></div></div></div>';

let bottomHidden = false;
let timer = {end:0, total:0, name:'', id:null};
let muted = false;
try{ muted = localStorage.getItem('salikirja-muted') === '1'; }catch(e){}

function startTimer(sec, name){
  bottomHidden = false;
  timer.total = sec; timer.end = Date.now() + sec*1000; timer.name = name;
  if(!timer.id) timer.id = setInterval(tickTimer, 250);
  renderBottom();
}
function tickTimer(){
  const left = timer.end - Date.now();
  const el = document.getElementById('t-count');
  if(!el){ return; }
  const s = Math.max(0, Math.ceil(left/1000));
  el.textContent = Math.floor(s/60) + ':' + pad(s % 60);
  const bar = document.getElementById('t-bar');
  if(bar) bar.style.width = Math.max(0, Math.min(100, (1 - left/(timer.total*1000))*100)) + '%';
  const box = document.getElementById('t-box');
  if(left <= 0){
    if(box && !box.classList.contains('zero')){ box.classList.add('zero'); beep(); }
  }
  if(left < -60000){ stopTimer(); }
}
function stopTimer(){
  clearInterval(timer.id); timer.id = null; timer.end = 0;
  renderBottom();
}
function beep(){
  if(muted) return;
  try{
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) return;
    const ctx = new C();
    [0,0.18].forEach(function(t){
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.type = 'sine';
      g.gain.setValueAtTime(0.0001, ctx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.14);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.16);
    });
    setTimeout(function(){ ctx.close(); }, 900);
  }catch(e){}
}

function renderBottom(){
  const active = store[state.person].active;

  const running = timer.id !== null;
  if(!inProgram && !running){ bottomEl.innerHTML = ''; return; }

  let h = '<div class="bottom"><div class="bottom-in">';

  if(running){

    h += '<div class="timer' + (left <= 0 ? ' zero' : '') + '" id="t-box">' +
      '<span class="t" id="t-count">' + Math.floor(left/60) + ':' + pad(left % 60) + '</span>' +
      '<span class="bar"><i id="t-bar"></i></span>' +

/* tallennus ja yhteenveto */
function finishSession(){
  const person = state.person;
  const a = store[person].active;
  if(!a) return;
  const p = progById(a.pid);
  const prevSess = strengthSessions(person).filter(function(x){
    return x.pid === a.pid && (!a.editId || x.id !== a.editId);
  })[0];
  const entries = {};
  for(const k in a.entries){
    const kept = a.entries[k].filter(function(s){ return num(s.reps) > 0 || num(s.kg) > 0; })
      .map(function(s){ return {kg:num(s.kg), reps:num(s.reps), rir:s.rir || ''}; });
    if(kept.length) entries[k] = kept;
  }
  /* ennätykset ennen tallennusta, jotta ne tunnistetaan vaikka sarjaa ei merkitty tehdyksi */
  const prMap = {};
  p.ex.forEach(function(def){
    const arr = entries[def.key];
    if(!arr || !arr.length) return;
    const best = bestSet(person, def.key);
    if(!best) return;
    let top = null;
    arr.forEach(function(x){
      const kg = num(x.kg), reps = num(x.reps);
      if(reps <= 0) return;
      if(kg > best.kg || (kg === best.kg && reps > best.reps)){
        if(!top || kg > top.kg || (kg === top.kg && reps > top.reps)) top = {kg:kg, reps:reps};
      }
    });
    if(top) prMap[def.key] = {type: top.kg > best.kg ? 'kg' : 'reps',
                              kg:top.kg, reps:top.reps, pkg:best.kg, preps:best.reps};
  });
  const medalMap = {};
  p.ex.forEach(function(def){
    const arr = entries[def.key];
    if(!arr || !arr.length) return;
    const prevInfo = prevForMedal(person, a.pid, def.key, a.editId);
    const m = medalFor(person, a.pid, def, arr, prevInfo, true);
    if(m) medalMap[def.key] = m;
  });

  const endIso = a.forceEnd || new Date().toISOString();
  let savedId = a.editId || ('s' + Date.now());
  if(a.editId){
    let found = false;
    store[person].sessions = store[person].sessions.map(function(x){
      if(x.id !== a.editId) return x;
      found = true;
      return {id:x.id, pid:a.pid, start:x.start || a.start, end:endIso, entries:entries, note:a.note || ''};
    });
    if(!found) store[person].sessions.push({id:savedId, pid:a.pid, start:a.start, end:endIso, entries:entries, note:a.note || ''});
  }else{
    store[person].sessions.push({id:savedId, pid:a.pid, start:a.start, end:endIso, entries:entries, note:a.note || ''});
  }
  store[person].active = null;
  progDom = null;
  save(person);
  stopTimer();

  const rows = [];
  let sets = 0, tonnage = 0, improved = 0;
  p.ex.forEach(function(def){
    const arr = entries[def.key];
    if(!arr) return;
    sets += arr.length;
    arr.forEach(function(x){ tonnage += (num(x.kg) || 0) * (num(x.reps) || 0); });
    const prevArr = prevSess && prevSess.entries ? prevSess.entries[def.key] : null;
    const ad = advice(def, arr, prevArr);
    /* parani = raskaampi paras sarja tai sama paino useammalla toistolla */
    let better = false;
    if(prevArr && prevArr.length){
      const now = arr.slice().sort(function(x,y){ return (num(y.kg) - num(x.kg)) || (num(y.reps) - num(x.reps)); })[0];
      const bef = prevArr.slice().sort(function(x,y){ return (num(y.kg) - num(x.kg)) || (num(y.reps) - num(x.reps)); })[0];
      if(now && bef){
        better = (num(now.kg) > num(bef.kg)) ||
                 (num(now.kg) === num(bef.kg) && num(now.reps) > num(bef.reps));
      }
    }
    if(better) improved++;
    rows.push({name:def.name, sum:setsSummary(arr), ad:ad, better:better,
               medal: medalMap[def.key] || null,
               pr: prMap[def.key] || ''});
  });
  const startMs = a.start ? new Date(a.start).getTime() : 0;
  const mins = startMs ? Math.max(1, Math.round((new Date(endIso).getTime() - startMs) / 60000)) : 0;
  const stats = {mins:mins, sets:sets, tonnage:Math.round(tonnage), improved:improved,
                 prev:prevSess, prevCount:0};
  if(prevSess && prevSess.entries){
    for(const k in prevSess.entries) stats.prevCount += prevSess.entries[k].length;
  }
  showSummary(p, rows, stats, savedId);
}

/* ---------------- VANHAN TREENIN TARKASTELU ----------------
   Tarkastelu näyttää treenin sellaisena kuin se oli: mitalit ja ennätykset
   lasketaan vain sitä edeltävistä kirjauksista, joten vanha kulta pysyy kultana
   vaikka ennätys olisi myöhemmin parantunut.                               */

function sessionById(person, id){
  return store[person].sessions.filter(function(x){ return x.id === id; })[0] || null;
}
function endMsOf(s){ return s && s.end ? new Date(s.end).getTime() : 0; }
/* ennätys ennen annettua hetkeä (kaikki ohjelmat, sama liike) */
function bestSetBefore(person, key, beforeMs, skipId){
  let best = null;
  store[person].sessions.forEach(function(s){
    if(!s.entries || !progById(s.pid)) return;
    if(skipId && s.id === skipId) return;
    if(endMsOf(s) >= beforeMs) return;
    const arr = s.entries[key];
    if(!arr) return;
    arr.forEach(function(x){
      const kg = num(x.kg), reps = num(x.reps);
      if(reps <= 0) return;
      if(!best || kg > best.kg || (kg === best.kg && reps > best.reps))
        best = {kg:kg, reps:reps, end:s.end, pid:s.pid};
    });
  });
  return best;
}
/* vertailukohta ennen annettua hetkeä: sama ohjelma ensin, muuten toinen päivä */
function prevBefore(person, pid, key, beforeMs, skipId){
  const list = strengthSessions(person).filter(function(s){
    return s.id !== skipId && endMsOf(s) < beforeMs;
  });
  for(let i = 0; i < list.length; i++){
    const s = list[i];
    if(s.pid !== pid) continue;
    const arr = s.entries && s.entries[key];
    if(arr && arr.length && arr.some(function(x){ return num(x.reps) > 0; }))
      return {sets:arr, cross:false, pid:pid, end:s.end};
  }
  for(let i = 0; i < list.length; i++){
    const s = list[i];
    const arr = s.entries && s.entries[key];
    if(arr && arr.length && arr.some(function(x){ return num(x.reps) > 0; }))
      return {sets:arr, cross:true, pid:s.pid, end:s.end};
  }
  return null;
}
function prevSessionBefore(person, pid, beforeMs, skipId){
  const list = strengthSessions(person);
  for(let i = 0; i < list.length; i++){
    const s = list[i];
    if(s.pid !== pid || s.id === skipId) continue;
    if(endMsOf(s) >= beforeMs) continue;
    return s;
  }
  return null;
}
function starsHtml(n){
  if(n === 3) return '<i>&#9733;</i><i class="mid">&#9733;</i><i>&#9733;</i>';
  if(n === 2) return '<i>&#9733;</i><i class="mid">&#9733;</i>';
  if(n === 1) return '<i class="mid">&#9733;</i>';
  return '<i class="mid">&#9734;</i>';
}
function medalBadgeHtml(m){
  const t = medalText(m);
  return '<div class="prbadge ' + m.tier + '">' +
    '<span class="prstars" aria-hidden="true">' + starsHtml(t.stars) + '</span>' +

/* ============================================================
   AI-KEHITYSANALYYSI
   Kokoaa treenihistoriasta tekstimuotoisen analyysipaketin ja
   valmiin ohjeen tekoälylle. Kaikki lasketaan tässä laitteessa;
   mitään ei lähetetä minnekään. Ohjelma laskee faktat,
   tulkinta jätetään tekoälylle.
   ============================================================ */

const AI_RANGES = [
  {d:14, l:'Viimeiset 14 päivää'},
  {d:30, l:'Viimeiset 30 päivää'},
  {d:90, l:'Viimeiset 90 päivää'},
  {d:0,  l:'Kaikki harjoitukset'}
];
const AI_MUSCLE = {
  chestpress:'rinta (myös olkapään etuosa ja ojentajat)',
  pecdeck:'rinta',
  lateral:'olkapään sivuosa',
  row:'yläselkä',
  latpull:'leveä selkälihas',
  shrug:'epäkäslihas (niska–hartiaseutu)',
  curl_bar:'hauis',
  hammer:'hauis ja olkavarren lihas / kyynärvarsi',
  triceps:'ojentajat',
  abs:'vatsalihakset',
  hipthrust:'pakarat',
  legpress:'etureidet ja pakarat',
  legcurl:'takareidet',
  abduction:'pakaran sivuosat',
  calf:'pohkeet',
  legext:'etureidet'
};

function aiPad(n){ return n < 10 ? '0' + n : '' + n; }
function aiDate(v){
  const d = new Date(v);
  return aiPad(d.getDate()) + '.' + aiPad(d.getMonth()+1) + '.' + d.getFullYear();
}
function aiN(n){ return String(Math.round(n * 100) / 100).replace('.', ','); }
function aiPct(from, to){
  if(!(from > 0) || !isFinite(to)) return null;
  const r = Math.round(((to - from) / from) * 1000) / 10;
  return (r > 0 ? '+' : '') + String(r).replace('.', ',') + ' %';
}
function aiDays(n){ return n + (n === 1 ? ' päivä' : ' päivää'); }
function aiLoad(kg, reps){ return (kg > 0 ? aiN(kg) + ' kg' : 'oma paino') + ' × ' + reps; }
function aiShort(name){ return String(name).split(/ tai |,| \/ /)[0].trim(); }
function aiRir(x){
  if(!x || x.rir === '' || x.rir == null) return null;
  const n = parseFloat(String(x.rir).replace(',', '.'));
  return isFinite(n) ? n : null;
}
function aiDayMs(v){ const d = new Date(v); d.setHours(0,0,0,0); return d.getTime(); }

/* identtinen duplikaatti = sama ohjelma, sama päivä ja täsmälleen samat sarjat */
function aiSig(s){
  if(s.pid === 'rest') return 'rest|' + isoDay(new Date(s.end));
  if(s.pid === 'cardio') return 'cardio|' + isoDay(new Date(s.end)) + '|' + (s.kind || '') + '|' + (num(s.minutes) || 0);
  const keys = Object.keys(s.entries || {}).sort();
  return s.pid + '|' + isoDay(new Date(s.end)) + '|' + keys.map(function(k){
    return k + ':' + (s.entries[k] || []).map(function(x){
      const r = aiRir(x);
      return num(x.kg) + 'x' + num(x.reps) + '@' + (r === null ? '-' : r);
    }).join(',');
  }).join(';');
}

/* --- 1. kerää valitun jakson kirjaukset --- */
function aiCollect(person, days){
  const today = new Date();
  const all = (store[person].sessions || []).filter(function(s){
    return s && s.end && isFinite(new Date(s.end).getTime());
  }).sort(function(a, b){ return endMsOf(a) - endMsOf(b); });

  let fromMs = -Infinity;
  if(days){
    const d = new Date(today); d.setHours(0,0,0,0); d.setDate(d.getDate() - (days - 1));
    fromMs = d.getTime();
  }
  const seen = {};
  const out = {person:person, days:days, today:today, fromMs:fromMs,
               gym:[], cardio:[], rest:[], dupes:0, firstEverMs:null};
  all.forEach(function(s){
    if(out.firstEverMs === null) out.firstEverMs = aiDayMs(s.end);
    if(endMsOf(s) < fromMs) return;
    if(!progById(s.pid) && s.pid !== 'cardio' && s.pid !== 'rest') return;
    const sig = aiSig(s);
    if(seen[sig]){ out.dupes++; return; }
    seen[sig] = true;
    if(s.pid === 'cardio') out.cardio.push(s);
    else if(s.pid === 'rest') out.rest.push(s);
    else out.gym.push(s);
  });

  /* liikkeet ohjelman järjestyksessä */
  const order = [];
  progsFor(person).forEach(function(p){
    p.ex.forEach(function(e){ if(order.indexOf(e.key) < 0) order.push(e.key); });
  });
  const ex = {};
  out.totalSets = 0; out.rirSets = 0; out.flags = [];
  out.gym.forEach(function(s){
    const p = progById(s.pid);
    Object.keys(s.entries || {}).forEach(function(key){
      const arr = s.entries[key];
      if(!arr || !arr.length) return;
      if(order.indexOf(key) < 0) order.push(key);
      if(!ex[key]){
        let def = null;
        progsFor(person).forEach(function(pp){ pp.ex.forEach(function(e){ if(!def && e.key === key) def = e; }); });
        ex[key] = {key:key, def:def, name:def ? def.name : key, items:[], progs:[]};
      }
      const sets = arr.map(function(x){ return {kg:num(x.kg), reps:num(x.reps), rir:aiRir(x)}; });
      const done = sets.filter(function(x){ return x.reps > 0; });
      let reps = 0, vol = 0, rirN = 0;
      done.forEach(function(x){ reps += x.reps; vol += x.kg * x.reps; });
      sets.forEach(function(x){ out.totalSets++; if(x.rir !== null){ out.rirSets++; rirN++; } });
      const top = done.slice().sort(function(x, y){ return (y.kg - x.kg) || (y.reps - x.reps); })[0] || null;
      const kgs = done.map(function(x){ return x.kg; });
      const item = {
        id:s.id, end:s.end, pid:s.pid, prog:p.name, sets:sets, done:done,
        n:done.length, reps:reps, vol:vol, top:top, rirN:rirN,
        hasKg:kgs.some(function(k){ return k > 0; }),
        evenKg:kgs.length > 0 && kgs.every(function(k){ return k === kgs[0]; })
      };
      const nm = aiShort(ex[key].name);
      if(sets.length > done.length)
        out.flags.push(aiDate(s.end) + ' · ' + nm + ': ' + (sets.length - done.length) +
          ' kirjattu sarja ilman toistomäärää (jätetty laskennan ulkopuolelle)');
      if(done.length && !item.hasKg)
        out.flags.push(aiDate(s.end) + ' · ' + nm + ': painoa ei kirjattu (oma paino tai puuttuva tieto) – volyymia ei laskettu');
      if(item.top && def0(ex[key]) && item.top.reps > def0(ex[key]).hi * 2)
        out.flags.push(aiDate(s.end) + ' · ' + nm + ': ' + item.top.reps + ' toistoa on yli kaksinkertainen ohjelman ylärajaan nähden – mahdollinen kirjausvirhe');
      if(done.length) ex[key].items.push(item);
      if(ex[key].progs.indexOf(p.name) < 0) ex[key].progs.push(p.name);
    });
  });
  out.order = order.filter(function(k){ return ex[k] && ex[k].items.length; });
  out.ex = ex;
  return out;
}
function def0(e){ return e && e.def ? e.def : null; }

/* --- 2. vertailukelpoinen sarja: sama ohjelmapäivä ensin --- */
function aiSeries(e){
  const byProg = {};
  e.items.forEach(function(it){ (byProg[it.pid] = byProg[it.pid] || []).push(it); });
  const series = [];
  Object.keys(byProg).forEach(function(pid){
    if(byProg[pid].length >= 2) series.push({items:byProg[pid], prog:byProg[pid][0].prog, cross:false, def:e.def});
  });
  if(!series.length && e.items.length >= 2) series.push({items:e.items, prog:'eri ohjelmapäivät', cross:true, def:e.def});
  series.lone = [];
  if(series.length && !series[0].cross){
    Object.keys(byProg).forEach(function(pid){
      if(byProg[pid].length === 1) series.lone.push(byProg[pid][0]);
    });
  }
  return series;
}

function aiAvgRir(it){
  const r = it.done.map(function(x){ return x.rir; }).filter(function(x){ return x !== null; });
  if(!r.length) return null;
  return r.reduce(function(a, b){ return a + b; }, 0) / r.length;
}

/* --- 3. mekaaninen luokitus. Ei fysiologisia päätelmiä. --- */
function aiClassify(a, b){
  const kgA = a.top ? a.top.kg : 0, kgB = b.top ? b.top.kg : 0;
  const avgA = a.n ? a.reps / a.n : 0, avgB = b.n ? b.reps / b.n : 0;
  const sameSets = a.n === b.n;
  if(kgB > kgA){
    if(avgB > avgA + 0.01) return {c:'up2', t:'paino ja toistot nousivat samanaikaisesti → erittäin vahva kehitys'};
    if(avgB >= avgA * 0.9) return {c:'up', t:'suurempi paino, suunnilleen sama toistomäärä → kehitys'};
    if(avgB >= avgA * 0.75) return {c:'up', t:'suurempi paino, toistot hieman alempana → todennäköinen kehitys'};
    return {c:'mixed', t:'paino nousi mutta toistot laskivat selvästi → ei yksiselitteistä kehitystä'};
  }
  if(kgB < kgA){
    if(avgB > avgA * 1.1) return {c:'mixed', t:'kevyempi paino mutta selvästi enemmän toistoja → työkapasiteetti ylös, kuorma alas'};
    return {c:'down', t:'kevyempi paino eikä selvästi enempää toistoja → lasku'};
  }
  /* sama paino */
  const moreReps = sameSets ? b.reps > a.reps : avgB > avgA + 0.01;
  const lessReps = sameSets ? b.reps < a.reps : avgB < avgA - 0.01;
  if(moreReps && (sameSets || b.n >= a.n)) return {c:'up', t:'sama paino, enemmän toistoja → kehitys'};
  if(moreReps) return {c:'mixed', t:'sama paino, enemmän toistoja per sarja mutta vähemmän sarjoja → vertaa varoen'};
  if(lessReps) return {c:'down', t:'sama paino, vähemmän toistoja → lasku'};
  if(b.n > a.n) return {c:'up', t:'sama paino ja toistot per sarja, enemmän sarjoja → työmäärä kasvoi'};
  if(b.n < a.n) return {c:'down', t:'sama paino ja toistot per sarja, vähemmän sarjoja → työmäärä laski'};
  const rA = aiAvgRir(a), rB = aiAvgRir(b);
  if(rA !== null && rB !== null){
    if(rB > rA) return {c:'maybe', t:'sama suoritus suuremmalla RIR:llä → mahdollinen kehitys (sama tulos kevyemmällä yrityksellä)'};
    if(rB < rA) return {c:'flat', t:'sama suoritus pienemmällä RIR:llä → EI automaattisesti kehitystä (sama tulos kovemmalla yrityksellä)'};
  }
  return {c:'flat', t:'suoritus täsmälleen ennallaan'};
}
function aiWorse(cur, prv){
  const kc = cur.top ? cur.top.kg : 0, kp = prv.top ? prv.top.kg : 0;
  if(kc !== kp) return kc < kp;
  return cur.n === prv.n ? cur.reps < prv.reps : (cur.reps / cur.n) < (prv.reps / prv.n);
}
function aiDeclineStreak(items){
  let n = 0;
  for(let i = items.length - 1; i > 0; i--){
    if(aiWorse(items[i], items[i-1])) n++; else break;
  }
  return n;
}

/* --- 4. tekstimuotoilu --- */
function aiSetsLines(it){
  const L = [];
  const anyRir = it.done.some(function(x){ return x.rir !== null; });
  if(it.evenKg && !anyRir){
    L.push(it.done[0].kg > 0 ? aiN(it.done[0].kg) + ' kg' : 'oma paino (ei painoa kirjattu)');
    L.push(it.done.map(function(x){ return x.reps; }).join(' / ') + ' reps');
  }else{
    it.done.forEach(function(x, i){
      L.push('Sarja ' + (i+1) + ': ' + (x.kg > 0 ? aiN(x.kg) + ' kg × ' : 'oma paino × ') + x.reps + ' reps' +
        (x.rir !== null ? ' @ RIR ' + aiN(x.rir) : ''));
    });
  }
  L.push('Sarjoja: ' + it.n + ' · Kokonaistoistot: ' + it.reps +
    (it.vol > 0 ? ' · Kokonaisvolyymi: ' + aiN(it.vol) + ' kg' : ''));
  return L;
}
function aiCompact(it){
  const reps = it.done.map(function(x){ return x.reps; }).join('/');
  if(it.evenKg) return (it.done[0].kg > 0 ? aiN(it.done[0].kg) + ' kg' : 'oma paino') + ' × ' + reps;
  return it.done.map(function(x){ return aiLoad(x.kg, x.reps); }).join(', ');
}
function aiCompareLines(ser){
  const a = ser.items[0], b = ser.items[ser.items.length - 1];
  const kgA = a.top ? a.top.kg : 0, kgB = b.top ? b.top.kg : 0;
  const L = [];
  L.push('Ensimmäinen → viimeinen' + (ser.cross ? ' (HUOM: eri ohjelmapäivät, liikejärjestys eroaa – suuntaa-antava)' : ' (' + ser.prog + ')') +
    ', ' + aiDate(a.end) + ' → ' + aiDate(b.end) + ', ' + ser.items.length + ' kirjausta:');
  L.push(aiCompact(a) + '  →  ' + aiCompact(b));
  L.push('Paras sarja: ' + aiLoad(kgA, a.top.reps) + ' → ' + aiLoad(kgB, b.top.reps));
  if(kgA > 0 && kgB > 0) L.push('Painon muutos (paras sarja): ' + aiN(kgA) + ' → ' + aiN(kgB) + ' kg (' + aiPct(kgA, kgB) + ')');
  else L.push('Painon muutos: ei laskettavissa (painoa ei kirjattu).');
  L.push('Sarjoja: ' + a.n + ' → ' + b.n);
  if(kgA === kgB){
    if(a.n === b.n) L.push('Kokonaistoistot: ' + a.reps + ' → ' + b.reps + ' (' + (aiPct(a.reps, b.reps) || '–') + ')');
    else{
      const avA = a.reps / a.n, avB = b.reps / b.n;
      L.push('Kokonaistoistot: ' + a.reps + ' → ' + b.reps + ' · sarjamäärä muuttui, joten vertailukelpoinen luku on toistot per sarja: ' +
        aiN(avA) + ' → ' + aiN(avB) + ' (' + (aiPct(avA, avB) || '–') + ')');
    }
  }else{
    L.push('Kokonaistoistot: ' + a.reps + ' → ' + b.reps + ' · toistoprosenttia ei lasketa, koska paino muuttui (' +
      aiN(kgA) + ' → ' + aiN(kgB) + ' kg)');
  }
  if(a.vol > 0 && b.vol > 0){
    if(a.n === b.n) L.push('Volyymi: ' + aiN(a.vol) + ' → ' + aiN(b.vol) + ' kg (' + aiPct(a.vol, b.vol) + ')');
    else L.push('Volyymi: ' + aiN(a.vol) + ' → ' + aiN(b.vol) + ' kg · prosenttia ei lasketa, koska sarjamäärä muuttui (' + a.n + ' → ' + b.n + ')');
  }else{
    L.push('Volyymi: ei laskettavissa (painoa ei kirjattu).');
  }
  if(!a.evenKg || !b.evenKg) L.push('Huom: painot vaihtelivat sarjojen välillä; vertailu tehty parhaan sarjan mukaan.');
  const rA = aiAvgRir(a), rB = aiAvgRir(b);
  if(rA !== null || rB !== null)
    L.push('RIR (keskiarvo): ' + (rA === null ? 'ei kirjattu' : aiN(rA)) + ' → ' + (rB === null ? 'ei kirjattu' : aiN(rB)));
  if(ser.def){
    const below = function(it){ return it.done.filter(function(x){ return x.reps < ser.def.lo; }).length; };
    const bA = below(a), bB = below(b);
    if(bA || bB) L.push('Sarjoja ohjelman toistoalueen (' + ser.def.lo + '–' + ser.def.hi + ') alapuolella: ' +
      bA + '/' + a.n + ' → ' + bB + '/' + b.n);
  }
  const cl = aiClassify(a, b);
  const streak = aiDeclineStreak(ser.items);
  L.push('Ohjelman luokitus: ' + cl.t);
  if(streak >= 2) L.push('Huom: tulos on heikentynyt ' + streak + ' peräkkäisessä treenissä → mahdollinen taantuminen tai väsymys.');
  return {lines:L, c:cl.c, streak:streak};
}

/* --- 5. ennätykset jakson sisällä (verrattuna koko aiempaan historiaan) --- */
function aiRecords(person, d){
  const out = [];
  d.gym.forEach(function(s){
    Object.keys(s.entries || {}).forEach(function(key){
      const it = d.ex[key] && d.ex[key].items.filter(function(x){ return x.id === s.id; })[0];
      if(!it || !it.top) return;
      const before = bestSetBefore(person, key, endMsOf(s), s.id);
      if(!before) return;
      const kg = it.top.kg, reps = it.top.reps;
      if(kg > before.kg || (kg === before.kg && reps > before.reps)){
        out.push(aiDate(s.end) + ' · ' + aiShort(d.ex[key].name) + ': ' + aiLoad(kg, reps) +
          ' (aiempi paras ' + aiLoad(before.kg, before.reps) + ') – ' +
          (kg > before.kg ? 'painoennätys' : 'toistoennätys samalla painolla'));
      }
    });
  });
  return out;
}

/* --- 6. koko datapaketti --- */
function aiDataText(person, days){
  const d = aiCollect(person, days);
  const todayMs = aiDayMs(d.today);
  const winStart = days ? d.fromMs : (d.firstEverMs !== null ? d.firstEverMs : todayMs);
  const effStart = Math.max(winStart, d.firstEverMs !== null ? d.firstEverMs : todayMs);
  const winDays = Math.round((todayMs - effStart) / 864e5) + 1;
  const L = [];

  L.push(personName(person));
  L.push('Analyysijakso: ' + aiDate(winStart) + '–' + aiDate(todayMs) + ' (' +
    (days ? 'viimeiset ' + days + ' päivää' : 'kaikki harjoitukset') + ')');
  L.push('Harjoituksia (salitreenit): ' + d.gym.length);
  L.push('Lepopäiviä kirjattu: ' + d.rest.length);
  const cmin = d.cardio.reduce(function(a, c){ return a + (num(c.minutes) || 0); }, 0);
  L.push('Cardio-kirjauksia: ' + d.cardio.length + (d.cardio.length ? ' (yhteensä ' + cmin + ' min)' : ''));
  if(d.dupes) L.push('Identtisiä duplikaattikirjauksia ohitettu: ' + d.dupes + ' (laskettu vain kerran)');
  L.push('');

  if(!d.gym.length){
    L.push('VALITULLA JAKSOLLA EI OLE YHTÄÄN SALITREENIÄ.');
    L.push('Kehitysanalyysia ei voi tehdä ilman harjoitusdataa. Kerro tämä suoraan äläkä arvaa.');
    L.push('');
  }else{
    L.push('LASKENTASÄÄNNÖT (ohjelman laskemia faktoja – älä muuta lukuja):');
    L.push('- Mukana vain kirjatut sarjat, joissa on toistomäärä. Tyhjiä sarjoja ei lasketa.');
    L.push('- Kokonaisvolyymi = summa (paino × toistot). Ilman painoa volyymia ei lasketa.');
    L.push('- Vertailukelpoinen kehitys lasketaan saman ohjelmapäivän kirjauksista, koska A- ja B-päivien liikejärjestys eroaa.');
    L.push('- Toistoprosentti lasketaan vain, jos paras paino on sama. Volyymiprosentti vain, jos sarjamäärä on sama.');
    L.push('- "Paras sarja" = raskain sarja, tasatilanteessa enemmän toistoja.');
    L.push('- RIR = varastoon jääneet toistot. Puuttuvia RIR-arvoja ei ole arvattu.');
    L.push('- "Ohjelman luokitus" on mekaaninen vertailu, ei fysiologinen tulkinta. Tulkinta on sinun tehtäväsi.');
    L.push('');
  }

  /* per liike */
  const cats = {up2:[], up:[], maybe:[], flat:[], mixed:[], down:[]};
  const single = [], streaks = [], body = [];
  d.order.forEach(function(key){
    const e = d.ex[key];
    const nm = aiShort(e.name);
    body.push('=== ' + nm.toUpperCase() + ' ===');
    body.push('Liike: ' + e.name);
    if(AI_MUSCLE[key]) body.push('Pääasiallinen lihasryhmä: ' + AI_MUSCLE[key]);
    body.push('Ohjelmat: ' + e.progs.join(', ') +
      (e.def ? ' · ohjelman tavoite ' + e.def.sets + ' sarjaa × ' + e.def.lo + '–' + e.def.hi + ' toistoa' + (e.def.perArm ? ' / käsi' : '') : ''));
    body.push('');
    e.items.forEach(function(it){
      body.push(aiDate(it.end) + ' (' + it.prog + ')');
      aiSetsLines(it).forEach(function(x){ body.push(x); });
      body.push('');
    });
    const series = aiSeries(e);
    if(!series.length){
      single.push(nm);
      body.push('Vain yksi kirjaus tällä jaksolla – kehitystä ei voi arvioida.');
      body.push('');
      return;
    }
    let best = null;
    series.forEach(function(ser){
      const r = aiCompareLines(ser);
      r.lines.forEach(function(x){ body.push(x); });
      body.push('');
      if(!best || ser.items.length > best.n) best = {n:ser.items.length, c:r.c};
      if(r.streak >= 2 && streaks.indexOf(nm) < 0) streaks.push(nm);
    });
    series.lone.forEach(function(it){
      body.push(it.prog + ': vain yksi kirjaus (' + aiDate(it.end) + ', ' + aiCompact(it) +
        ') – ei omaa vertailua, koska eri ohjelmapäivän tulos ei ole suoraan vertailukelpoinen.');
      body.push('');
    });
    cats[best.c].push(nm);
  });

  if(d.gym.length){
    L.push('YHTEENVETO OHJELMAN LUOKITUKSISTA (mekaaninen, tulkitse itse):');
    L.push('- Paino ja toistot nousivat: ' + (cats.up2.length ? cats.up2.join(', ') : '–'));
    L.push('- Kehitystä: ' + (cats.up.length ? cats.up.join(', ') : '–'));
    L.push('- Mahdollista kehitystä (RIR): ' + (cats.maybe.length ? cats.maybe.join(', ') : '–'));
    L.push('- Ennallaan: ' + (cats.flat.length ? cats.flat.join(', ') : '–'));
    L.push('- Ristiriitainen: ' + (cats.mixed.length ? cats.mixed.join(', ') : '–'));
    L.push('- Laskua: ' + (cats.down.length ? cats.down.join(', ') : '–'));
    L.push('- Ei arvioitavissa (vain yksi kirjaus): ' + (single.length ? single.join(', ') : '–'));
    const judged = cats.up2.length + cats.up.length + cats.maybe.length + cats.flat.length + cats.mixed.length + cats.down.length;
    if(judged) L.push('- Kehitystä samanaikaisesti ' + (cats.up2.length + cats.up.length) + ' liikkeessä ' + judged + ' arvioitavasta.');
    else L.push('- Yhtään liikettä ei voi vielä arvioida: jokaisesta on vain yksi kirjaus tällä jaksolla.');
    if(streaks.length) L.push('- Tulos heikentynyt vähintään 2 peräkkäisessä treenissä: ' + streaks.join(', '));
    L.push('');

    L.push('=== TREENILOKI (aikajärjestys) ===');
    const log = d.gym.concat(d.cardio, d.rest).sort(function(a, b){ return endMsOf(a) - endMsOf(b); });
    log.forEach(function(s){
      if(s.pid === 'rest'){ L.push(aiDate(s.end) + ' · Lepopäivä'); return; }
      if(s.pid === 'cardio'){ L.push(aiDate(s.end) + ' · Cardio: ' + (s.kind || 'Muu') + ' ' + (num(s.minutes) || 0) + ' min'); return; }
      let n = 0;
      Object.keys(s.entries || {}).forEach(function(k){
        (s.entries[k] || []).forEach(function(x){ if(num(x.reps) > 0) n++; });
      });
      let mins = s.start ? Math.round((endMsOf(s) - new Date(s.start).getTime()) / 60000) : 0;
      if(!(mins >= 10 && mins <= 300)) mins = 0;
      L.push(aiDate(s.end) + ' · ' + progById(s.pid).name + ' · ' + n + ' työsarjaa' +
        (mins ? ' · ' + mins + ' min' : '') + (s.note ? ' · muistiinpano: "' + String(s.note).replace(/\s+/g, ' ').trim() + '"' : ''));
    });
    L.push('');
  }

  body.forEach(function(x){ L.push(x); });

  if(d.gym.length){
    const recs = aiRecords(person, d);
    L.push('=== UUDET ENNÄTYKSET (PR) TÄLLÄ JAKSOLLA ===');
    if(recs.length) recs.forEach(function(x){ L.push(x); });
    else L.push('Ei uusia ennätyksiä (verrattu jokaisen liikkeen koko aiempaan historiaan).');
    L.push('');
  }

  /* metatiedot */
  const gymDays = {}, anyDays = {};
  d.gym.forEach(function(s){ gymDays[isoDay(new Date(s.end))] = 1; });
  d.gym.concat(d.cardio, d.rest).forEach(function(s){ anyDays[isoDay(new Date(s.end))] = 1; });
  const firstG = d.gym.length ? d.gym[0].end : null;
  const lastG = d.gym.length ? d.gym[d.gym.length - 1].end : null;
  const spanG = firstG ? Math.round((aiDayMs(lastG) - aiDayMs(firstG)) / 864e5) + 1 : 0;
  const weeks = winDays / 7;
  L.push('=== SEURANNAN METATIEDOT ===');
  if(d.firstEverMs === null){
    L.push('Sovellukseen ei ole vielä kirjattu yhtään treeniä, cardiota tai lepopäivää.');
    return L.join('\n');
  }
  L.push('Ensimmäinen salitreeni jaksolla: ' + (firstG ? aiDate(firstG) : '–'));
  L.push('Viimeisin salitreeni: ' + (lastG ? aiDate(lastG) : '–'));
  L.push('Kokonaisseurannan pituus: ' + aiDays(spanG) + ' (ensimmäisestä viimeiseen salitreeniin)');
  L.push('Tarkastelujakso sovelluksen käytön ajalta: ' + aiDays(winDays));
  L.push('Treenipäiviä (sali): ' + Object.keys(gymDays).length);
  L.push('Lepopäiviä kirjattu: ' + d.rest.length);
  L.push('Päiviä ilman mitään kirjausta: ' + Math.max(0, winDays - Object.keys(anyDays).length) +
    ' (voivat olla kirjaamattomia lepopäiviä)');
  L.push('Salitreenejä viikossa koko tarkastelujaksolla: ' + (weeks > 0 ? aiN(Math.round((d.gym.length / weeks) * 10) / 10) : '0') +
    ' (ohjelman tavoite 4)');
  if(d.gym.length >= 2){
    const spanWeeks = Math.max(1, spanG) / 7;
    L.push('Salitreenejä viikossa aktiivisen seurannan aikana (ensimmäisestä viimeiseen treeniin): ' +
      aiN(Math.round((d.gym.length / spanWeeks) * 10) / 10));
    let gaps = [], prev = null;
    Object.keys(gymDays).sort().forEach(function(k){
      const ms = aiDayMs(k + 'T12:00:00');
      if(prev !== null) gaps.push(Math.round((ms - prev) / 864e5));
      prev = ms;
    });
    if(gaps.length) L.push('Päiviä salitreenien välissä: ' + gaps.join(', ') +
      ' (lyhin ' + Math.min.apply(null, gaps) + ', pisin ' + Math.max.apply(null, gaps) + ')');
  }
  L.push('Cardio-kertoja viikossa keskimäärin: ' + (weeks > 0 ? aiN(Math.round((d.cardio.length / weeks) * 10) / 10) : '0'));
  L.push('Kirjattuja sarjoja yhteensä: ' + d.totalSets);
  L.push('RIR-merkintöjä käytettävissä: ' + d.rirSets + '/' + d.totalSets + ' sarjassa');
  L.push('Liikkeet, joista vain yksi datapiste (kehitystä ei voi arvioida): ' + (single.length ? single.join(', ') : 'ei yhtään'));
  L.push('');
  L.push('=== PUUTTUVAT TAI EPÄLUOTETTAVAT TIEDOT ===');
  const issues = [];
  d.flags.forEach(function(x){ if(issues.indexOf(x) < 0) issues.push(x); });
  if(d.totalSets && d.rirSets === 0) issues.push('RIR-arvoja ei ole kirjattu yhdessäkään sarjassa – älä tee oletuksia treenin kuormittavuudesta.');
  else if(d.totalSets && d.rirSets < d.totalSets) issues.push('RIR puuttuu ' + (d.totalSets - d.rirSets) + ' sarjasta – käsitelty puuttuvana.');
  if(d.gym.length && d.gym.length < 4) issues.push('Salitreenejä on vain ' + d.gym.length + ' – johtopäätökset ovat suuntaa-antavia.');
  if(single.length) issues.push(single.length + ' liikkeestä on vain yksi kirjaus.');
  if(d.dupes) issues.push(d.dupes + ' identtistä duplikaattia poistettu laskennasta.');
  if(issues.length) issues.slice(0, 50).forEach(function(x){ L.push('- ' + x); });
  else L.push('Ei havaittuja puutteita.');
  if(issues.length > 50) L.push('- (+' + (issues.length - 50) + ' muuta vastaavaa)');
  return L.join('\n');
}

/* --- lataus: artefaktissa downloads-kyvykkyys, offline-tiedostossa tavallinen lataus --- */
function aiSaveFile(fname, txt, mime){
  function viaLink(){
    if(downloadViaLink(fname, txt, mime))
      aiNotice('Lataus käynnistetty: ' + fname + '. Jos tiedostoa ei näy Latauksissa, käytä Kopioi-nappia.', false);
    else aiNotice('Lataus ei onnistunut tässä selaimessa. Kopioi teksti Kopioi-napilla.', true);
  }
  /* puhelimessa jakovalikko: toimii myös kotinäytön sovelluksessa */
  if(!(window.claude && window.claude.use) && isTouchDevice()){
    const f = shareableFile(fname, txt, mime);
    if(f){
      shareFile(f, function(n){ aiNotice('Jaettu: ' + n, false); }, viaLink);
      return;
    }
  }
  if(window.claude && window.claude.use){
    const blocked = function(){
      claudeDlOff = true;
      aiNotice('Claude-sovellus ei salli tiedostolatausta tälle tilille. Käytä Kopioi AI-analyysi -nappia.', true);
    };
    if(claudeDlOff){ blocked(); return; }
    window.claude.use('downloads').then(function(d){
      if(!d || !d.save){ blocked(); return; }
      d.save({filename:fname, data:txt}).then(function(){ aiNotice('Tallennettu: ' + fname, false); })
        .catch(function(err){
          const code = err && err.code;
          if(code === 'declined') return;
          if(code === 'rate_limited'){ aiNotice('Tallennusikkuna on jo auki. Yritä hetken päästä.', true); return; }
          blocked();
        });
    }).catch(blocked);
  }else{
    viaLink();
  }
}
function aiNotice(msg, warn){
  const el = document.getElementById('ai-msg');
  if(!el) return;
  el.textContent = msg;
  el.style.borderLeftColor = warn ? 'var(--warn)' : 'var(--up)';
  el.hidden = false;
}
function aiFileName(ext){
  return personName(state.person) + '-AI-kehitysanalyysi-' + isoDay(new Date()) + '.' + ext;
}

function showAI(){
  const person = state.person;
  const days = state.aiRange;
  const d = aiCollect(person, days);
  const txt = aiFullText(person, days);

       'Kopioi paketti mihin tahansa tekoälyyn – mitään ei lähetetä automaattisesti.</p>';

       '<span class="chip">Profiili: ' + esc(personName(person)) + '</span></div>';

    '<div class="stat"><b class="mono">' + d.rest.length + '</b><span>lepopäivää</span></div>' +

  }
  if(d.dupes){
