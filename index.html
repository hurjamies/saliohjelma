const CARDIO_KINDS = ['Hyrox','Jumppa','Juoksu','Muu'];

function cardioSessions(person, kind){
  return store[person].sessions.filter(function(s){
    return s.pid === 'cardio' && (!kind || kind === 'all' || (s.kind || 'Muu') === kind);
  }).sort(function(a,b){ return (a.end || '') < (b.end || '') ? 1 : -1; });
}
function weekStartOf(d){
  const m = new Date(d); m.setHours(0,0,0,0); m.setDate(m.getDate() - monIndex(m)); return m;
}
function cardioWeeks(person, kind, weeks){
  const thisMonday = weekStartOf(new Date());
  const list = cardioSessions(person, kind);
  const out = [];
  for(let i = weeks - 1; i >= 0; i--){
    const st = new Date(thisMonday); st.setDate(thisMonday.getDate() - i*7);
    const en = new Date(st); en.setDate(st.getDate() + 7);
    let min = 0, cnt = 0;
    list.forEach(function(s){
      const d = new Date(s.end);
      if(d >= st && d < en){ min += num(s.minutes) || 0; cnt++; }
    });
    out.push({start:st, min:min, count:cnt});
  }
  return out;
}

function renderCardioTab(person){
  const kind = state.cardioKind;
  const list = cardioSessions(person, kind);
  const weeks = cardioWeeks(person, kind, 8);
  const thisWeek = weeks[weeks.length-1];
  const last4 = weeks.slice(-4);
  const avg4 = Math.round(last4.reduce(function(a,w){ return a + w.min; }, 0) / 4);
  const totalMin = list.reduce(function(a,s){ return a + (num(s.minutes) || 0); }, 0);

  let h = '<div class="pickrow" style="margin-bottom:10px">';
  h += '<button type="button" class="pickchip" data-ckindfilter="all" aria-pressed="' + (kind === 'all') + '">Kaikki</button>';
  CARDIO_KINDS.forEach(function(k){
    h += '<button type="button" class="pickchip" data-ckindfilter="' + k + '" aria-pressed="' + (kind === k) + '">' + k + '</button>';
  });
  h += '</div>';

  if(!list.length){
    h += '<div class="card" style="padding:18px"><p class="muted" style="margin:0">' +
      (kind === 'all' ? 'Ei vielä cardiokirjauksia. Kirjaa ensimmäinen etusivun Cardio-napista.'
                      : 'Ei kirjauksia lajilla ' + esc(kind) + '.') + '</p></div>';
    return h;
  }

  h += '<div class="stats">' +
    '<div class="stat"><b class="mono">' + thisWeek.min + '</b><span>min tällä viikolla</span></div>' +
    '<div class="stat"><b class="mono">' + avg4 + '</b><span>min/vk, 4 viikkoa</span></div>' +
    '<div class="stat"><b class="mono">' + list.length + '</b><span>kertaa yhteensä</span></div>' +
    '<div class="stat"><b class="mono">' + Math.round(totalMin/60*10)/10 + '</b><span>tuntia yhteensä</span></div>' +
    '</div>';

  h += '<div class="card chartbox" id="cardiobox" style="margin-top:10px"></div>';

  if(kind === 'all'){
    const byKind = {};
    list.forEach(function(s){
      const k = s.kind || 'Muu';
      if(!byKind[k]) byKind[k] = {min:0, cnt:0};
      byKind[k].min += num(s.minutes) || 0;
      byKind[k].cnt++;
    });
    h += '<div class="card" style="margin-top:10px;padding:12px 14px"><p class="eyebrow" style="margin-bottom:6px">Lajeittain</p>';
    CARDIO_KINDS.concat(Object.keys(byKind).filter(function(k){ return CARDIO_KINDS.indexOf(k) < 0; }))
      .forEach(function(k){
        if(!byKind[k]) return;
        h += '<div class="sumrow"><span>' + esc(k) + ' <span class="muted">· ' + byKind[k].cnt + ' kertaa</span></span>' +
             '<span class="mono">' + byKind[k].min + ' min</span></div>';
      });
    h += '</div>';
  }

  h += '<div class="card" style="margin-top:10px">';
  list.slice(0,30).forEach(function(s){
    h += '<div class="hitem"><span class="hd mono">' + fmtDate(s.end) + '</span><div style="min-width:0">' +
         '<h4>' + esc(s.kind || 'Cardio') + '</h4>' +
         '<p class="det">' + DAYNAMES[new Date(s.end).getDay()] + '</p></div>' +
         '<span class="chip cardio">' + (num(s.minutes) || '?') + ' min</span></div>';
  });
  h += '</div>';
  return h;
}

function drawCardioChart(){
  const box = document.getElementById('cardiobox');
  const weeks = cardioWeeks(state.person, state.cardioKind, 8);
  const w = Math.max(260, box.clientWidth - 12);
  const h = 180, padL = 36, padR = 12, padT = 22, padB = 30;
  const cs = getComputedStyle(document.body);
  const ink3 = cs.getPropertyValue('--ink-3').trim() || '#78828F';
  const ink2 = cs.getPropertyValue('--ink-2').trim() || '#4B5563';
  const line = cs.getPropertyValue('--line').trim() || '#D9DFE8';
  const acc = cs.getPropertyValue('--cardio').trim() || '#A05908';
  const max = Math.max(60, Math.max.apply(null, weeks.map(function(x){ return x.min; })));
  const plotH = h - padT - padB;
  const bw = (w - padL - padR) / weeks.length;
  const barW = Math.min(34, bw - 8);
  function y(v){ return padT + plotH * (1 - v/max); }

  let svg = '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h +
            '" role="img" aria-label="Cardiominuutit viikoittain">';
  [0, 0.5, 1].forEach(function(t){
    const v = max * t, yy = y(v);
    svg += '<line x1="' + padL + '" y1="' + yy + '" x2="' + (w-padR) + '" y2="' + yy + '" stroke="' + line + '" stroke-width="1"/>';
    svg += '<text x="' + (padL-8) + '" y="' + (yy+4) + '" text-anchor="end" font-size="11" fill="' + ink3 +
           '" font-family="IBM Plex Mono, monospace">' + Math.round(v) + '</text>';
  });
  const best = Math.max.apply(null, weeks.map(function(x){ return x.min; }));
  weeks.forEach(function(wk, i){
    const x = padL + i*bw + (bw - barW)/2;
    const top = y(wk.min);
    const hh = Math.max(wk.min > 0 ? 3 : 0, padT + plotH - top);
    if(hh > 0){
      svg += '<rect x="' + x.toFixed(1) + '" y="' + (padT + plotH - hh).toFixed(1) + '" width="' + barW.toFixed(1) +
             '" height="' + hh.toFixed(1) + '" rx="4" ry="4" fill="' + acc + '"' +
             (i === weeks.length-1 ? '' : ' opacity="0.72"') + '/>';
    }
    const isLabel = (wk.min > 0 && (i === weeks.length-1 || wk.min === best));
    if(isLabel){
      svg += '<text x="' + (x + barW/2).toFixed(1) + '" y="' + (padT + plotH - hh - 7).toFixed(1) +
             '" text-anchor="middle" font-size="11.5" font-weight="600" fill="' + ink2 +
             '" font-family="IBM Plex Mono, monospace">' + wk.min + '</text>';
    }
    if(i === 0 || i === weeks.length-1 || i === Math.floor(weeks.length/2)){
      svg += '<text x="' + (x + barW/2).toFixed(1) + '" y="' + (h-10) + '" text-anchor="middle" font-size="11" fill="' + ink3 +
             '" font-family="IBM Plex Mono, monospace">' + (wk.start.getDate() + '.' + (wk.start.getMonth()+1) + '.') + '</text>';
    }
  });
  svg += '</svg>';
  box.innerHTML = svg;

  const tip = document.createElement('div');
  tip.className = 'tt'; tip.hidden = true;
  box.appendChild(tip);
  box.onpointermove = function(ev){
    const r = box.getBoundingClientRect();
    const px = ev.clientX - r.left - 6;
    let i = Math.floor((px - padL) / bw);
    if(i < 0) i = 0; if(i > weeks.length-1) i = weeks.length-1;
    const wk = weeks[i];
    const en = new Date(wk.start); en.setDate(wk.start.getDate() + 6);
    tip.hidden = false;
    tip.innerHTML = '<b class="mono">' + wk.min + ' min</b> · ' + wk.count + ' kertaa<br>' +
      '<span class="muted">' + wk.start.getDate() + '.' + (wk.start.getMonth()+1) + '.–' + en.getDate() + '.' + (en.getMonth()+1) + '.</span>';
    tip.style.left = (padL + i*bw + bw/2 + 6) + 'px';
    tip.style.top = (y(wk.min) + 12) + 'px';
  };
  box.onpointerleave = function(){ tip.hidden = true; };
}

function chartPoints(person, key){
  const out = [];
  store[person].sessions.slice().sort(function(a,b){ return (a.end||'') < (b.end||'') ? -1 : 1; })
    .forEach(function(s){
      if(!progById(s.pid) || !s.entries) return;
      const arr = s.entries[key];
      if(!arr) return;
      const kg = topKg(arr);
      if(kg <= 0) return;
      const best = arr.filter(function(x){ return num(x.kg) === kg && num(x.reps) > 0; })
        .sort(function(a,b){ return num(b.reps) - num(a.reps); })[0];
      out.push({end:s.end, kg:kg, reps: best ? num(best.reps) : 0, pid:s.pid});
    });
  return out;
}

function drawChart(){
  const box = document.getElementById('chartbox');
  const pts = chartPoints(state.person, state.chartKey);
  const w = Math.max(260, box.clientWidth - 12);
  const h = 170, padL = 38, padR = 46, padT = 16, padB = 26;
  const ink3 = getComputedStyle(document.body).getPropertyValue('--ink-3').trim() || '#78828F';
  const ink2 = getComputedStyle(document.body).getPropertyValue('--ink-2').trim() || '#4B5563';
  const line = getComputedStyle(document.body).getPropertyValue('--line').trim() || '#D9DFE8';
  const acc = getComputedStyle(document.body).getPropertyValue('--up').trim() || '#4F46C7';
  const surf = getComputedStyle(document.body).getPropertyValue('--surface').trim() || '#fff';

  const kgs = pts.map(function(p){ return p.kg; });
  let min = Math.min.apply(null, kgs), max = Math.max.apply(null, kgs);
  if(min === max){ min = Math.max(0, min - 5); max = max + 5; }
  const span = max - min;
  const n = pts.length;
  function x(i){ return n === 1 ? (padL + (w - padL - padR)/2) : padL + (i/(n-1))*(w - padL - padR); }
  function y(v){ return padT + (1 - (v - min)/span) * (h - padT - padB); }

  let svg = '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" role="img" ' +
            'aria-label="Kehityskäyrä: raskain sarja kiloina">';
  [0,0.5,1].forEach(function(t){
    const v = min + span*t, yy = y(v);
    svg += '<line x1="' + padL + '" y1="' + yy + '" x2="' + (w-padR) + '" y2="' + yy + '" stroke="' + line + '" stroke-width="1"/>';
    svg += '<text x="' + (padL-8) + '" y="' + (yy+4) + '" text-anchor="end" font-size="11" fill="' + ink3 +
           '" font-family="IBM Plex Mono, monospace">' + Math.round(v) + '</text>';
  });
  if(n > 1){
    let d = '';
    pts.forEach(function(p,i){ d += (i ? ' L' : 'M') + x(i).toFixed(1) + ' ' + y(p.kg).toFixed(1); });
    svg += '<path d="' + d + '" fill="none" stroke="' + acc + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  }
  pts.forEach(function(p,i){
    const isLast = i === n-1;
    svg += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(p.kg).toFixed(1) + '" r="' + (isLast ? 5.5 : 4) +
           '" fill="' + (isLast ? acc : surf) + '" stroke="' + acc + '" stroke-width="2"/>';
  });
  if(n){
    const lastP = pts[n-1];
    const lbl = lastP.kg + ' kg';
    const fitsR = (x(n-1) + 10 + lbl.length * 7.4) <= w - 2;
    svg += '<text x="' + (fitsR ? (x(n-1)+10) : (x(n-1)-10)) + '" y="' + (y(lastP.kg)+4) + '"' +
           (fitsR ? '' : ' text-anchor="end"') + ' font-size="12" font-weight="600" fill="' + ink2 +
           '" font-family="IBM Plex Mono, monospace">' + lbl + '</text>';
    svg += '<text x="' + padL + '" y="' + (h-7) + '" font-size="11" fill="' + ink3 + '" font-family="IBM Plex Mono, monospace">' +
           fmtDate(pts[0].end) + '</text>';
    if(n > 1)
      svg += '<text x="' + (w-padR) + '" y="' + (h-7) + '" text-anchor="end" font-size="11" fill="' + ink3 +
             '" font-family="IBM Plex Mono, monospace">' + fmtDate(lastP.end) + '</text>';
  }
  svg += '</svg>';
  box.innerHTML = svg;

  const tip = document.createElement('div');
  tip.className = 'tt'; tip.hidden = true;
  box.appendChild(tip);
  box.onpointermove = function(ev){
    if(!n) return;
    const r = box.getBoundingClientRect();
    const px = ev.clientX - r.left - 6;
    let bi = 0, bd = 1e9;
    pts.forEach(function(p,i){ const d = Math.abs(x(i) - px); if(d < bd){ bd = d; bi = i; } });
    const p = pts[bi], pr = progById(p.pid);
    tip.hidden = false;
    tip.innerHTML = '<b class="mono">' + p.kg + ' kg</b> × ' + (p.reps || '–') + ' · ' + fmtDate(p.end) +
                    (pr ? '<br><span class="muted">' + esc(pr.day) + '</span>' : '');
    tip.style.left = (x(bi) + 6) + 'px';
    tip.style.top = (y(p.kg) + 12) + 'px';
  };
  box.onpointerleave = function(){ tip.hidden = true; };

  const t = document.getElementById('charttable');
  let rows = '<div style="padding:12px 14px"><p class="eyebrow" style="margin-bottom:6px">Kirjatut kerrat</p>';
  pts.slice(-10).reverse().forEach(function(p){
    const pr = progById(p.pid);
    rows += '<div class="sumrow"><span>' + fmtDate(p.end) + ' <span class="muted">' + esc(pr ? pr.day : '') + '</span></span>' +
            '<span class="mono">' + p.kg + ' kg × ' + (p.reps || '–') + '</span></div>';
  });
  rows += '</div>';
  t.innerHTML = rows;
}

const MONTHS = ['tammikuu','helmikuu','maaliskuu','huhtikuu','toukokuu','kesäkuu',
                'heinäkuu','elokuu','syyskuu','lokakuu','marraskuu','joulukuu'];
const WD_SHORT = ['Ma','Ti','Ke','To','Pe','La','Su'];

function isoAtNoon(iso){
  const b = iso.split('-');
  return new Date(+b[0], +b[1]-1, +b[2], 12, 0, 0).toISOString();
}
function sessionsOn(person, iso){
  return store[person].sessions.filter(function(s){
    return s.end && isoDay(new Date(s.end)) === iso;
  }).sort(function(a,b){ return (a.end || '') < (b.end || '') ? -1 : 1; });
}
function entryLabel(s){
  if(s.pid === 'cardio') return s.kind || 'Cardio';
  if(s.pid === 'rest') return 'Lepopäivä';
  const p = progById(s.pid);
  return p ? p.name : 'Treeni';
}
function entryDetail(s){
  if(s.pid === 'cardio') return (num(s.minutes) || '?') + ' min cardiota';
  if(s.pid === 'rest') return 'Ei treeniä';
  const p = progById(s.pid);
  if(!p) return '';
  let sets = 0;
  if(s.entries) for(const k in s.entries) sets += s.entries[k].length;
  return p.day + ' · ' + sets + ' sarjaa';
}
const KIND_SOFT   = {gym:'var(--up-soft)', cardio:'var(--cardio-soft)', rest:'var(--surface-2)'};
const KIND_STRONG = {gym:'var(--up)',       cardio:'var(--cardio)',    rest:'var(--rest)'};

function entryKindClass(s){
  if(s.pid === 'cardio') return 'cardio';
  if(s.pid === 'rest') return 'rest';
  return 'gym';
}
function entryTag(s){
  const k = entryKindClass(s);
  if(k === 'cardio') return {k:k, t:'C'};
  if(k === 'rest') return {k:k, t:'L'};
  const p = progById(s.pid);
  if(!p) return {k:'rest', t:'?'};
  return {k:k, t:(p.type === 'ala' ? 'A' : 'Y') + p.name.slice(-1)};
}
const KIND_ORDER = ['gym','cardio','rest'];
function sortKinds(kinds){
  return KIND_ORDER.filter(function(k){ return kinds.indexOf(k) >= 0; });
}
function dayStyle(kinds){
  if(!kinds.length) return '';
  return '--k:' + KIND_STRONG[kinds[0]];
}

function renderCalendar(){
  const person = state.person;
  const y = state.calY, m = state.calM;
  const first = new Date(y, m, 1);
  const offset = monIndex(first);
  const days = new Date(y, m+1, 0).getDate();
  const todayIso = isoDay(new Date());

  let gym = 0, cmin = 0, rest = 0;
  for(let d = 1; d <= days; d++){
    sessionsOn(person, isoDay(new Date(y, m, d))).forEach(function(s){
      if(progById(s.pid)) gym++;
      else if(s.pid === 'cardio') cmin += num(s.minutes) || 0;
      else if(s.pid === 'rest') rest++;
    });
  }

  let h = '<div class="phead"><button class="back" type="button" data-view="home">← Alkuvalikko</button>' +
    '<h1>Kalenteri</h1>' +
    '<p class="muted" style="font-size:13.5px;margin:6px 0 0">Napauta päivää, niin voit lisätä, vaihtaa, siirtää tai poistaa sen kirjaukset.</p></div>';

  h += '<div class="calnav">' +
    '<button type="button" class="iconbtn" data-calmove="-1" aria-label="Edellinen kuukausi">‹</button>' +
    '<b>' + MONTHS[m].charAt(0).toUpperCase() + MONTHS[m].slice(1) + ' ' + y + '</b>' +
    '<button type="button" class="iconbtn" data-calmove="1" aria-label="Seuraava kuukausi">›</button>' +
    '<button type="button" class="minibtn" data-calmove="0">Tänään</button>' +
    '</div>';

  h += '<div class="calgrid calhead">';
  WD_SHORT.forEach(function(d){ h += '<span>' + d + '</span>'; });
  h += '</div><div class="calgrid">';
  for(let i = 0; i < offset; i++) h += '<span class="calpad"></span>';
  for(let d = 1; d <= days; d++){
    const iso = isoDay(new Date(y, m, d));
    const logs = sessionsOn(person, iso);
    const tags = [], kinds = [];
    logs.forEach(function(s){
      const tg = entryTag(s);
      if(!tg) return;
      tags.push(tg);
      if(kinds.indexOf(tg.k) < 0) kinds.push(tg.k);
    });
    const ord = sortKinds(kinds);
    const codes = tags.slice(0,2).map(function(tg){ return tg.t; }).join('·') + (tags.length > 2 ? '+' : '');
    let stripe = '';
    if(ord.length > 1){
      stripe = '<span class="cstripe">' + ord.slice(1).map(function(k){
        return '<i class="s-' + k + '"></i>';
      }).join('') + '</span>';
    }
    h += '<button type="button" class="calday' + (iso === todayIso ? ' is-today' : '') +
         (logs.length ? ' has k-' + ord[0] : '') + '" data-calday="' + iso + '" style="' + dayStyle(ord) + '">' +
         '<span class="dn">' + d + '</span>' +
         '<span class="code">' + esc(codes) + '</span>' + stripe + '</button>';
  }
  h += '</div>';

  h += '<div class="callegend">' +
    '<span class="chip"><i class="sw s-gym"></i> Salitreeni</span>' +
    '<span class="chip"><i class="sw s-cardio"></i> Cardio</span>' +
    '<span class="chip"><i class="sw s-rest"></i> Lepo</span>' +
    '</div>';

  h += '<div class="stats" style="margin-top:14px">' +
    '<div class="stat"><b class="mono">' + gym + '</b><span>treeniä kuussa</span></div>' +
    '<div class="stat"><b class="mono">' + cmin + '</b><span>min cardiota</span></div>' +
    '<div class="stat"><b class="mono">' + rest + '</b><span>lepopäivää</span></div>' +
    '</div>';

  views.calendar.innerHTML = h;
}

/* muokkaa aiempaa treeniä ohjelmanäkymässä */
function startEdit(id){
  const person = state.person;
  const s = store[person].sessions.filter(function(x){ return x.id === id; })[0];
  if(!s || !progById(s.pid)) return;
  const p = progById(s.pid);
  const entries = {};
  p.ex.forEach(function(e){
    const arr = (s.entries && s.entries[e.key]) || [];
    const rows = arr.map(function(x){
      return {kg:String(num(x.kg) || ''), reps:String(num(x.reps) || ''), rir:x.rir || '', done:true};
    });
    while(rows.length < e.sets) rows.push({kg:rows.length ? rows[rows.length-1].kg : '', reps:'', rir:'', done:false});
    entries[e.key] = rows;
  });
  store[person].active = {pid:s.pid, start:s.start || s.end, entries:entries, note:s.note || '',
                          editId:s.id, forceEnd:s.end};
  progDom = null; progChartKey = null;
  overlayEl.innerHTML = '';
  save(person);
  setView('program', s.pid);
}
function startOnDate(pid, iso){
  const person = state.person;
  store[person].active = null;
  progDom = null; progChartKey = null;
  overlayEl.innerHTML = '';
  const a = ensureActive(pid);
  a.forceEnd = isoAtNoon(iso);
  save(person);
  setView('program', pid);
}

/* ---- varmuuskopio ---- */
function backupPayload(){
  return JSON.stringify({
    app:'saliohjelma', version:'5.5', exported:new Date().toISOString(),
    data:{iida:store.iida, matti:store.matti}
  }, null, 1);
}
function exportData(){
  const txt = backupPayload();
  const fname = 'saliohjelma-' + isoDay(new Date()) + '.json';
  if(window.claude && window.claude.use){
    window.claude.use('downloads').then(function(d){
      if(d && d.save){
        d.save({filename:fname, data:txt}).then(function(){ showBackupDone(fname); })
          .catch(function(){ showRawBackup(txt, fname); });
      }else{
        showRawBackup(txt, fname);
      }
    }).catch(function(){ showRawBackup(txt, fname); });
  }else{
    /* offline-tiedosto: tavallinen lataus toimii */
    try{
      const blob = new Blob([txt], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const el = document.createElement('a');
      el.href = url; el.download = fname;
      document.body.appendChild(el); el.click();
      setTimeout(function(){ URL.revokeObjectURL(url); el.remove(); }, 1500);
      showBackupDone(fname);
    }catch(e){ showRawBackup(txt, fname); }
  }
}
function showBackupDone(fname){
  overlayEl.innerHTML = '<div class="ov"><div class="sheet" role="dialog" aria-label="Varmuuskopio">' +
    '<h3>Varmuuskopio tallennettu</h3><p class="mono" style="font-size:12.5px">' + esc(fname) + '</p>' +
    '<div class="sticky-cta"><button class="btn primary" data-close="1">Valmis</button></div></div></div>';
}
function showRawBackup(txt, fname){
  overlayEl.innerHTML = '<div class="ov"><div class="sheet" role="dialog" aria-label="Varmuuskopio">' +
    '<h3>Varmuuskopio</h3>' +
    '<p>Kopioi teksti talteen (esim. muistiinpanoihin tai pilveen). Sama teksti palauttaa tiedot Tuo-napista.</p>' +
    '<textarea id="bk-text" class="pick" rows="7" readonly style="font-family:var(--font-m);font-size:11px">' + esc(txt) + '</textarea>' +
    '<div class="pickrow" style="margin-top:10px"><button class="btn ghost" data-copybk="1">Kopioi leikepöydälle</button></div>' +
    '<div class="sticky-cta"><button class="btn primary" data-close="1">Valmis</button></div></div></div>';
}
function showImport(){
  overlayEl.innerHTML = '<div class="ov"><div class="sheet" role="dialog" aria-label="Tuo data">' +
    '<h3>Tuo varmuuskopio</h3>' +
    '<p>Valitse JSON-tiedosto tai liitä varmuuskopion teksti. Kirjaukset yhdistetään nykyisiin – samoja treenejä ei kahdenneta.</p>' +
    '<input type="file" id="imp-file" accept="application/json,.json" class="pick">' +
    '<p class="eyebrow" style="margin:14px 0 6px">tai liitä teksti</p>' +
    '<textarea id="imp-text" class="pick" rows="5" placeholder="{ \"app\": \"saliohjelma\" ... }" style="font-family:var(--font-m);font-size:11px"></textarea>' +
    '<div class="pickrow" style="margin-top:10px"><button class="btn accent" data-importtext="1">Tuo liitetty teksti</button></div>' +
    '<div class="sticky-cta"><button class="btn primary" data-close="1">Sulje</button></div></div></div>';
  const fi = document.getElementById('imp-file');
  if(fi) fi.addEventListener('change', function(){
    const f = fi.files && fi.files[0];
    if(!f) return;
    const rd = new FileReader();
    rd.onload = function(){ applyImport(String(rd.result)); };
    rd.readAsText(f);
  });
}
function applyImport(txt){
  let obj = null;
  try{ obj = JSON.parse(txt); }catch(e){ obj = null; }
  const d = obj && obj.data ? obj.data : obj;
  if(!d || (!d.iida && !d.matti)){
    overlayEl.innerHTML = '<div class="ov"><div class="sheet" role="dialog" aria-label="Tuonti epäonnistui">' +
      '<h3>Tiedostoa ei tunnistettu</h3><p>Valitse Saliohjelman oma varmuuskopio (JSON).</p>' +
      '<div class="sticky-cta"><button class="btn primary" data-close="1">Sulje</button></div></div></div>';
    return;
  }
  let added = 0, skipped = 0;
  PERSONS.forEach(function(pn){
    const inc = d[pn];
    if(!inc || !Array.isArray(inc.sessions)) return;
    const clean = inc.sessions.filter(function(x){
      if(!x || typeof x !== 'object' || !x.id || !x.end) return false;
      if(isNaN(new Date(x.end).getTime())) return false;
      if(x.pid !== 'cardio' && x.pid !== 'rest' && !progById(x.pid)) return false;
      return true;
    });
    skipped += inc.sessions.length - clean.length;
    const before = store[pn].sessions.length;
    store[pn].sessions = mergeSessions(store[pn].sessions, clean);
    added += store[pn].sessions.length - before;
    writeLocal(pn);
    save(pn);
  });
  overlayEl.innerHTML = '<div class="ov"><div class="sheet" role="dialog" aria-label="Tuonti valmis">' +
    '<h3>Tiedot tuotu</h3><p>Uusia kirjauksia lisättiin ' + added + ' kpl. Olemassa olevat säilyivät.' +
    (skipped ? ' ' + skipped + ' vioittunutta tai tuntematonta kirjausta ohitettiin.' : '') + '</p>' +
    '<div class="sticky-cta"><button class="btn primary" data-close="1">Valmis</button></div></div></div>';
  progDom = null;
}

let bottomHidden = false;
let timer = {end:0, total:0, name:'', id:null};
let muted = false;
try{ muted = localStorage.getItem('salikirja-muted') === '1'; }catch(e){}

function startTimer(sec, name){
  bottomHidden = false;
  timer.total = sec; timer.end = Date.now() + sec*1000; timer.name = name;
  if(!timer.id) timer.id = setInterval(tickTimer, 250);
  renderBottom();
}
function tickTimer(){
  const left = timer.end - Date.now();
  const el = document.getElementById('t-count');
  if(!el){ return; }
  const s = Math.max(0, Math.ceil(left/1000));
  el.textContent = Math.floor(s/60) + ':' + pad(s % 60);
  const bar = document.getElementById('t-bar');
  if(bar) bar.style.width = Math.max(0, Math.min(100, (1 - left/(timer.total*1000))*100)) + '%';
  const box = document.getElementById('t-box');
  if(left <= 0){
    if(box && !box.classList.contains('zero')){ box.classList.add('zero'); beep(); }
  }
  if(left < -60000){ stopTimer(); }
}
function stopTimer(){
  clearInterval(timer.id); timer.id = null; timer.end = 0;
  renderBottom();
}
function beep(){
  if(muted) return;
  try{
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) return;
    const ctx = new C();
    [0,0.18].forEach(function(t){
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.type = 'sine';
      g.gain.setValueAtTime(0.0001, ctx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.14);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.16);
    });
    setTimeout(function(){ ctx.close(); }, 900);
  }catch(e){}
}

function renderBottom(){
  const active = store[state.person].active;
  const inProgram = state.view === 'program';
  const running = timer.id !== null;
  if(!inProgram && !running){ bottomEl.innerHTML = ''; return; }

  let h = '<div class="bottom"><div class="bottom-in">';

/* tallennus ja yhteenveto */
function finishSession(){
  const person = state.person;
  const a = store[person].active;
  if(!a) return;
  const p = progById(a.pid);
  const prevSess = strengthSessions(person).filter(function(x){
    return x.pid === a.pid && (!a.editId || x.id !== a.editId);
  })[0];
  const entries = {};
  for(const k in a.entries){
    const kept = a.entries[k].filter(function(s){ return num(s.reps) > 0 || num(s.kg) > 0; })
      .map(function(s){ return {kg:num(s.kg), reps:num(s.reps), rir:s.rir || ''}; });
    if(kept.length) entries[k] = kept;
  }
  /* ennätykset ennen tallennusta, jotta ne tunnistetaan vaikka sarjaa ei merkitty tehdyksi */
  const prMap = {};
  p.ex.forEach(function(def){
    const arr = entries[def.key];
    if(!arr || !arr.length) return;
    const best = bestSet(person, def.key);
    if(!best) return;
    let top = null;
    arr.forEach(function(x){
      const kg = num(x.kg), reps = num(x.reps);
      if(reps <= 0) return;
      if(kg > best.kg || (kg === best.kg && reps > best.reps)){
        if(!top || kg > top.kg || (kg === top.kg && reps > top.reps)) top = {kg:kg, reps:reps};
      }
    });
    if(top) prMap[def.key] = {type: top.kg > best.kg ? 'kg' : 'reps',
                              kg:top.kg, reps:top.reps, pkg:best.kg, preps:best.reps};
  });
  const medalMap = {};
  p.ex.forEach(function(def){
    const arr = entries[def.key];
    if(!arr || !arr.length) return;
    const prevInfo = prevForMedal(person, a.pid, def.key, a.editId);
    const m = medalFor(person, a.pid, def, arr, prevInfo, true);
    if(m) medalMap[def.key] = m;
  });

  const endIso = a.forceEnd || new Date().toISOString();
  let savedId = a.editId || ('s' + Date.now());
  if(a.editId){
    let found = false;
    store[person].sessions = store[person].sessions.map(function(x){
      if(x.id !== a.editId) return x;
      found = true;
      return {id:x.id, pid:a.pid, start:x.start || a.start, end:endIso, entries:entries, note:a.note || ''};
    });
    if(!found) store[person].sessions.push({id:savedId, pid:a.pid, start:a.start, end:endIso, entries:entries, note:a.note || ''});
  }else{
    store[person].sessions.push({id:savedId, pid:a.pid, start:a.start, end:endIso, entries:entries, note:a.note || ''});
  }
  store[person].active = null;
  progDom = null;
  save(person);
  stopTimer();

  const rows = [];
  let sets = 0, tonnage = 0, improved = 0;
  p.ex.forEach(function(def){
    const arr = entries[def.key];
    if(!arr) return;
    sets += arr.length;
    arr.forEach(function(x){ tonnage += (num(x.kg) || 0) * (num(x.reps) || 0); });
    const prevArr = prevSess && prevSess.entries ? prevSess.entries[def.key] : null;
    const ad = advice(def, arr, prevArr);
    /* parani = raskaampi paras sarja tai sama paino useammalla toistolla */
    let better = false;
    if(prevArr && prevArr.length){
      const now = arr.slice().sort(function(x,y){ return (num(y.kg) - num(x.kg)) || (num(y.reps) - num(x.reps)); })[0];
      const bef = prevArr.slice().sort(function(x,y){ return (num(y.kg) - num(x.kg)) || (num(y.reps) - num(x.reps)); })[0];
      if(now && bef){
        better = (num(now.kg) > num(bef.kg)) ||
                 (num(now.kg) === num(bef.kg) && num(now.reps) > num(bef.reps));
      }
    }
    if(better) improved++;
    rows.push({name:def.name, sum:setsSummary(arr), ad:ad, better:better,
               medal: medalMap[def.key] || null,
               pr: prMap[def.key] || ''});
  });
  const startMs = a.start ? new Date(a.start).getTime() : 0;
  const mins = startMs ? Math.max(1, Math.round((new Date(endIso).getTime() - startMs) / 60000)) : 0;
  const stats = {mins:mins, sets:sets, tonnage:Math.round(tonnage), improved:improved,
                 prev:prevSess, prevCount:0};
  if(prevSess && prevSess.entries){
    for(const k in prevSess.entries) stats.prevCount += prevSess.entries[k].length;
  }
  showSummary(p, rows, stats, savedId);
}

/* ---------------- VANHAN TREENIN TARKASTELU ----------------
   Tarkastelu näyttää treenin sellaisena kuin se oli: mitalit ja ennätykset
   lasketaan vain sitä edeltävistä kirjauksista, joten vanha kulta pysyy kultana
   vaikka ennätys olisi myöhemmin parantunut.                               */

function sessionById(person, id){
  return store[person].sessions.filter(function(x){ return x.id === id; })[0] || null;
}
function endMsOf(s){ return s && s.end ? new Date(s.end).getTime() : 0; }
/* ennätys ennen annettua hetkeä (kaikki ohjelmat, sama liike) */
function bestSetBefore(person, key, beforeMs, skipId){
  let best = null;
  store[person].sessions.forEach(function(s){
    if(!s.entries || !progById(s.pid)) return;
    if(skipId && s.id === skipId) return;
    if(endMsOf(s) >= beforeMs) return;
    const arr = s.entries[key];
    if(!arr) return;
    arr.forEach(function(x){
      const kg = num(x.kg), reps = num(x.reps);
      if(reps <= 0) return;
      if(!best || kg > best.kg || (kg === best.kg && reps > best.reps))
        best = {kg:kg, reps:reps, end:s.end, pid:s.pid};
    });
  });
  return best;
}
/* vertailukohta ennen annettua hetkeä: sama ohjelma ensin, muuten toinen päivä */
function prevBefore(person, pid, key, beforeMs, skipId){
  const list = strengthSessions(person).filter(function(s){
    return s.id !== skipId && endMsOf(s) < beforeMs;
  });
  for(let i = 0; i < list.length; i++){
    const s = list[i];
    if(s.pid !== pid) continue;
    const arr = s.entries && s.entries[key];
    if(arr && arr.length && arr.some(function(x){ return num(x.reps) > 0; }))
      return {sets:arr, cross:false, pid:pid, end:s.end};
  }
  for(let i = 0; i < list.length; i++){
    const s = list[i];
    const arr = s.entries && s.entries[key];
    if(arr && arr.length && arr.some(function(x){ return num(x.reps) > 0; }))
      return {sets:arr, cross:true, pid:s.pid, end:s.end};
  }
  return null;
}
function prevSessionBefore(person, pid, beforeMs, skipId){
  const list = strengthSessions(person);
  for(let i = 0; i < list.length; i++){
    const s = list[i];
    if(s.pid !== pid || s.id === skipId) continue;
    if(endMsOf(s) >= beforeMs) continue;
    return s;
  }
  return null;
}

  if(n === 2) return '<i>&#9733;</i><i class="mid">&#9733;</i>';
  if(n === 1) return '<i class="mid">&#9733;</i>';
  return '<i class="mid">&#9734;</i>';
}

  return DAYNAMES[d.getDay()].charAt(0).toUpperCase() + DAYNAMES[d.getDay()].slice(1) +

function sessionNavHtml(person, s, back){
  const list = strengthSessions(person);
  let idx = -1;
  for(let i = 0; i < list.length; i++) if(list[i].id === s.id){ idx = i; break; }
  if(idx < 0) return '';
  const older = list[idx+1], newer = list[idx-1];

  let h = '<div class="vnav">';
  h += older
    ? '<button type="button" class="minibtn" data-session="' + older.id + '"' + bk + '>&lsaquo; ' +
      esc((progById(older.pid) || {}).name || '') + ' ' + fmtDate(older.end) + '</button>'
    : '<span class="muted" style="font-size:12px">Vanhin kirjaus</span>';
  h += newer
    ? '<button type="button" class="minibtn" data-session="' + newer.id + '"' + bk + '>' +
      esc((progById(newer.pid) || {}).name || '') + ' ' + fmtDate(newer.end) + ' &rsaquo;</button>'
    : '<span class="muted" style="font-size:12px">Uusin kirjaus</span>';
  h += '</div>';
  return h;
}

function showSession(id, backIso){
  const person = state.person;
  const s = sessionById(person, id);
  if(!s){ overlayEl.innerHTML = ''; return; }
  const back = backIso || '';
  const p = progById(s.pid);
  let h = '<div class="ov"><div class="sheet" role="dialog" aria-label="Treenin tiedot">';

  /* cardio ja lepo: kevyt katselu */
  if(!p){
    const isCardio = s.pid === 'cardio';
    h += '<h3>' + (isCardio ? esc(s.kind || 'Cardio') : 'Lepopäivä') + '</h3>' +
      '<p>' + longDate(s.end) + ' &middot; ' + agoText(s.end) + '</p>';
    if(isCardio){
      h += '<div class="stats" style="margin:10px 0 14px">' +
        '<div class="stat"><b class="mono">' + (num(s.minutes) || '?') + '</b><span>minuuttia</span></div>' +
        '<div class="stat"><b class="mono">' + esc(s.kind || 'Muu') + '</b><span>laji</span></div></div>';
    }else{
      h += '<p class="muted" style="font-size:13px;margin:10px 0 0">Ei treeniä &ndash; palautuminen on osa ohjelmaa.</p>';
    }
    h += '<div class="pickrow" style="margin-top:14px">' +
      '<button type="button" class="minibtn danger" data-del="' + s.id + '" data-delfrom="session">Poista</button></div>';
    h += '<div class="sticky-cta">' + sessionCloseBtn(back) + '</div></div></div>';
    overlayEl.innerHTML = h;
    return;
  }

  const endMs = endMsOf(s);
  const prevSess = prevSessionBefore(person, s.pid, endMs, s.id);
  const rows = [], missing = [], prs = [];
  let sets = 0, tonnage = 0, repsTot = 0;
  p.ex.forEach(function(def){
    const arr = s.entries && s.entries[def.key];
    if(!arr || !arr.length){ missing.push(def.name.split(',')[0]); return; }
    sets += arr.length;
    arr.forEach(function(x){
      tonnage += (num(x.kg) || 0) * (num(x.reps) || 0);
      repsTot += num(x.reps) || 0;
    });
    const bestBefore = bestSetBefore(person, def.key, endMs, s.id);
    const prevInfo = prevBefore(person, s.pid, def.key, endMs, s.id);
    const m = medalFor(person, s.pid, def, arr, prevInfo, true, bestBefore);
    if(m && m.tier === 'gold') prs.push({name:def.name, m:m});
    rows.push({def:def, arr:arr, m:m, top:topOf(arr)});
  });
  /* kesto naytetaan vain jos se on uskottava: jalkikateen kirjatuissa alku ja loppu ovat sama */
  let mins = s.start ? Math.round((endMs - new Date(s.start).getTime()) / 60000) : 0;
  if(mins < 2 || mins > 600) mins = 0;
  let prevSets = 0;
  if(prevSess && prevSess.entries) for(const k in prevSess.entries) prevSets += prevSess.entries[k].length;

  h += '<h3>' + esc(p.name) + '</h3>';
  h += '<p>' + longDate(s.end) + ' &middot; ' + agoText(s.end) + '</p>';
  h += '<div class="row" style="flex-wrap:wrap;gap:6px;margin-top:8px">' +
    '<span class="chip">' + p.day + '</span>' +
    '<span class="chip">' + personName(person) + '</span>' +
    (s.start ? '' : '<span class="chip">jälkikäteen kirjattu</span>') +
    '</div>';
  h += sessionNavHtml(person, s, back);
  h += '<div class="stats tight" style="margin:12px 0 14px">' +
    (mins ? '<div class="stat"><b class="mono">' + mins + '</b><span>minuuttia</span></div>' : '') +
    '<div class="stat"><b class="mono">' + sets + '</b><span>työsarjaa' +
      (prevSets ? ' (ed. ' + prevSets + ')' : '') + '</span></div>' +
    '<div class="stat"><b class="mono">' + repsTot + '</b><span>toistoa</span></div>' +
    '</div>';

  if(prs.length){
    h += '<div class="prbox"><span class="prbox-h">' +
      '<span class="prstars" aria-hidden="true">' + starsHtml(3) + '</span>' +
      (prs.length === 1 ? 'Ennätys tässä treenissä' : prs.length + ' ennätystä tässä treenissä') + '</span>';
    prs.forEach(function(r){
      h += '<div class="prbox-row"><span class="prbox-name">' + esc(r.name.split(',')[0]) +
        '<small>' + (r.m.mode === 'kg' ? 'ennätyspaino' : 'toistoennätys') +
        (r.m.pkg ? ' &middot; aiempi ' + fmtKg(r.m.pkg) + ' kg &times; ' + r.m.preps : '') + '</small></span>' +
        '<b class="mono">' + fmtKg(r.m.kg) + ' kg &times; ' + r.m.reps + '</b></div>';
    });
    h += '</div>';
  }

  if(!rows.length){
    h += '<div class="note">Tähän treeniin ei jäänyt kirjattuja sarjoja.</div>';
  }
  h += '<div class="vsess">';
  rows.forEach(function(r, i){
    h += '<div class="vex"><div class="row spread" style="gap:8px;align-items:baseline">' +
      '<b style="min-width:0;font-size:14px">' + (i+1) + '. ' + esc(r.def.name.split(',')[0]) + '</b>' +
      '<span class="muted mono" style="font-size:11px;white-space:nowrap">' + r.def.sets + ' &times; ' +
      r.def.lo + '&ndash;' + r.def.hi + '</span></div>';
    h += '<div class="setlog">';
    let marked = false;
    r.arr.forEach(function(x, j){
      const isTop = !marked && r.top && num(x.kg) === num(r.top.kg) && num(x.reps) === num(r.top.reps);
      if(isTop) marked = true;
      h += '<span' + (isTop && r.arr.length > 1 ? ' class="top"' : '') + '>' +
        '<i>' + (j+1) + '.</i>' + (num(x.kg) ? fmtKg(num(x.kg)) + ' kg' : 'oma paino') +
        ' &times; ' + (num(x.reps) || '&ndash;') + '</span>';
    });
    h += '</div>';
    if(r.m) h += medalBadgeHtml(r.m);
    h += '</div>';
  });
  h += '</div>';

  if(missing.length){
    h += '<p class="muted" style="font-size:12px;margin:10px 0 0">Ei kirjauksia: ' +
      esc(missing.join(', ')) + '</p>';
  }
  h += '<div class="sumlist" style="margin-top:12px">' +
    '<div class="sumrow"><span class="muted">Kokonaiskuorma (sekundäärinen)</span>' +
    '<span class="mono muted">' + Math.round(tonnage) + ' kg</span></div>' +
    (prevSess ? '<div class="sumrow"><span class="muted">Edellinen sama treeni</span>' +
      '<span class="mono muted">' + fmtDate(prevSess.end) + '</span></div>' : '') +
    '</div>';

  h += '<p class="eyebrow" style="margin:16px 0 6px">Muistiinpano treenistä</p>' +
    '<textarea class="pick" id="sum-note" rows="3" data-note="' + esc(s.id) + '" ' +
    'placeholder="Miltä tuntui, laitteen säädöt, kipeät kohdat…">' + esc(s.note || '') + '</textarea>';

  h += '<div class="pickrow" style="margin-top:12px">' +
    '<button type="button" class="minibtn" data-editsets="' + s.id + '">Muokkaa sarjoja</button>' +
    '<button type="button" class="minibtn danger" data-del="' + s.id + '" data-delfrom="session">Poista</button>' +
    '</div>';
  h += '<div class="sticky-cta">' + sessionCloseBtn(back) + '</div>';
  h += '</div></div>';
  overlayEl.innerHTML = h;
  const sh = overlayEl.querySelector('.sheet');
  if(sh) sh.scrollTop = 0;
}

function showCardio(forIso){
  cardioPick.date = forIso || null;
  const kinds = ['Hyrox','Jumppa','Juoksu','Muu'];
  let h = '<div class="ov"><div class="sheet" role="dialog" aria-label="Kirjaa cardio">' +
    '<h3>Cardio</h3>' +
    '<p>Valitse laji ja käytetty aika.' + (cardioPick.date ? ' Kirjaus menee päivälle ' + fmtDate(isoAtNoon(cardioPick.date)) + '.' : '') + '</p>' +
    '<div class="pickrow">';
  kinds.forEach(function(k){
    h += '<button type="button" class="pickchip" data-ckind="' + k + '" aria-pressed="' + (cardioPick.kind === k) + '">' + k + '</button>';
  });
  h += '</div>' +
    '<p class="eyebrow" style="margin:14px 0 6px">Aika</p>' +
    '<div class="pickrow">';
  [20,30,45,60].forEach(function(m){
    h += '<button type="button" class="pickchip" data-cmin="' + m + '" aria-pressed="' + (cardioPick.min === m) + '">' + m + ' min</button>';
  });
  h += '</div>' +
    '<div class="row" style="gap:8px;margin:10px 0 16px">' +
      '<div class="numfield" style="flex:1"><input id="c-min" type="number" inputmode="numeric" min="1" value="' + cardioPick.min + '" aria-label="Minuutit"></div>' +
      '<span class="muted" style="font-size:13px;flex:2">minuuttia</span>' +
    '</div>' +
    '<div class="row"><button class="btn ghost" data-close="1" style="flex:1">Peruuta</button>' +
    '<button class="btn accent" data-savecardio="1" style="flex:1">Tallenna</button></div>' +
    '</div></div>';
  overlayEl.innerHTML = h;
}

function confirmDiscard(){
  const h = '<div class="ov"><div class="sheet" role="dialog" aria-label="Hylkää treeni">' +
    '<h3>Hylätäänkö kirjaukset?</h3>' +
    '<p>Tämän treenin kirjatut sarjat poistetaan. Aiemmat treenit säilyvät.</p>' +
    '<div class="row"><button class="btn ghost" data-close="1" style="flex:1">Jatka treeniä</button>' +
    '<button class="btn primary" data-discard="1" style="flex:1">Hylkää</button></div></div></div>';
  overlayEl.innerHTML = h;
}

/* ============================================================
   6. TAPAHTUMAT
   ============================================================ */

document.addEventListener('click', function(ev){
  const t = ev.target.closest('[data-person],[data-open],[data-view],[data-tab],[data-cardio],[data-finish],[data-close],[data-savecardio],[data-discard],[data-discard-ask],[data-setskin],[data-rest],[data-ckind],[data-cmin],[data-ckindfilter],[data-timer],[data-calmove],[data-calday],[data-editsets],[data-del],[data-delok],[data-backtoday],[data-addcardio],[data-addrest],[data-abort],[data-clearsets],[data-weekday],[data-active],[data-pickprog],[data-hidebar],[data-showbar],[data-export],[data-import],[data-importtext],[data-copybk],[data-session]');
  if(!t) return;

  if(t.dataset.person){
    state.person = t.dataset.person;
    try{ localStorage.setItem('salikirja-person', state.person); }catch(e){}
    progDom = null;
    setView('home');
    return;
  }
  if(t.dataset.active){ showActiveSheet(); return; }
  if(t.dataset.pickprog){ showPickProgram(); return; }
  if(t.dataset.export){ exportData(); return; }
  if(t.dataset.import){ showImport(); return; }
  if(t.dataset.importtext){
    const ta = document.getElementById('imp-text');
    applyImport(ta ? ta.value : '');
    return;
  }
  if(t.dataset.copybk){
    const ta = document.getElementById('bk-text');
    if(ta){
      ta.removeAttribute('readonly'); ta.select(); ta.setSelectionRange(0, 999999);
      try{ document.execCommand('copy'); }catch(e){}
      if(navigator.clipboard) { try{ navigator.clipboard.writeText(ta.value); }catch(e){} }
      ta.setAttribute('readonly','readonly');
      t.textContent = 'Kopioitu';
    }
    return;
  }
  if(t.dataset.hidebar){ bottomHidden = true; renderBottom(); updateFinishState(); return; }
  if(t.dataset.showbar){ bottomHidden = false; renderBottom(); updateFinishState(); return; }
  if(t.dataset.open){ overlayEl.innerHTML = ''; progDom = null; progChartKey = null; setView('program', t.dataset.open); return; }
  if(t.dataset.view){ progDom = null; setView(t.dataset.view); return; }
  if(t.dataset.tab){ state.tab = t.dataset.tab; renderHistory(); return; }
  if(t.dataset.cardio){ showCardio(); return; }
  if(t.dataset.calmove){
    const dir = num(t.dataset.calmove);
    if(dir === 0){ const n = new Date(); state.calY = n.getFullYear(); state.calM = n.getMonth(); }
    else {
      const d = new Date(state.calY, state.calM + dir, 1);
      state.calY = d.getFullYear(); state.calM = d.getMonth();
    }
    renderCalendar();
    return;
  }
  if(t.dataset.calday){ showDay(t.dataset.calday); return; }
  if(t.dataset.weekday){
    const b = t.dataset.weekday.split('-');
    state.calY = +b[0]; state.calM = +b[1] - 1;
    progDom = null;
    setView('calendar');
    showDay(t.dataset.weekday);
    return;
  }
  if(t.dataset.session){ showSession(t.dataset.session, t.dataset.sessionback || ''); return; }
  if(t.dataset.editsets){ startEdit(t.dataset.editsets); return; }
  if(t.dataset.del){ confirmDelete(t.dataset.del, t.dataset.delfrom || ''); return; }
  if(t.dataset.delok){
    const id = t.dataset.delok;
    const gone = store[state.person].sessions.filter(function(x){ return x.id === id; })[0];
    const backIso = gone ? isoDay(new Date(gone.end)) : null;
    store[state.person].sessions = store[state.person].sessions.filter(function(x){ return x.id !== id; });
    save(state.person);
    overlayEl.innerHTML = '';
    if(state.view === 'calendar'){
      renderCalendar();
      if(backIso) showDay(backIso);
    }else{
      renderAll();
    }
    return;
  }
  if(t.dataset.backtoday){ showDay(t.dataset.backtoday); return; }
  if(t.dataset.addcardio){ showCardio(t.dataset.addcardio); return; }
  if(t.dataset.addrest){
    store[state.person].sessions.push({id:'r' + Date.now(), pid:'rest', end:isoAtNoon(t.dataset.addrest)});
    save(state.person);
    renderCalendar();
    showDay(t.dataset.addrest);
    return;
  }
  if(t.dataset.abort){ showAbort(); return; }
  if(t.dataset.clearsets){
    const person = state.person;
    const a = store[person].active;
    if(a){ const pid = a.pid; store[person].active = null; ensureActive(pid); save(person); progDom = null; }
    overlayEl.innerHTML = '';
    renderAll();
    return;
  }
  if(t.dataset.discardAsk){ confirmDiscard(); return; }
  if(t.dataset.setskin){
    applySkin(t.dataset.setskin);
    showSkins();
    if(state.view === 'history' && state.tab === 'kehitys' && document.getElementById('chartbox')) drawChart();
    return;
  }
  if(t.dataset.finish){ finishSession(); return; }
  if(t.dataset.close){ overlayEl.innerHTML = ''; if(state.view === 'program' && !store[state.person].active) setView('home'); else renderAll(); return; }
  if(t.dataset.discard){
    store[state.person].active = null; progDom = null; save(state.person);
    overlayEl.innerHTML = ''; stopTimer(); setView('home'); return;
  }
  if(t.dataset.ckind){
    const mi = document.getElementById('c-min');
    if(mi) cardioPick.min = num(mi.value) || cardioPick.min;
    cardioPick.kind = t.dataset.ckind;
    showCardio(cardioPick.date);
    return;
  }
  if(t.dataset.ckindfilter){ state.cardioKind = t.dataset.ckindfilter; renderHistory(); return; }
  if(t.dataset.cmin){
    cardioPick.min = num(t.dataset.cmin);
    showCardio(cardioPick.date);
    return;
  }
  if(t.dataset.rest){
    store[state.person].sessions.push({id:'r' + Date.now(), pid:'rest', end:new Date().toISOString()});
    save(state.person);
    setView('home');
    return;
  }
  if(t.dataset.savecardio){
    const min = num(document.getElementById('c-min').value) || cardioPick.min || 30;
    const kind = cardioPick.kind;
    cardioPick.min = min;
    const cEnd = cardioPick.date ? isoAtNoon(cardioPick.date) : new Date().toISOString();
    store[state.person].sessions.push({id:'c' + Date.now(), pid:'cardio', end:cEnd, minutes:min, kind:kind});
    save(state.person);
    const backTo = cardioPick.date;
    cardioPick.date = null;
    overlayEl.innerHTML = '';
    if(backTo){ renderCalendar(); showDay(backTo); }
    else setView('home');
    return;
  }
  if(t.dataset.timer){
    if(t.dataset.timer === '30'){ timer.end += 30000; timer.total += 30; const b = document.getElementById('t-box'); if(b) b.classList.remove('zero'); }
    else if(t.dataset.timer === 'stop'){ stopTimer(); }
    else if(t.dataset.timer === 'mute'){ muted = !muted; try{ localStorage.setItem('salikirja-muted', muted ? '1' : '0'); }catch(e){} renderBottom(); }
    return;
  }
});

/* näppäimistö: historian rivit ovat role="button" -laatikoita */
document.addEventListener('keydown', function(ev){
  if(ev.key !== 'Enter' && ev.key !== ' ' && ev.key !== 'Spacebar') return;
  const t = ev.target;
  if(!t || !t.getAttribute || t.getAttribute('role') !== 'button') return;
  if(!t.getAttribute('data-session')) return;
  ev.preventDefault();
  t.click();
});

document.addEventListener('input', function(ev){
  const t = ev.target;
  if(t && t.id === 'sum-note'){
    const id = t.getAttribute('data-note');
    if(!id) return;
    const person = state.person;
    let hit = false;
    store[person].sessions = store[person].sessions.map(function(x){
      if(x.id !== id) return x;
      hit = true;
      return Object.assign({}, x, {note: t.value});
    });
    if(hit) save(person);
  }
});

document.addEventListener('change', function(ev){
  if(ev.target.id === 'chartpick'){ state.chartKey = ev.target.value; drawChart(); }
  if(ev.target.id === 'progpick'){ progChartKey = ev.target.value; drawProgChart(); }
  const sw = ev.target.getAttribute && ev.target.getAttribute('data-swap');
  if(sw){
    const person = state.person, val = ev.target.value;
    store[person].sessions = store[person].sessions.map(function(x){
      return x.id === sw ? Object.assign({}, x, {pid:val}) : x;
    });
    save(person);
    const day = state.calDay;
    renderCalendar();
    if(day) showDay(day);
    return;
  }
  const mv = ev.target.getAttribute && ev.target.getAttribute('data-movedate');
  if(mv){
    const person = state.person, val = ev.target.value;
    if(!val) return;
    store[person].sessions = store[person].sessions.map(function(x){
      return x.id === mv ? Object.assign({}, x, {end:isoAtNoon(val)}) : x;
    });
    save(person);
    renderCalendar();
    showDay(val);
    return;
  }
  const at = ev.target.getAttribute && ev.target.getAttribute('data-addtrain');
  if(at && ev.target.value){ startOnDate(ev.target.value, at); return; }
});

document.getElementById('btn-skin').addEventListener('click', function(){ showSkins(); });
document.getElementById('btn-home').addEventListener('click', function(){
  progDom = null;
  overlayEl.innerHTML = '';
  setView('home');
});
document.getElementById('btn-cal').addEventListener('click', function(){
  const n = new Date(); state.calY = n.getFullYear(); state.calM = n.getMonth();
  progDom = null; setView('calendar');
});
document.getElementById('btn-guide').addEventListener('click', function(){ progDom = null; setView('guide'); });

let rsz;
window.addEventListener('resize', function(){
  clearTimeout(rsz);
  rsz = setTimeout(function(){
    if(state.view === 'program'){ drawProgChart(); return; }
    if(state.view !== 'history') return;
    if(state.tab === 'kehitys' && document.getElementById('chartbox')) drawChart();
    if(state.tab === 'cardio' && document.getElementById('cardiobox')) drawCardioChart();
  }, 200);
});

/* ============================================================
   7. KÄYNNISTYS
   ============================================================ */

function boot(snap){
  applySkin(skin);
  loadLocal();
  if(snap && snap.person && PERSONS.indexOf(snap.person) >= 0) state.person = snap.person;
  if(snap && snap.view){ state.view = snap.view; state.pid = snap.pid || null; }
  for(const k in views) views[k].hidden = (k !== state.view);
  renderAll();
  connect();
}
if(window.claude && window.claude.hot){
  window.claude.hot.snapshot(function(){ return {person:state.person, view:state.view, pid:state.pid}; });
  if(window.claude.hot.ready) window.claude.hot.ready(boot); else boot(window.claude.hot.data || {});
}else{
  boot({});
}
})();
</script>
