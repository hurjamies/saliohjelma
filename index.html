<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Iidiksen ja Matin salitreeniohjelmat: päivän suositus, sarjakohtainen kirjaus, kalenteri ja kehityskäyrät.">
<meta name="theme-color" content="#22252A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Saliohjelma">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{
    color-scheme: light dark;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;background:#F2F1ED}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
</head>
<body>
<title>Saliohjelma 6.5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Josefin+Sans:wght@400;600;700&family=Poiret+One&display=swap">
<style>
  :root{
    --bg:#F2F1ED;
    --surface:#FFFFFF;
    --surface-2:#F7F6F2;
    --line:#E5E2DA;
    --line-2:#CAC6BC;
    --ink:#22252A;
    --ink-2:#53585E;
    --ink-3:#85888B;
    --up:#4F6D7A;
    --up-soft:#E5ECEF;
    --low:#5F7A5F;
    --low-soft:#E6EDE3;
    --ok:#4A7A52;
    --ok-soft:#E4EFE3;
    --warn:#8E6A28;
    --warn-soft:#F5EDDC;
    --bad:#A55146;
    --on-acc:#FFFFFF;--rest:#6F6D67;--cardio:#96592F;--cardio-soft:#F3E7DC;
    --shadow:0 1px 2px rgba(34,30,22,.05), 0 10px 26px -16px rgba(34,30,22,.28);
    --r:14px;
    --font-d:'Archivo','Helvetica Neue',Arial,sans-serif;
    --font-b:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;
    --font-m:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0D1015;
      --surface:#161B22;
      --surface-2:#1D232C;
      --line:#2A313C;
      --line-2:#3A4351;
      --ink:#E7EBF1;
      --ink-2:#AAB4C1;
      --ink-3:#7D8895;
      --up:#9B95FF;
      --up-soft:#232244;
      --low:#3FC7B4;
      --low-soft:#123430;
      --ok:#5CCB8E;
      --ok-soft:#14301F;
      --warn:#E0A44A;
      --warn-soft:#332616;
      --bad:#F0837C;
      --on-acc:#0D1015;--rest:#8D97A8;--cardio:#E8A94E;--cardio-soft:#3A2A12;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0D1015;
    --surface:#161B22;
    --surface-2:#1D232C;
    --line:#2A313C;
    --line-2:#3A4351;
    --ink:#E7EBF1;
    --ink-2:#AAB4C1;
    --ink-3:#7D8895;
    --up:#9B95FF;
    --up-soft:#232244;
    --low:#3FC7B4;
    --low-soft:#123430;
    --ok:#5CCB8E;
    --ok-soft:#14301F;
    --warn:#E0A44A;
    --warn-soft:#332616;
    --bad:#F0837C;
    --on-acc:#0D1015;--rest:#8D97A8;--cardio:#E8A94E;--cardio-soft:#3A2A12;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  }

  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-b);
    font-size:15px;
    line-height:1.5;
    -webkit-text-size-adjust:100%;
  }
  *{box-sizing:border-box}
  button{font:inherit;color:inherit;cursor:pointer}
  input,select{font:inherit;color:inherit}
  a{color:var(--up)}
  :focus-visible{outline:2px solid var(--up);outline-offset:2px;border-radius:6px}

  .wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 150px}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky;top:env(safe-area-inset-top, 0px);z-index:30;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .topbar-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:7px}
  .brand{font-family:var(--font-d);font-weight:700;font-size:15px;letter-spacing:-.01em;margin:0 6px 0 0;flex:1;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand span{color:var(--ink-3);font-weight:600}
  .seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
  .seg button{
    border:0;background:transparent;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;
    color:var(--ink-2);font-family:var(--font-d);letter-spacing:.01em;
  }
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  .iconbtn{
    border:1px solid var(--line);background:var(--surface);border-radius:10px;width:32px;height:32px;
    display:grid;place-items:center;color:var(--ink-2);flex:none;
  }

  /* ---------- generic pieces ---------- */
  .eyebrow{
    font-family:var(--font-d);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-3);margin:0 0 8px;
  }
  h2.sec{font-family:var(--font-d);font-size:17px;font-weight:700;letter-spacing:-.01em;margin:0 0 10px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .mono{font-family:var(--font-m);font-variant-numeric:tabular-nums}
  .muted{color:var(--ink-3)}
  .chip{
    display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600;
    background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap;
  }
  .chip.up{background:var(--up-soft);color:var(--up);border-color:transparent}
  .chip.low{background:var(--low-soft);color:var(--low);border-color:transparent}
  .chip.cardio{background:var(--cardio-soft);color:var(--cardio);border-color:transparent}
  .chip.shared{background:var(--up-soft);color:var(--up);border-color:transparent;font-size:11px;padding:2px 8px}
  .chip.pair{background:transparent;color:var(--ink-3);border:1px dashed var(--line-2);font-size:11px;padding:2px 8px}
  .chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
  .chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
  .btn{
    border:1px solid var(--line-2);background:var(--surface);border-radius:11px;padding:10px 16px;
    font-family:var(--font-d);font-weight:600;font-size:14px;
  }
  .btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .btn.accent{background:var(--acc,var(--up));color:var(--on-acc);border-color:transparent}
  .btn.ghost{background:transparent;border-color:var(--line)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .row{display:flex;align-items:center;gap:10px}
  .spread{justify-content:space-between}

  /* ---------- today hero ---------- */
  .today{
    margin-top:18px;padding:18px;border-radius:18px;position:relative;overflow:hidden;
    background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
  }
  .today::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--acc,var(--up))}
  .today .date{font-family:var(--font-d);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
  .today h1{font-family:var(--font-d);font-size:clamp(23px,6vw,30px);font-weight:700;letter-spacing:-.02em;margin:6px 0 2px;text-wrap:balance}
  .today .why{color:var(--ink-2);font-size:14px;margin:8px 0 0;max-width:60ch}
  .today .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
  .today .acts .actbtn{padding:13px 14px;text-align:center;font-size:14px;line-height:1.25;min-height:46px}
  .today .acts .wide{grid-column:1 / -1}
  .todayflag{
    position:absolute;top:0;right:0;background:var(--acc);color:var(--on-acc);
    border-radius:0 18px 0 12px;padding:5px 13px 6px;
    font-family:var(--font-d);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  }
  .today h1{padding-right:96px}
  .pmark{width:10px;height:34px;border-radius:5px;flex:none;display:block}
  .btn.cardio{background:var(--cardio);color:var(--on-acc);border-color:transparent}
  .btn.rest{background:var(--rest);color:var(--on-acc);border-color:transparent}
  .badgeline{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .resume{
    display:flex;align-items:center;gap:11px;width:100%;text-align:left;margin-top:16px;
    background:var(--warn-soft);border:1.5px solid var(--warn);border-radius:13px;padding:11px 12px;color:var(--ink);
  }
  .resume b{font-family:var(--font-d);font-size:14px;font-weight:700;display:block;letter-spacing:-.005em}
  .resume small{display:block;font-size:12px;line-height:1.35;color:var(--ink-2);margin-top:2px}
  .resume .live{
    width:10px;height:10px;border-radius:50%;background:var(--warn);flex:none;
    box-shadow:0 0 0 0 var(--warn);animation:livepulse 1.8s ease-out infinite;
  }
  .resume .chev{margin-left:auto;color:var(--warn);font-size:20px;font-weight:700;line-height:1;flex:none}
  @keyframes livepulse{
    0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--warn) 55%, transparent)}
    70%{box-shadow:0 0 0 9px color-mix(in srgb, var(--warn) 0%, transparent)}
    100%{box-shadow:0 0 0 0 color-mix(in srgb, var(--warn) 0%, transparent)}
  }
  @media (prefers-reduced-motion: reduce){.resume .live{animation:none}}

  .lastbtn{
    display:flex;align-items:center;gap:11px;width:100%;text-align:left;margin-top:12px;
    background:var(--surface);border:1px solid var(--line-2);border-radius:13px;padding:11px 12px;
    color:var(--ink);box-shadow:var(--shadow);cursor:pointer;
    transition:border-color .12s ease, transform .12s ease;
  }
  .lastbtn:active{transform:scale(.995)}
  .lastbtn b{font-family:var(--font-d);font-size:14px;font-weight:700;display:block;letter-spacing:-.005em}
  .lastbtn small{display:block;font-size:12px;line-height:1.35;color:var(--ink-2);margin-top:2px}
  .lastbtn .chev{margin-left:auto;color:var(--ink-3);font-size:20px;font-weight:700;line-height:1;flex:none}
  .lastbtn .mdot{width:12px;height:12px}
  body[data-skin="deco"] .lastbtn{border-radius:4px}

  /* ---------- week strip ---------- */
  .week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:14px}
  .wd{
    background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:8px 4px;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;font:inherit;color:inherit;
    cursor:pointer;transition:border-color .12s ease, transform .12s ease;
  }
  .wd{cursor:default}
  .wd b{color:var(--ink-3)}
  .wd.planday{background:var(--ks);border:1.5px dashed var(--k);}
  .wd.planday b{color:var(--k);opacity:.9}
  .wd.planday .plan{color:var(--k);opacity:.95}
  .wd.planday.k-rest{background:var(--surface-2);border-color:var(--line-2)}
  .wd.planday.k-rest b,
  .wd.planday.k-rest .plan{color:var(--ink-3)}
  .wd.planday.is-today{border-style:solid;box-shadow:0 0 0 1.5px var(--ink);border-color:var(--ink)}
  .wd.planday.is-today b{color:var(--ink)}
  .calday.wd2{
    aspect-ratio:auto;padding:7px 3px 9px;gap:2px;border-radius:11px;
  }
  .calday.wd2 b{font-family:var(--font-d);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
  .calday.wd2 .dn{font-size:13px;line-height:1.1}
  .calday.wd2.has .dn{font-size:14px}
  .calday.wd2 .code{font-size:10px;min-height:11px}
  .calday.wd2.sugg{background:var(--ks);border-color:var(--k);color:var(--k);cursor:default}
  .calday.wd2.sugg b{color:var(--k);opacity:.85}
  .calday.wd2.sugg .code{font-size:11px;font-weight:700}
  .calday.wd2.sugg .sstate{font-size:9.5px;line-height:1;opacity:.75;min-height:10px}
  .calday.wd2.sugg.isempty{background:var(--surface);border-color:var(--line);color:var(--ink-3)}
  .calday.wd2.sugg.isempty b{color:var(--ink-3)}
  .calday.wd2.sugg.isdone{border-style:solid;opacity:.95}
  body[data-skin="mono"] .calday.wd2.sugg{background:var(--surface-2);color:var(--ink);border-color:var(--line-2)}
  body[data-skin="mono"] .calday.wd2.sugg b{color:var(--ink-2)}
  body[data-skin="mono"] .calday.wd2.sugg.k-gym{border-color:var(--ink);color:var(--ink)}
  body[data-skin="mono"] .calday.wd2.sugg.k-cardio{background:var(--cardio-soft);border-color:var(--red);color:var(--red)}
  body[data-skin="mono"] .calday.wd2.sugg.k-cardio b{color:var(--red)}
  .eyerow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .wd b{font-family:var(--font-d);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
  .wd .plan{font-size:11px;line-height:1.25;color:var(--ink-2);min-height:2.4em;overflow-wrap:break-word}
  .wd .dot{width:7px;height:7px}
  .wd.is-today{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
  .wd.is-today b{color:var(--ink)}

  /* ---------- program grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
  .pcard{
    text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);position:relative;
    transition:transform .12s ease, border-color .12s ease;
  }
  .pcard:hover{transform:translateY(-1px);border-color:var(--line-2)}
  .pcard .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .pcard .day{font-family:var(--font-d);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
  .pcard h3{font-family:var(--font-d);font-size:17px;font-weight:700;letter-spacing:-.01em;margin:2px 0 0}
  .pcard .sub{font-size:13px;color:var(--ink-2);margin:0}
  .pcard .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
  .pcard.rec{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc), var(--shadow)}
  .recflag{
    position:absolute;top:-9px;right:12px;background:var(--acc);color:var(--on-acc);border-radius:999px;padding:2px 10px;
    font-family:var(--font-d);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  }

  /* ---------- program detail ---------- */
  .phead{margin-top:16px}
  .phead .back{border:0;background:transparent;padding:0;color:var(--ink-3);font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
  .phead h1{font-family:var(--font-d);font-size:clamp(22px,5.5vw,28px);font-weight:700;letter-spacing:-.02em;margin:10px 0 4px}
  .note{
    margin-top:12px;background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--acc);
    border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink-2);
  }
  .exlist{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  .ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
  .ex-h{display:flex;gap:10px;padding:13px 14px 10px;align-items:flex-start}
  .ex-n{
    font-family:var(--font-m);font-size:12px;font-weight:600;color:var(--acc);background:var(--surface-2);
    border-radius:8px;width:26px;height:26px;display:grid;place-items:center;flex:none;margin-top:1px;
  }
  .ex-t{flex:1;min-width:0}
  .ex-t h3{font-family:var(--font-d);font-size:15.5px;font-weight:600;margin:0;letter-spacing:-.005em;line-height:1.3}
  .ex-t .prog{font-size:12.5px;color:var(--ink-3);margin-top:3px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .infobtn{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;width:26px;height:26px;flex:none;
    display:grid;place-items:center;font-size:12px;color:var(--ink-3);font-weight:700}
  .tip{margin:0 14px 10px;padding:9px 11px;background:var(--surface-2);border-radius:9px;font-size:13px;color:var(--ink-2)}
  .sets{padding:0 10px 10px;display:flex;flex-direction:column;gap:9px}
  .setblock{border-bottom:1px dashed var(--line);padding-bottom:8px}
  .setblock:last-child{border-bottom:0;padding-bottom:0}
  .setrow{display:grid;grid-template-columns:20px 1fr 74px 38px;gap:6px;align-items:center}
  .setmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:4px 0 0 26px}
  .setmeta .tgt{font-size:11px;color:var(--ink-3);flex:1;min-width:150px;line-height:1.35}
  .rirrow{display:flex;align-items:center;gap:3px}
  .rirrow .rlab{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
    font-family:var(--font-d);font-weight:700;margin-right:3px}
  .rirbtn{
    border:1px solid var(--line);background:var(--surface-2);border-radius:7px;min-width:28px;height:28px;
    font-family:var(--font-m);font-size:12px;font-weight:600;color:var(--ink-2);padding:0 5px;
  }
  .rirbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  /* ennätysmerkintä liikkeen kohdalla – aina kultainen */
  :root{
    --gold-1:#E7C867;--gold-2:#C9A227;--gold-3:#8C6D14;
    --silver-1:#EDF1F4;--silver-2:#B4BDC6;--silver-3:#5F6A74;
    --bronze-1:#E9BC93;--bronze-2:#C0824F;--bronze-3:#7A4A24;
    --m1:var(--gold-1);--m2:var(--gold-2);--m3:var(--gold-3);--mrgb:201,162,39;
  }
  .prbadge{
    display:flex;align-items:center;gap:12px;margin-top:9px;padding:10px 13px;
    background:linear-gradient(135deg, rgba(var(--mrgb),.20), rgba(var(--mrgb),.07));
    border:1px solid rgba(var(--mrgb),.60);
    border-radius:13px;box-shadow:0 6px 20px -14px rgba(var(--mrgb),.9), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .prbadge.silver{--m1:var(--silver-1);--m2:var(--silver-2);--m3:var(--silver-3);--mrgb:150,162,173}
  .prbadge.bronze{--m1:var(--bronze-1);--m2:var(--bronze-2);--m3:var(--bronze-3);--mrgb:192,130,79}
  .prbadge.none{--m1:var(--line-2);--m2:var(--ink-3);--m3:var(--ink-3);--mrgb:140,148,158}
  .prstars{display:flex;align-items:center;gap:2px;flex:none;line-height:1}
  .prstars i{
    font-style:normal;font-size:14px;
    background:linear-gradient(180deg,var(--m1),var(--m2) 55%,var(--m3));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 1px 1px rgba(90,70,10,.35));
  }
  .prstars i.mid{font-size:20px;margin-top:-3px}
  .prtext{display:flex;flex-direction:column;min-width:0;gap:1px}
  .prlabel{
    font-family:var(--font-d);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--m3);
  }
  .prval{font-size:19px;font-weight:600;line-height:1.15;letter-spacing:-.01em;color:var(--ink)}
  .prprev{font-size:11px;color:var(--ink-3);line-height:1.35}
  .mdot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;
    background:linear-gradient(180deg,var(--gold-1),var(--gold-3));flex:none}
  .mdot.silver{background:linear-gradient(180deg,var(--silver-1),var(--silver-3))}
  .mdot.bronze{background:linear-gradient(180deg,var(--bronze-1),var(--bronze-3))}
  .encbox{
    background:linear-gradient(135deg, rgba(150,162,173,.20), rgba(150,162,173,.07));
    border:1px solid rgba(150,162,173,.5);border-radius:13px;padding:11px 13px;margin-bottom:14px;
    font-size:13px;color:var(--ink-2);
  }
  .prbadge.pop{animation:prpop .5s cubic-bezier(.2,1.3,.4,1)}
  @keyframes prpop{
    0%{transform:scale(.94);opacity:0}
    60%{transform:scale(1.02);opacity:1}
    100%{transform:scale(1)}
  }
  @media (prefers-reduced-motion: reduce){.prbadge.pop{animation:none}}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .prlabel{color:var(--m1)}
    :root:not([data-theme="light"]) .prbox-h{color:var(--gold-1)}
  }
  :root[data-theme="dark"] .prlabel{color:var(--m1)}
  :root[data-theme="dark"] .prbox-h{color:var(--gold-1)}
  body[data-skin="dark"] .prlabel, body[data-skin="neon"] .prlabel{color:var(--m1)}
  body[data-skin="dark"] .prbox-h, body[data-skin="neon"] .prbox-h{color:var(--gold-1)}
  body[data-skin="light"] .prlabel, body[data-skin="deco"] .prlabel,
  body[data-skin="nature"] .prlabel, body[data-skin="mono"] .prlabel{color:var(--m3)}
  body[data-skin="light"] .prbox-h, body[data-skin="deco"] .prbox-h,
  body[data-skin="nature"] .prbox-h, body[data-skin="mono"] .prbox-h{color:var(--gold-3)}
  body[data-skin="neon"] .prbadge{box-shadow:0 0 30px -14px rgba(231,200,103,.9)}
  body[data-skin="deco"] .prbadge{border-radius:4px}
  body[data-skin="deco"] .prmedal{border-radius:2px}

  }

  .prbox-row b{font-size:17px;font-weight:600;white-space:nowrap;color:var(--ink)}
  .setrow .sn{font-family:var(--font-m);font-size:12px;color:var(--ink-3);text-align:center}
  .kgfield{display:flex;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .kgfield button{border:0;background:transparent;width:32px;height:38px;color:var(--ink-3);font-size:17px;font-weight:600;flex:none}
  .kgfield button:active{background:var(--line)}
  .kgfield input{
    border:0;background:transparent;width:100%;min-width:0;text-align:center;height:38px;
    font-family:var(--font-m);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;
  }
  .kgfield .unit{font-size:11px;color:var(--ink-3);padding-right:8px;font-weight:600}
  .numfield{
    background:var(--surface-2);border:1px solid var(--line);border-radius:10px;height:38px;display:flex;align-items:center;
  }
  .numfield input{border:0;background:transparent;width:100%;min-width:0;text-align:center;height:36px;
    font-family:var(--font-m);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
  .numfield select{border:0;background:transparent;width:100%;height:36px;text-align:center;font-size:13px;font-family:var(--font-m)}
  input[type=number]{-moz-appearance:textfield;appearance:textfield}
  input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .donebtn{
    width:34px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);
    display:grid;place-items:center;color:var(--ink-3);font-size:15px;font-weight:700;
  }
  .donebtn[aria-pressed="true"]{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
  .setlabels{display:grid;grid-template-columns:20px 1fr 74px 38px;gap:6px;padding:0 10px 4px}
  .setlabels span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700;font-family:var(--font-d);text-align:center}
  .setlabels span:nth-child(2){text-align:left;padding-left:6px}
  .ex-f{display:flex;gap:8px;padding:0 14px 12px;align-items:center;flex-wrap:wrap}
  .minibtn{border:1px solid var(--line);background:transparent;border-radius:9px;padding:5px 10px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
  .lastchip{border:1px dashed var(--line-2);background:transparent;border-radius:999px;padding:3px 10px;font-size:12px;color:var(--ink-2);font-family:var(--font-m)}
  .bestchip{
    display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:11.5px;
    background:linear-gradient(135deg, rgba(201,162,39,.18), rgba(201,162,39,.07));
    border:1px solid rgba(201,162,39,.45);color:var(--ink-2);
  }
  .advice{font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
  .advice.up{color:var(--ok)}
  .advice.down{color:var(--warn)}
  .advice.hold{color:var(--ink-3)}

  /* ---------- bottom bar ---------- */
  .bottom{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter:blur(12px);border-top:1px solid var(--line);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  }
  .bottom-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .bottom-in .backbtn{padding:10px 12px;white-space:nowrap}
  .barhide{
    border:1px solid var(--line);background:var(--surface);border-radius:9px;width:30px;height:30px;
    display:grid;place-items:center;color:var(--ink-3);font-size:13px;flex:none;order:-2;
  }
  .savewrap{margin-top:18px}
  .savebig{width:100%;padding:15px 18px;font-size:15px}
  .bottom-in .timer{order:-1;flex-basis:100%}
  .timer{
    display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);
    border-radius:11px;padding:6px 10px;flex:1;min-width:0;
  }
  .timer .t{font-family:var(--font-m);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
  .timer .bar{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden;min-width:20px}
  .timer .bar i{display:block;height:100%;background:var(--acc,var(--up));width:0%}
  .timer.zero .t{color:var(--ok)}

  /* ---------- history / progress ---------- */
  .tabs{display:flex;gap:6px;margin:16px 0 12px}
  .tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;font-family:var(--font-d)}
  .tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .hitem{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:flex-start}
  .hitem:last-child{border-bottom:0}
  .hitem .hd{font-family:var(--font-m);font-size:12px;color:var(--ink-3);width:62px;flex:none;padding-top:2px}
  .hitem h4{font-family:var(--font-d);font-size:14.5px;margin:0;font-weight:600}
  .hitem .det{font-size:12.5px;color:var(--ink-2);margin-top:3px;line-height:1.45}
  .phist{border-bottom:1px solid var(--line)}
  .phist:last-child{border-bottom:0}
  .phist summary{
    display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;list-style:none;
  }
  .phist summary::-webkit-details-marker{display:none}
  .phist summary::after{content:"▾";margin-left:auto;color:var(--ink-3);font-size:11px;transition:transform .15s ease}
  .phist[open] summary::after{transform:rotate(180deg)}
  .phist .ptitle{font-size:13px;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .phist .pbody{padding:0 14px 12px;display:flex;flex-direction:column;gap:6px}
  .chartbox{position:relative;padding:12px 6px 6px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
  .stat b{display:block;font-size:24px;font-weight:600;line-height:1.1;letter-spacing:-.02em}
  .stat span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:3px}
  body[data-skin="deco"] .stat{border-radius:4px}
  body[data-skin="neon"] .stat b{color:var(--silver);text-shadow:0 0 14px rgba(203,211,230,.45)}
  .tt{
    position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);border-radius:9px;
    padding:6px 9px;font-size:12px;box-shadow:var(--shadow);white-space:nowrap;transform:translate(-50%,-115%);z-index:5;
  }
  .pick{
    width:100%;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:14px;
    color:var(--ink);font-family:var(--font-b);
  }

  /* ---------- guide ---------- */
  .gsec{padding:14px}
  .gsec h3{font-family:var(--font-d);font-size:15px;margin:0 0 8px;font-weight:700}
  .gsec ul{margin:0;padding-left:18px;color:var(--ink-2);font-size:13.5px;display:flex;flex-direction:column;gap:5px}

  /* ---------- kalenteri ---------- */
  .calnav{display:flex;align-items:center;gap:10px;margin:16px 0 10px}

  .calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
  .calhead{margin-bottom:5px}
  .calhead span{text-align:center;font-family:var(--font-d);font-size:11px;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;color:var(--ink-3)}
  .calpad{display:block}

    aspect-ratio:1/1;border:1.5px solid var(--line);background:var(--surface);border-radius:11px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:2px;
    font-family:var(--font-m);font-size:13.5px;color:var(--ink-3);min-width:0;position:relative;overflow:hidden;
  }
  .calday:hover{border-color:var(--line-2)}
  .calday.has{font-weight:700}
  .calday.has .dn{font-size:15px;font-weight:700;line-height:1}
  .calday.is-today{box-shadow:inset 0 0 0 2px var(--surface), 0 0 0 2px var(--ink)}
  .calday .code{font-family:var(--font-d);font-size:10.5px;font-weight:700;letter-spacing:.05em;min-height:12px;line-height:1;opacity:.95}
  .calday.has{background:var(--k);border-color:var(--k);color:var(--on-acc)}
  .cstripe{position:absolute;left:0;right:0;bottom:0;display:flex;height:5px}
  .cstripe i{flex:1;display:block}
  .cstripe .s-gym{background:var(--up)}
  .cstripe .s-cardio{background:var(--cardio)}
  .cstripe .s-rest{background:var(--rest)}
  .callegend .sw{width:13px;height:13px;border-radius:4px;display:inline-block;flex:none;border:1px solid transparent}
  .callegend .s-gym{background:var(--up)}
  .callegend .s-cardio{background:var(--cardio)}
  .callegend .s-rest{background:var(--rest)}
  .cdots{display:flex;gap:3px;min-height:7px;align-items:center}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--line-2);display:inline-block;flex:none}
  .dot.k-gym{background:var(--up)}
  .dot.k-cardio{background:var(--cardio)}
  .dot.k-rest{background:transparent;box-shadow:inset 0 0 0 1.5px var(--rest)}
  .callegend{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .callegend .chip{gap:6px;font-size:11.5px}
  .daylist{display:flex;flex-direction:column;gap:10px}
  .dayitem{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2)}
  .dayitem b{font-family:var(--font-d);font-size:14.5px}
  .daylbl{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);
    font-family:var(--font-d);font-weight:700;margin-top:8px}
  .daylbl .pick{margin-top:4px;font-size:13.5px;padding:8px 10px}
  .minibtn.danger{color:var(--bad);border-color:var(--bad)}
  body[data-skin="deco"] .calday{border-radius:3px}
  body[data-skin="deco"] .dayitem{border-radius:4px}
  body[data-skin="nature"] .calday{border-radius:13px}
  body[data-skin="neon"] .calday.has{box-shadow:0 0 16px -10px var(--up)}
  body[data-skin="neon"] .calday.is-today{border-color:var(--up);box-shadow:0 0 0 1px var(--up), 0 0 22px -8px var(--up)}
  /* ---------- overlay ---------- */
  .ov{
    position:fixed;inset:0;z-index:60;background:rgba(10,13,18,.5);display:flex;padding:16px;
    overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  }
  .sheet{
    background:var(--surface);border:1px solid var(--line);border-radius:18px;width:100%;max-width:440px;
    padding:18px;box-shadow:0 20px 60px -20px rgba(0,0,0,.6);
    margin:auto auto 0;
    max-height:calc(100vh - 32px);
    max-height:calc(100dvh - 32px);
    overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  .sheet > .sticky-cta{
    position:sticky;bottom:-18px;z-index:2;background:var(--surface);
    margin:8px -18px -18px;padding:10px 18px 18px;

  .sheet > .sticky-cta .btn{width:100%}
  .sheet h3{font-family:var(--font-d);font-size:19px;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
  .sheet p{color:var(--ink-2);font-size:13.5px;margin:0 0 14px}
  .sumlist{display:flex;flex-direction:column;gap:7px;margin:0 0 16px}
  .sumrow{display:flex;justify-content:space-between;gap:10px;font-size:13px;border-bottom:1px solid var(--line);padding-bottom:6px}
  .sumrow:last-child{border-bottom:0}
  /* vanhan treenin tarkastelu */
  .stats.tight{grid-template-columns:repeat(auto-fit,minmax(92px,1fr))}
  .stats.tight .stat{padding:10px 11px}
  .stats.tight .stat b{font-size:20px}
  .stats.tight .stat span{font-size:10.5px}
  .hlink{cursor:pointer;-webkit-tap-highlight-color:transparent}
  .hlink:active{background:var(--surface-2)}
  .hlink .det{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .hlink .go{margin-left:auto;align-self:center;flex:none;color:var(--ink-3);font-size:15px;line-height:1}
  .hlink:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
  .vnav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}
  .vnav .minibtn{max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vsess{margin-top:4px}
  .vex{padding:12px 0;border-bottom:1px solid var(--line)}
  .vex:first-child{padding-top:4px}
  .vex:last-child{border-bottom:0}

  .setlog span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
    font-family:var(--font-m);font-size:12.5px;padding:4px 9px;border-radius:9px;
    background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}

  /* ============ TEEMAT ============ */
  /* Tokenit määritellään bodylle, jolloin ne voittavat :root-oletukset molemmissa järjestelmätiloissa. */

  body[data-skin="light"]{
    --bg:#F2F1ED;--surface:#FFFFFF;--surface-2:#F7F6F2;--line:#E5E2DA;--line-2:#CAC6BC;
    --ink:#22252A;--ink-2:#53585E;--ink-3:#85888B;
    --up:#4F6D7A;--up-soft:#E5ECEF;--low:#5F7A5F;--low-soft:#E6EDE3;
    --ok:#4A7A52;--ok-soft:#E4EFE3;--warn:#8E6A28;--warn-soft:#F5EDDC;--bad:#A55146;
    --on-acc:#FFFFFF;--rest:#6F6D67;--cardio:#96592F;--cardio-soft:#F3E7DC;--shadow:0 1px 2px rgba(34,30,22,.05), 0 10px 26px -16px rgba(34,30,22,.28);
  }
  body[data-skin="dark"]{
    --bg:#0D1015;--surface:#161B22;--surface-2:#1D232C;--line:#2A313C;--line-2:#3A4351;
    --ink:#E7EBF1;--ink-2:#AAB4C1;--ink-3:#7D8895;
    --up:#9B95FF;--up-soft:#232244;--low:#3FC7B4;--low-soft:#123430;
    --ok:#5CCB8E;--ok-soft:#14301F;--warn:#E0A44A;--warn-soft:#332616;--bad:#F0837C;
    --on-acc:#0D1015;--rest:#8D97A8;--cardio:#E8A94E;--cardio-soft:#3A2A12;--shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  }

  /* --- Tumma neon synth --- */
  body[data-skin="neon"]{
    --bg:#09060F;--surface:#150F24;--surface-2:#1F1834;--line:#342C4E;--line-2:#5C5B7E;
    --ink:#F6F3FF;--ink-2:#C6CBDE;--ink-3:#99A1BA;
    --up:#C08BFF;--up-soft:#2E1B4C;--low:#3DEBD0;--low-soft:#0F3430;
    --ok:#5BEA97;--ok-soft:#0F3325;--warn:#FFC85C;--warn-soft:#352810;--bad:#FF7BA6;
    --on-acc:#09060F;--rest:#9AA3BE;--cardio:#2FE3C6;--cardio-soft:#0F3430;
    --silver:#CBD3E6;--silver-dim:#8E97AE;
    --shadow:0 1px 2px rgba(0,0,0,.6), 0 14px 38px -18px rgba(0,0,0,.95), inset 0 1px 0 rgba(203,211,230,.09);
    background-image:
      radial-gradient(900px 480px at 50% -15%, rgba(120,60,220,.30) 0%, rgba(120,60,220,0) 70%),
      radial-gradient(700px 420px at 90% 110%, rgba(61,235,208,.12) 0%, rgba(61,235,208,0) 70%);
    background-attachment:fixed;
  }
  body[data-skin="neon"] .topbar{border-bottom-color:rgba(203,211,230,.22);box-shadow:0 1px 14px -6px rgba(192,139,255,.55)}
  body[data-skin="neon"] .brand{color:var(--silver);text-shadow:0 0 16px rgba(192,139,255,.65)}
  body[data-skin="neon"] .brand span{color:var(--up);text-shadow:0 0 14px rgba(192,139,255,.8)}
  body[data-skin="neon"] .eyebrow{color:var(--silver-dim);letter-spacing:.18em;text-shadow:0 0 12px rgba(203,211,230,.35)}
  body[data-skin="neon"] .today .date,
  body[data-skin="neon"] .pcard .day{letter-spacing:.18em;text-shadow:0 0 12px currentColor}
  body[data-skin="neon"] .card,
  body[data-skin="neon"] .ex,
  body[data-skin="neon"] .pcard,
  body[data-skin="neon"] .wd,
  body[data-skin="neon"] .sheet{border-color:rgba(203,211,230,.20)}
  body[data-skin="neon"] .today{
    border-color:rgba(203,211,230,.28);
    box-shadow:0 0 0 1px rgba(192,139,255,.18), 0 18px 48px -22px rgba(192,139,255,.55), inset 0 1px 0 rgba(203,211,230,.14);
  }
  body[data-skin="neon"] .today h1,
  body[data-skin="neon"] .phead h1{
    color:var(--silver);
    background:linear-gradient(180deg,#FFFFFF 0%,#D8DDEC 45%,#9AA3BD 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 18px rgba(192,139,255,.45));
  }
  body[data-skin="neon"] .today::before{width:5px;background:linear-gradient(180deg,var(--acc),rgba(203,211,230,.9));box-shadow:0 0 22px var(--acc)}
  body[data-skin="neon"] .btn.accent{box-shadow:0 0 26px -4px var(--acc, var(--up)), inset 0 1px 0 rgba(255,255,255,.35)}

   ============================================================ */

const PERSONS = ['iida','matti'];
const PERSON_NAMES = {iida:'Iidis', matti:'Matti'};
function personName(p){ return PERSON_NAMES[p] || p; }
const store = {iida:{sessions:[],active:null}, matti:{sessions:[],active:null}};
let db = null;
const pending = {iida:null, matti:null};
const writing = {iida:false, matti:false};
let saveNote = '';

function lsKey(p){ return 'salikirja-'+p; }
function loadLocal(){
  PERSONS.forEach(function(p){
    try{
      const raw = localStorage.getItem(lsKey(p));
      if(raw){ const o = JSON.parse(raw); if(o && o.sessions) store[p] = o; }
    }catch(e){}
  });
}
function writeLocal(p){
  try{ localStorage.setItem(lsKey(p), JSON.stringify(store[p])); }catch(e){}
}
function save(p){
  writeLocal(p);
  if(!db) return;
  clearTimeout(pending[p]);
  pending[p] = setTimeout(function(){ flush(p); }, 800);
}
function flush(p){
  if(!db || writing[p]) { if(db) pending[p] = setTimeout(function(){flush(p);}, 500); return; }
  writing[p] = true;
  const body = {sessions: store[p].sessions.slice(-90), active: store[p].active, updated: new Date().toISOString()};
  db.doc('logs/'+p).set(body).then(function(){
    writing[p] = false;
  }).catch(function(err){
    writing[p] = false;
    if(err && err.code === 'unavailable'){ pending[p] = setTimeout(function(){flush(p);}, 3000); }
    else { saveNote = 'Pilvitallennus ei ole käytössä – tiedot säilyvät tällä laitteella.'; db = null; renderAll(); }
  });
}

function connect(){
  if(!window.claude || !window.claude.use) return;
  window.claude.use('db').then(function(d){
    if(!d) return;
    db = d;
    PERSONS.forEach(function(p){
      d.doc('logs/'+p).onSnapshot(function(snap){
        if(!snap.exists) return;
        if(snap.metadata && snap.metadata.hasPendingWrites) return;
        const data = snap.data() || {};
        const remoteSessions = Array.isArray(data.sessions) ? data.sessions : [];
        const busy = (state.view === 'program' && state.person === p && store[p].active);
        if(busy){
          store[p].sessions = mergeSessions(store[p].sessions, remoteSessions);
        }else{
          store[p].sessions = mergeSessions(store[p].sessions, remoteSessions);
          store[p].active = data.active || null;
        }
        writeLocal(p);
        if(state.view !== 'program') renderAll();
      }, function(){ /* subscription ended – local data keeps working */ });
    });
  }).catch(function(){});
}
function mergeSessions(a,b){
  const byId = {};
  a.concat(b).forEach(function(s){ if(s && s.id) byId[s.id] = s; });
  return Object.keys(byId).map(function(k){return byId[k];})
    .sort(function(x,y){ return (x.end||'') < (y.end||'') ? -1 : 1; });
}

const DAYNAMES = ['sunnuntai','maanantai','tiistai','keskiviikko','torstai','perjantai','lauantai'];
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pad(n){ return n<10 ? '0'+n : ''+n; }
function fmtDate(iso){ const d = new Date(iso); return d.getDate()+'.'+(d.getMonth()+1)+'.'; }
function isoDay(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function monIndex(d){ return (d.getDay()+6)%7; } // 0 = maanantai
function hoursSince(iso){ return (Date.now() - new Date(iso).getTime())/36e5; }
function agoText(iso){
  const h = hoursSince(iso);
  if(h < 1) return 'juuri äsken';
  if(h < 24) return Math.round(h)+' h sitten';
  const d = Math.round(h/24);
  return d === 1 ? 'eilen' : d+' päivää sitten';
}
function num(v){ const n = parseFloat(String(v).replace(',','.')); return isFinite(n) ? n : 0; }
function progById(id){ for(const p of PROGRAMS) if(p.id === id) return p; return null; }
function progsFor(person){ return PROGRAMS.filter(function(p){ return p.person === person; }); }
function strengthSessions(person){
  return store[person].sessions.filter(function(s){ return s.pid && progById(s.pid); })
    .sort(function(a,b){ return (a.end||'') < (b.end||'') ? 1 : -1; }); // uusin ensin
}
function partnerProgram(pid){
  const p = progById(pid);
  if(!p) return null;
  const other = (p.person === 'iida') ? 'matti' : 'iida';
  return progsFor(other).filter(function(x){ return x.rot === p.rot; })[0] || null;
}
function sharedKeys(pid){
  const op = partnerProgram(pid);
  if(!op) return {};
  const set = {};
  op.ex.forEach(function(e){ set[e.key] = true; });
  return set;
}
function accentOf(p){ return p && p.type === 'ala' ? 'var(--low)' : 'var(--up)'; }

/* edellisen kerran sarjat tälle liikkeelle */
function lastFor(person, pid, key){
  const list = strengthSessions(person);
  let fallback = null;
  for(const s of list){
    const e = s.entries && s.entries[key];
    if(e && e.length && e.some(function(x){ return num(x.kg) > 0 || num(x.reps) > 0; })){
      if(s.pid === pid) return {sets:e, end:s.end, same:true, pid:s.pid};
      if(!fallback) fallback = {sets:e, end:s.end, same:false, pid:s.pid};
    }
  }
  return fallback;
}
function setsSummary(sets){
  const use = sets.filter(function(s){ return num(s.kg) > 0 || num(s.reps) > 0; });
  if(!use.length) return '';
  const kgs = use.map(function(s){ return num(s.kg); });
  const allSame = kgs.every(function(k){ return k === kgs[0]; });
  const reps = use.map(function(s){ return num(s.reps) || '–'; }).join('/');
  if(allSame) return (kgs[0] ? kgs[0]+' kg' : 'oma paino') + ' × ' + reps;
  return use.map(function(s){ return num(s.kg)+'×'+(num(s.reps)||'–'); }).join(', ');
}
function topKg(sets){
  let best = 0;
  sets.forEach(function(s){ if(num(s.reps) > 0 && num(s.kg) > best) best = num(s.kg); });
  return best;
}
function fmtKg(n){
  const r = Math.round(n * 100) / 100;
  return String(r).replace('.', ',');
}

/* Progressio-ohje:
   - kaikki määrätyt sarjat ylärajassa ja varasto 0-2 -> lisää painoa
   - alueen sisällä -> pidä paino, hae lisää toistoja
   - yksi sarja alarajan alle -> pidä paino, yritä uudelleen
   - kaksi sarjaa tai toistuvasti alle -> kevennä                         */
function advice(def, sets, prevSets){
  const done = sets.filter(function(s){ return num(s.reps) > 0; });
  if(!done.length) return null;
  const complete = done.length >= def.sets;
  const allTop = done.every(function(s){ return num(s.reps) >= def.hi; });
  const below = done.filter(function(s){ return num(s.reps) < def.lo; }).length;
  const prevBelow = prevSets ? prevSets.filter(function(s){
    return num(s.reps) > 0 && num(s.reps) < def.lo; }).length : 0;

  if(complete && allTop) return {k:'up', t:'Lisää pienin paino ensi kerralla'};
  if(below >= 2 || (below >= 1 && prevBelow >= 1)) return {k:'down', t:'Toistot jäävät alarajan alle – kevennä'};
  if(below === 1) return {k:'hold', t:'Yksi sarja jäi alle – pidä paino ja yritä ensi kerralla uudestaan'};
  return {k:'hold', t:'Hae lisää toistoja samalla painolla'};
}

/* paras aiempi työsarja tässä ohjelmassa */
/* Ennätys lasketaan liikkeen KAIKISTA kirjauksista, myös A- ja B-päivien yli:
   ennätys on ennätys riippumatta siitä kummalla päivällä se tehtiin.
   Sen sijaan tavoitteet, esitäyttö ja hopea/pronssi vertaavat aina saman
   ohjelman edelliseen kertaan, koska liikejärjestys vaikuttaa painoihin. */
function bestSet(person, key){
  let best = null;
  store[person].sessions.forEach(function(s){
    if(!s.entries || !progById(s.pid)) return;
    const arr = s.entries[key];
    if(!arr) return;
    arr.forEach(function(x){
      const kg = num(x.kg), reps = num(x.reps);
      if(reps <= 0) return;
      if(!best || kg > best.kg || (kg === best.kg && reps > best.reps))
        best = {kg:kg, reps:reps, end:s.end, pid:s.pid};
    });
  });
  return best;
}
function bestSetLabel(best){
  if(!best) return '';
  const pr = progById(best.pid);
  return fmtKg(best.kg) + ' kg × ' + best.reps + (pr ? ' · ' + pr.day.slice(0,2) + ' ' + fmtDate(best.end) : '');
}

/* Mitali: kulta = ennätys, hopea = sama tai parempi kuin viimeksi, pronssi = kevyempi kerta.
   Hopea ja pronssi näytetään vasta kun ohjelman sarjat on kirjattu, jottei kesken treenin
   tule turhaa "tippui"-viestiä. */
function topOf(sets){
  const done = sets.filter(function(s){ return num(s.reps) > 0; });
  if(!done.length) return null;
  return done.slice().sort(function(x,y){
    return (num(y.kg) - num(x.kg)) || (num(y.reps) - num(x.reps)); })[0];
}
/* saman ohjelman edellinen kerta (ei koskaan toisen päivän kirjaus) */
function prevSameProgram(person, pid, key, skipId){
  const list = strengthSessions(person);
  for(let i = 0; i < list.length; i++){
    const s = list[i];
    if(s.pid !== pid) continue;
    if(skipId && s.id === skipId) continue;
    const arr = s.entries && s.entries[key];
    if(arr && arr.length && arr.some(function(x){ return num(x.reps) > 0; })) return arr;
  }
  return null;
}
function totalsOf(sets){
  let vol = 0, reps = 0, n = 0;
  (sets || []).forEach(function(s){
    const k = num(s.kg), r = num(s.reps);
    if(r <= 0) return;
    vol += (k || 1) * r; reps += r; n++;
  });
  return {vol:vol, reps:reps, n:n};
}
/* final = treeni tallennetaan: arvioidaan vaikka kaikkia sarjoja ei olisi kirjattu */
function prevForMedal(person, pid, key, skipId){
  const same = prevSameProgram(person, pid, key, skipId);
  if(same) return {sets:same, cross:false, pid:pid};
  const list = strengthSessions(person);
  for(let i = 0; i < list.length; i++){
    const s = list[i];
    if(skipId && s.id === skipId) continue;
    if(!progById(s.pid)) continue;
    const arr = s.entries && s.entries[key];
    if(arr && arr.length && arr.some(function(x){ return num(x.reps) > 0; }))
      return {sets:arr, cross:true, pid:s.pid};
  }
  return null;
}
function medalFor(person, pid, def, sets, prevInfo, final, bestIn){
  const prevSets = prevInfo ? prevInfo.sets : null;
  const top = topOf(sets);
  if(!top) return null;
  const kg = num(top.kg), reps = num(top.reps);
  /* bestIn annetaan kun katsotaan vanhaa treeniä: ennätys lasketaan vain sitä ennen */
  const best = (arguments.length > 6) ? bestIn : bestSet(person, def.key);
  if(best && (kg > best.kg || (kg === best.kg && reps > best.reps))){
    return {tier:'gold', mode: kg > best.kg ? 'kg' : 'reps',
            kg:kg, reps:reps, pkg:best.kg, preps:best.reps, blabel: bestSetLabel(best)};
  }
  const doneCount = sets.filter(function(s){ return num(s.reps) > 0; }).length;
  if(!final && doneCount < def.sets) return null;
  const prev = prevSets ? topOf(prevSets) : null;
  if(!prev) return {tier:'none', mode:'first', kg:kg, reps:reps};
  const pkg = num(prev.kg), preps = num(prev.reps);
  const tn = totalsOf(sets), tp = totalsOf(prevSets);
  const cross = prevInfo && prevInfo.cross;
  const cday = cross ? (progById(prevInfo.pid) ? progById(prevInfo.pid).day.slice(0,2) : '') : '';
  const base = {kg:kg, reps:reps, pkg:pkg, preps:preps,
                nreps:tn.reps, preps_tot:tp.reps, nsets:tn.n, psets:tp.n,
                cross:cross, cday:cday,
                bkg: best ? best.kg : 0, breps: best ? best.reps : 0};
  if(kg > pkg || (kg === pkg && reps > preps))
    return Object.assign({tier:'silver', mode:'up'}, base);
  if(kg < pkg || (kg === pkg && reps < preps))
    return Object.assign({tier:'bronze', mode:'down'}, base);
  /* paras sarja täsmälleen sama -> ratkaisee kokonaismäärä */
  if(tn.vol > tp.vol) return Object.assign({tier:'silver', mode:'volup'}, base);
  if(tn.vol < tp.vol) return Object.assign({tier:'bronze', mode:'voldown'}, base);
  return Object.assign({tier:'silver', mode:'same'}, base);
}
function medalText(m){
  const val = fmtKg(m.kg) + ' kg × ' + m.reps;
  const prev = fmtKg(m.pkg) + ' kg × ' + m.preps;
  const cross = m.cross ? ' · verrattu ' + m.cday + '-päivään (eri liikejärjestys)' : '';
  if(m.tier === 'none') return {
    stars:0, label:'Ei vertailukohtaa', val: val,
    note:'tämä on ensimmäinen kirjaus tästä liikkeestä – siitä tulee vertailukohta ensi kerralle'};
  if(m.tier === 'gold') return {
    stars:3,
    label: m.mode === 'kg' ? 'Uusi ennätyspaino' : 'Ennätys toistoissa',
    val: val, note: 'aiempi ennätys ' + (m.blabel || prev)};
  if(m.mode === 'volup') return {
    stars:2, label:'Enemmän työtä kuin viimeksi', val: val,
    note: 'sama paras sarja, mutta toistoja yhteensä ' + m.preps_tot + ' → ' + m.nreps + cross};
  if(m.mode === 'voldown') return {
    stars:1, label:'Kevyempi kerta', val: val,
    note: (m.nsets < m.psets ? 'sarjoja ' + m.psets + ' → ' + m.nsets + ', ' : '') +
          'toistoja yhteensä ' + m.preps_tot + ' → ' + m.nreps + ' – sama paino ensi kerralla' + cross};
  if(m.tier === 'silver' && m.mode === 'up'){
    const dkg = m.kg - m.pkg;
    const delta = dkg > 0 ? '+' + fmtKg(dkg) + ' kg' : '+' + (m.reps - m.preps) + ' toistoa';
    let note = delta + ' edelliseen (' + prev + ')';
    if(m.bkg){
      const gap = m.bkg - m.kg;
      note += gap > 0
        ? ' – ennätykseen ' + fmtKg(m.bkg) + ' kg matkaa ' + fmtKg(gap) + ' kg'
        : ' – ennätys ' + fmtKg(m.bkg) + ' kg × ' + m.breps + ' vielä edellä';
    }
    return {stars:2, label:'Nousua edelliseen', val: val, note: note + cross};
  }
  if(m.tier === 'silver') return {
    stars:2, label:'Sama taso', val: val,
    note: 'tason pitäminen on edistystä – toistot nousevat seuraavaksi' + cross};
  return {
    stars:1, label:'Kevyempi kerta', val: val,
    note: 'edellinen kerta ' + prev +
          (m.nsets < m.psets ? ' (sarjoja ' + m.psets + ' → ' + m.nsets + ')' : '') +
          ' – uni ja ruoka ratkaisevat, sama paino ensi kerralla' + cross};
}

/* sarjakohtainen "viimeksi / tavoite" */
function setTargetText(def, prevSet){
  if(!prevSet) return '';
  const kg = num(prevSet.kg), reps = num(prevSet.reps);
  if(reps <= 0 && kg <= 0) return '';
  const rir = (prevSet.rir === '' || prevSet.rir == null) ? null : num(prevSet.rir);
  const last = 'Viimeksi ' + (kg ? fmtKg(kg) + ' kg' : 'oma paino') + ' × ' + (reps || '–') +
               (rir !== null ? ' @' + rir : '');
  let target;
  if(reps >= def.hi && (rir === null || rir <= 2)){
    target = kg ? fmtKg(kg + 2.5) + ' kg × ' + def.lo + '–' + def.hi : 'lisää toistoja';
  }else if(reps > 0){
    target = (kg ? fmtKg(kg) + ' kg × ' : '') + Math.min(def.hi, reps + 1);
  }else{
    target = (kg ? fmtKg(kg) + ' kg × ' : '') + def.lo + '–' + def.hi;
  }
  return last + ' · tavoite ' + target;
}

/* ---- adaptiivinen viikkosuunnitelma ----
   Säännöt ovat ohjelman omat, eivät arvaus:
   - kierto ratkaisee: Yla A -> Ala A -> Yla B -> Ala B jatkuu siita mihin jaatiin,
     viikko ei koskaan nollaudu maanantaina
   - kalenteri ehdottaa paivan (runko: ma, ti, to, la), mutta ei pakota maaraa
   - saman alueen kovien treenien valiin vahintaan 2 vrk, eri alueen valiin 1 vrk
   - jos treeneista on kulunut 3 vrk tai enemman, kierto jatkuu heti kun palautuminen sallii
   - cardio 1-2 kertaa viikossa, muuten lepo                                              */

function progCode(p){ return (p.type === 'ala' ? 'A' : 'Y') + p.name.slice(-1); }
function daysBetween(a, b){
  const x = new Date(a.getFullYear(), a.getMonth(), a.getDate());
  const y = new Date(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((y - x) / 86400000);
}
const WEEK_GYM_TARGET = 4;
const WEEK_CARDIO_TARGET = 2;

function adaptiveWeek(person){
  const monday = weekStartOf(new Date());
  const todayIso = isoDay(new Date());
  const progs = progsFor(person);

  /* lähtötilanne edellisiltä viikoilta */
  let lastRot = null, lastArea = null, lastDate = null;
  const hist = strengthSessions(person);
  for(let i = 0; i < hist.length; i++){
    const d = new Date(hist[i].end);
    if(d < monday){
      const p = progById(hist[i].pid);
      if(p){ lastRot = p.rot; lastArea = p.type; lastDate = d; }
      break;
    }
  }

  let gymCount = 0, cardioCount = 0, doneGym = 0, doneCardio = 0;
  const out = [];

  for(let i = 0; i < 7; i++){
    const d = new Date(monday); d.setDate(monday.getDate() + i);
    const iso = isoDay(d);
    const logs = sessionsOn(person, iso);
    const gymLog = logs.filter(function(x){ return progById(x.pid); })[0];
    const cardioLog = logs.filter(function(x){ return x.pid === 'cardio'; })[0];
    const restLog = logs.filter(function(x){ return x.pid === 'rest'; })[0];

    if(gymLog){
      const p = progById(gymLog.pid);
      gymCount++; doneGym++; lastRot = p.rot; lastArea = p.type; lastDate = d;
      out.push({iso:iso, state:'done', kind:'gym', code:progCode(p), label:p.name, pid:p.id});
      continue;
    }
    if(cardioLog || restLog){
      if(cardioLog){ cardioCount++; doneCardio++; }
      out.push({iso:iso, state:'done', kind: cardioLog ? 'cardio' : 'rest',
                code: cardioLog ? 'C' : 'L', label: cardioLog ? (cardioLog.kind || 'Cardio') : 'Lepo'});
      continue;
    }
    if(iso < todayIso){
      out.push({iso:iso, state:'empty', kind:null, code:'–', label:'Ei kirjausta'});
      continue;
    }

    /* ehdotus */
    const baseRot = WEEKPLAN[i].rot;
    const baseIsGym = (typeof baseRot === 'number');
    let baseGymDaysLater = 0;
    for(let j = i + 1; j < 7; j++) if(typeof WEEKPLAN[j].rot === 'number') baseGymDaysLater++;

    const nextRot = (lastRot === null) ? 0 : (lastRot + 1) % 4;
    const nextProg = progs[nextRot];
    const needGap = (lastArea === null) ? 0 : (nextProg.type === lastArea ? 2 : 1);
    const sinceGym = (lastDate === null) ? 99 : daysBetween(lastDate, d);
    const gapOk = sinceGym >= needGap;
    const drifting = sinceGym >= 3;

    let pick;
    if(gapOk && (baseIsGym || drifting)) pick = 'gym';
    else if(baseRot === 'rest' && !drifting) pick = 'rest';
    else pick = (cardioCount < WEEK_CARDIO_TARGET) ? 'cardio' : 'rest';

    if(pick === 'gym'){
      gymCount++; lastRot = nextRot; lastArea = nextProg.type; lastDate = d;
      let why = baseIsGym ? 'Rungon treenipäivä – kierrossa seuraavana.'
                          : 'Edellisestä treenistä ' + sinceGym + ' vrk – kierto jatkuu tästä.';
      out.push({iso:iso, state:'suggest', kind:'gym', code:progCode(nextProg),
                label:nextProg.name, pid:nextProg.id, why:why});
    }else if(pick === 'cardio'){
      cardioCount++;
      out.push({iso:iso, state:'suggest', kind:'cardio', code:'C', label:'Cardio',
                why: !gapOk ? 'Saman alueen treenistä ei ole vielä kulunut 2 vrk.' : 'Rungon cardiopäivä.'});
    }else{
      out.push({iso:iso, state:'suggest', kind:'rest', code:'L', label:'Lepo',
                why: !gapOk ? 'Palautuminen kesken – lepo tukee kasvua enemmän kuin ylimääräinen treeni.' : 'Rungon lepopäivä.'});
    }
  }
  return {days:out, gym:doneGym, cardio:doneCardio, planned:gymCount};
}

/* suositus tälle päivälle */
function recommend(person){
  const wk = adaptiveWeek(person);
  const todayIso = isoDay(new Date());
  let cell = null, todayIdx = 0;
  wk.days.forEach(function(c, i){ if(c.iso === todayIso){ cell = c; todayIdx = i; } });
  const list = strengthSessions(person);
  const last = list[0];
  const lastProg = last ? progById(last.pid) : null;
  const lastTxt = lastProg ? 'Viimeksi ' + lastProg.name + ' ' + agoText(last.end) + '.' : 'Ei vielä kirjattuja treenejä.';
  const weekTxt = ' Tällä viikolla ' + wk.gym + ' treeniä kirjattu.';

  /* seuraava ehdotettu treenipäivä viikolla */
  let nextGym = null;
  for(let i = todayIdx; i < wk.days.length; i++){
    const c = wk.days[i];
    if(c.state === 'suggest' && c.kind === 'gym'){ nextGym = {cell:c, idx:i}; break; }
  }

  if(cell && cell.state === 'suggest' && cell.kind === 'gym'){
    return {pid:cell.pid, rest:false, why: lastTxt + ' Kierrossa seuraavana on ' + cell.label + '.' + weekTxt +
      (cell.why && cell.why.indexOf('Kiinnikurominen') === 0 ? ' ' + cell.why : '')};
  }

  const fallbackPid = nextGym ? nextGym.cell.pid : progsFor(person)[0].id;
  let why;
  if(cell && cell.state === 'done'){
    why = 'Tämä päivä on jo kirjattu (' + cell.label + ').' + weekTxt +
      (nextGym ? ' Seuraava treeni ' + WEEKPLAN[nextGym.idx].d.toLowerCase() + ': ' + nextGym.cell.label + '.' : '');
  }else{
    why = lastTxt + ' ' + (cell && cell.why ? cell.why : '') + weekTxt +
      (nextGym ? ' Seuraava treeni ' + WEEKPLAN[nextGym.idx].d.toLowerCase() + ': ' + nextGym.cell.label + '.' : '');
  }
  return {pid:fallbackPid, rest:true, why:why};
}

function todayEntries(person){
  const t = isoDay(new Date());
  return store[person].sessions.filter(function(s){ return s.end && isoDay(new Date(s.end)) === t; });
}
function weekStats(person){
  const now = new Date();
  const monday = new Date(now); monday.setHours(0,0,0,0); monday.setDate(now.getDate() - monIndex(now));
  const done = store[person].sessions.filter(function(s){ return s.end && new Date(s.end) >= monday; });
  return {
    gym: done.filter(function(s){ return progById(s.pid); }),
    cardio: done.filter(function(s){ return s.pid === 'cardio'; }),
    rest: done.filter(function(s){ return s.pid === 'rest'; }),
    monday: monday
  };
}

function lastSessionButton(person){
  const last = strengthSessions(person)[0];
  if(!last) return '';
  const p = progById(last.pid);
  if(!p) return '';
  const endMs = endMsOf(last);
  let sets = 0, golds = 0, medal = '';
  let bestTier = 3;
  const RANK = {gold:0, silver:1, bronze:2, none:3};
  p.ex.forEach(function(def){
    const arr = last.entries && last.entries[def.key];
    if(!arr || !arr.length) return;
    sets += arr.length;
    const m = medalFor(person, last.pid, def, arr,
                       prevBefore(person, last.pid, def.key, endMs, last.id), true,
                       bestSetBefore(person, def.key, endMs, last.id));
    if(!m) return;
    if(m.tier === 'gold') golds++;
    if(RANK[m.tier] < bestTier){ bestTier = RANK[m.tier]; medal = m.tier; }
  });
  const bits = [fmtDate(last.end) + ' · ' + agoText(last.end), sets + (sets === 1 ? ' sarja' : ' sarjaa')];
  if(golds) bits.push(golds === 1 ? '1 ennätys' : golds + ' ennätystä');
  if(last.note) bits.push('muistiinpano');
  return '<button type="button" class="lastbtn" data-session="' + last.id + '">' +
    (medal ? '<i class="mdot ' + medal + '" aria-hidden="true"></i>' : '') +
    '<span style="min-width:0"><b>Viimeisin treeni · ' + esc(p.name) + '</b>' +
    '<small>' + esc(bits.join(' · ')) + '</small></span>' +
    '<span class="chev" aria-hidden="true">›</span></button>';
}

    'maanantaina. Runko ehdottaa päivän, saman alueen treenien väliin jää vähintään 2 vrk.</p>';

       '<button type="button" class="minibtn" data-view="calendar">Kalenteri →</button></div>';

    const tags = [], kinds = [];
    logs.forEach(function(sx){
      const tg = entryTag(sx);

      tags.push(tg);
      if(kinds.indexOf(tg.k) < 0) kinds.push(tg.k);
    });
    const ord = sortKinds(kinds);
    const codes = tags.slice(0,2).map(function(tg){ return tg.t; }).join('·') + (tags.length > 2 ? '+' : '');
    let stripe = '';
    if(ord.length > 1){
      stripe = '<span class="cstripe">' + ord.slice(1).map(function(k){ return '<i class="s-' + k + '"></i>'; }).join('') + '</span>';
    }
    h += '<button type="button" class="calday wd2' + (isToday ? ' is-today' : '') +

    h += '<span class="chip ' + (p.type === 'ala' ? 'low' : 'up') + '">' + (p.type === 'ala' ? 'Alavartalo' : 'Ylävartalo') + '</span></div>';
    h += '<p class="sub">' + esc(p.sub) + '</p>';
    const sh = sharedKeys(p.id);
    let shCount = 0;
    p.ex.forEach(function(e){ if(sh[e.key]) shCount++; });
    h += '<div class="meta"><span class="chip">' + p.ex.length + ' liikettä</span><span class="chip">' + sets + ' työsarjaa</span>';
    if(shCount) h += '<span class="chip shared">' + shCount + '/' + p.ex.length + ' yhteistä</span>';
    h += '<span class="chip">' + (last ? 'Viimeksi ' + agoText(last.end) : 'Ei kirjauksia') + '</span></div>';
    if(last){
      const bits = [];
      p.ex.slice(0,3).forEach(function(e){
        const s = last.entries && last.entries[e.key];
        if(s){ const t = topKg(s); if(t) bits.push(e.name.split(/[ ,]/)[0].replace(/[^A-Za-zÅÄÖåäö]/g,'').toLowerCase() + ' ' + t + ' kg'); }
      });
      if(bits.length) h += '<p class="sub mono" style="font-size:12px;color:var(--ink-3)">' + esc(bits.join(' · ')) + '</p>';
    }

  /* alapalkki: historia + tallennustila */
  h += '<div class="row spread" style="margin-top:22px;flex-wrap:wrap;gap:8px">';

    (saveNote || 'Tiedot tallentuvat tähän selaimeen.');

let progDom = null; // {pid, nodes}

function ensureActive(pid){
  const person = state.person;
  let a = store[person].active;
  if(!a || a.pid !== pid){
    a = {pid:pid, start:new Date().toISOString(), entries:{}, note:''};
    store[person].active = a;
  }
  const p = progById(pid);
  p.ex.forEach(function(e){
    if(!a.entries[e.key]){
      const prev = lastFor(person, pid, e.key);
      a.entries[e.key] = [];
      for(let i=0;i<e.sets;i++){
        const pv = prev && prev.sets[i] ? prev.sets[i] : (prev && prev.sets[prev.sets.length-1]);
        a.entries[e.key].push({kg: pv ? String(num(pv.kg) || '') : '', reps:'', rir:'', done:false});
      }
    }
  });
  return a;
}

let progChartKey = null;

function programPoints(person, pid, key){
  const out = [];
  store[person].sessions.slice().sort(function(a,b){ return (a.end || '') < (b.end || '') ? -1 : 1; })
    .forEach(function(s){
      if(s.pid !== pid || !s.entries) return;
      if(key === '__volume'){
        let vol = 0, sets = 0;
        for(const k in s.entries) s.entries[k].forEach(function(x){
          vol += (num(x.kg) || 0) * (num(x.reps) || 0); sets++;
        });
        if(sets) out.push({end:s.end, val:Math.round(vol), sub:sets + ' sarjaa'});
      }else{
        const arr = s.entries[key];
        if(!arr || !arr.length) return;
        const kg = topKg(arr);
        if(kg <= 0) return;
        const best = arr.filter(function(x){ return num(x.kg) === kg && num(x.reps) > 0; })
          .sort(function(a,b){ return num(b.reps) - num(a.reps); })[0];
        out.push({end:s.end, val:kg, sub:(best ? best.reps : '–') + ' toistoa'});
      }
    });
  return out.slice(-12);
}

function programChartHtml(person, pid){
  const p = progById(pid);
  const keys = [];
  p.ex.forEach(function(e){
    if(programPoints(person, pid, e.key).length) keys.push(e);
  });
  const volPts = programPoints(person, pid, '__volume');
  let h = '<p class="eyebrow">Kehitys tässä ohjelmassa</p>';
  if(!volPts.length){
    return h + '<div class="card" style="padding:16px"><p class="muted" style="margin:0">' +
      'Käyrä piirtyy heti ensimmäisen tallennetun treenin jälkeen ja vertaa kerta kerralta samaa ohjelmaa.</p></div>';
  }
  if(!progChartKey || (progChartKey !== '__volume' && !programPoints(person, pid, progChartKey).length)){
    progChartKey = keys.length ? keys[0].key : '__volume';
  }
  h += '<select class="pick" id="progpick" aria-label="Valitse mitattava asia">';
  keys.forEach(function(e){
    h += '<option value="' + e.key + '"' + (progChartKey === e.key ? ' selected' : '') + '>' +
         esc(e.name.split(',')[0]) + ' – paras työsarja</option>';
  });
  h += '<option value="__volume"' + (progChartKey === '__volume' ? ' selected' : '') +
       '>Kokonaiskuorma (sekundäärinen)</option></select>';
  h += '<div class="card chartbox" id="progbox" style="margin-top:10px"></div>';
  h += '<p class="muted" id="progdelta" style="font-size:12.5px;margin:8px 2px 0"></p>';
  return h;
}

function drawProgChart(){
  const box = document.getElementById('progbox');
  if(!box || !progDom) return;
  const person = progDom.person, pid = progDom.pid;
  const p = progById(pid);
  let key = progChartKey || '__volume';
  let pts = programPoints(person, pid, key);
  if(!pts.length){ key = '__volume'; progChartKey = key; pts = programPoints(person, pid, key); }
  const unit = 'kg';
  const w = Math.max(260, box.clientWidth - 12);
  const h = 170, padL = 44, padR = 48, padT = 18, padB = 26;
  const cs = getComputedStyle(document.body);
  const ink3 = cs.getPropertyValue('--ink-3').trim() || '#78828F';
  const ink2 = cs.getPropertyValue('--ink-2').trim() || '#4B5563';
  const line = cs.getPropertyValue('--line').trim() || '#D9DFE8';
  const surf = cs.getPropertyValue('--surface').trim() || '#fff';
  const acc = (cs.getPropertyValue('--acc').trim() || cs.getPropertyValue('--up').trim() || '#4F46C7');
  const vals = pts.map(function(x){ return x.val; });
  let min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  if(min === max){ min = Math.max(0, min - (min * 0.1 || 5)); max = max + (max * 0.1 || 5); }
  const span = max - min || 1;
  const n = pts.length;
  function x(i){ return n === 1 ? (padL + (w - padL - padR)/2) : padL + (i/(n-1))*(w - padL - padR); }
  function y(v){ return padT + (1 - (v - min)/span) * (h - padT - padB); }

  let svg = '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h +
            '" role="img" aria-label="Ohjelman kehitys">';
  [0, 0.5, 1].forEach(function(t){
    const v = min + span*t, yy = y(v);
    svg += '<line x1="' + padL + '" y1="' + yy + '" x2="' + (w-padR) + '" y2="' + yy + '" stroke="' + line + '" stroke-width="1"/>';
    svg += '<text x="' + (padL-8) + '" y="' + (yy+4) + '" text-anchor="end" font-size="11" fill="' + ink3 +
           '" font-family="IBM Plex Mono, monospace">' + Math.round(v) + '</text>';
  });
  if(n > 1){
    let d = '';
    pts.forEach(function(pt,i){ d += (i ? ' L' : 'M') + x(i).toFixed(1) + ' ' + y(pt.val).toFixed(1); });
    svg += '<path d="' + d + '" fill="none" stroke="' + acc + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  }
  pts.forEach(function(pt,i){
    const isLast = i === n-1;
    svg += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(pt.val).toFixed(1) + '" r="' + (isLast ? 5.5 : 4) +
           '" fill="' + (isLast ? acc : surf) + '" stroke="' + acc + '" stroke-width="2"/>';
  });
  const last = pts[n-1];
  const lastLabel = last.val + ' ' + unit;
  const lw = lastLabel.length * 7.4;
  const fitsRight = (x(n-1) + 10 + lw) <= w - 2;
  svg += '<text x="' + (fitsRight ? (x(n-1)+10) : (x(n-1)-10)) + '" y="' + (y(last.val)+4) + '"' +
         (fitsRight ? '' : ' text-anchor="end"') + ' font-size="12" font-weight="600" fill="' + ink2 +
         '" font-family="IBM Plex Mono, monospace">' + lastLabel + '</text>';
  svg += '<text x="' + padL + '" y="' + (h-6) + '" font-size="11" fill="' + ink3 +
         '" font-family="IBM Plex Mono, monospace">' + fmtDate(pts[0].end) + '</text>';
  if(n > 1) svg += '<text x="' + (w-padR) + '" y="' + (h-6) + '" text-anchor="end" font-size="11" fill="' + ink3 +
         '" font-family="IBM Plex Mono, monospace">' + fmtDate(last.end) + '</text>';
  svg += '</svg>';
  box.innerHTML = svg;

  const tip = document.createElement('div');
  tip.className = 'tt'; tip.hidden = true;
  box.appendChild(tip);
  box.onpointermove = function(ev){
    const r = box.getBoundingClientRect();
    const px = ev.clientX - r.left - 6;
    let bi = 0, bd = 1e9;
    pts.forEach(function(pt,i){ const d = Math.abs(x(i) - px); if(d < bd){ bd = d; bi = i; } });
    const pt = pts[bi];
    tip.hidden = false;
    tip.innerHTML = '<b class="mono">' + pt.val + ' ' + unit + '</b> · ' + esc(pt.sub) + '<br>' +
      '<span class="muted">' + fmtDate(pt.end) + '</span>';
    tip.style.left = (x(bi) + 6) + 'px';
    tip.style.top = (y(pt.val) + 12) + 'px';
  };
  box.onpointerleave = function(){ tip.hidden = true; };

  const dEl = document.getElementById('progdelta');
  if(dEl){
    const label = key === '__volume' ? 'Kokonaiskuorma' :
      (function(){ let nm = key; p.ex.forEach(function(e){ if(e.key === key) nm = e.name.split(',')[0]; }); return nm; })();
    if(n > 1){
      const diff = Math.round((last.val - pts[n-2].val) * 10) / 10;
      const word = diff > 0 ? 'nousi' : (diff < 0 ? 'laski' : 'pysyi samana');
      dEl.textContent = label + ' ' + word + ' edellisestä kerrasta' +
        (diff ? ' ' + (diff > 0 ? '+' : '') + diff + ' ' + unit : '') +
        ' · ' + n + ' kirjattua kertaa.';
    }else{
      dEl.textContent = label + ': ensimmäinen kirjaus tallessa. Seuraava treeni piirtää käyrän.';
    }
  }
}

        if(s.pid === 'rest'){
          h += '<div' + open + '><span class="hd mono">' + fmtDate(s.end) + '</span><div style="min-width:0">' +
