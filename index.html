         (d.dupes === 1 ? ' identtinen duplikaattikirjaus ohitettiin.' : ' identtistä duplikaattikirjausta ohitettiin.') + '</p>';
  }
  h += '<div class="aiacts">' +
    '<button type="button" class="btn accent" data-aicopy="1">📋 Kopioi AI-analyysi</button>' +
    '<button type="button" class="btn ghost" data-aitxt="1">💾 Lataa analyysidata</button>' +
    '<button type="button" class="btn ghost" data-aijson="1">📦 Export JSON</button>' +
    '</div>';
  h += '<p class="note" id="ai-msg" hidden style="margin-top:10px"></p>';
  h += '<textarea id="ai-text" class="pick aitext" rows="14" readonly aria-label="Analyysipaketti">' + esc(txt) + '</textarea>';
  h += '<p class="muted" style="font-size:11.5px;margin:6px 2px 0">' + txt.length.toLocaleString('fi-FI') +
       ' merkkiä · laskettu tässä laitteessa. Export JSON lataa alkuperäisen raakadatan (molemmat profiilit) – ' +
       'sama tiedosto kelpaa varmuuskopioksi ja Tuo-toiminnolle.</p>';
  h += '<div class="sticky-cta"><button class="btn primary" data-close="1">Valmis</button></div>';
  h += '</div></div>';
  overlayEl.innerHTML = h;
}

function aiCopy(btn){
  const ta = document.getElementById('ai-text');
  if(!ta) return;
  const txt = ta.value;
  const label = '📋 Kopioi AI-analyysi';
  function ok(){
    btn.textContent = '✓ Kopioitu';
    clearTimeout(aiCopy.t);
    aiCopy.t = setTimeout(function(){ if(document.body.contains(btn)) btn.textContent = label; }, 2000);
  }
  function legacy(){
    let done = false;
    try{
      ta.removeAttribute('readonly');
      ta.focus(); ta.select(); ta.setSelectionRange(0, txt.length);
      done = document.execCommand('copy');
    }catch(e){ done = false; }
    ta.setAttribute('readonly', 'readonly');
    if(done) ok();
    else aiNotice('Selain esti kopioinnin. Teksti on valittuna – kopioi se pitkällä painalluksella.', true);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok, legacy);
  }else{
    legacy();
  }
}

/* ============================================================
   6. TAPAHTUMAT
   ============================================================ */

document.addEventListener('click', function(ev){
  const t = ev.target.closest('[data-person],[data-open],[data-view],[data-tab],[data-cardio],[data-finish],[data-close],[data-savecardio],[data-discard],[data-discard-ask],[data-setskin],[data-rest],[data-ckind],[data-cmin],[data-ckindfilter],[data-timer],[data-calmove],[data-calday],[data-editsets],[data-del],[data-delok],[data-backtoday],[data-addcardio],[data-addrest],[data-abort],[data-clearsets],[data-weekday],[data-active],[data-pickprog],[data-hidebar],[data-showbar],[data-export],[data-import],[data-importtext],[data-copybk],[data-bkselect],[data-signin],[data-signout],[data-togkey],[data-invite],[data-joincode],[data-acceptinv],[data-unshare],[data-unshareok],[data-resetpw],[data-syncsheet],[data-whatsapp],[data-wacopy],[data-washare],[data-importclip],[data-bkshare],[data-bkdl],[data-session],[data-replaceok],[data-ai],[data-airange],[data-aicopy],[data-aitxt],[data-aijson]');
  if(!t) return;

  if(t.dataset.person){
    if(visiblePersons().indexOf(t.dataset.person) < 0) return;
    state.person = t.dataset.person;
    try{ localStorage.setItem('salikirja-person', state.person); }catch(e){}
    progDom = null;
    setView('home');
    return;
  }
  if(t.dataset.active){ showActiveSheet(); return; }
  if(t.dataset.pickprog){ showPickProgram(); return; }
  if(t.dataset.export){ exportData(); return; }
  if(t.dataset.import){ showImport(); return; }
  if(t.dataset.importtext){
    const ta = document.getElementById('imp-text');
    importAny(ta ? ta.value : '');
    return;
  }
  if(t.dataset.whatsapp){ showWhatsApp(); return; }
  if(t.dataset.signin){ showSignIn(); return; }
  if(t.dataset.togkey){ state.togKey = t.dataset.togkey; renderTogether(); const c = document.getElementById('togchart'); if(c) c.scrollIntoView({block:'center', behavior:'smooth'}); return; }
  if(t.dataset.invite){ showInvite(); return; }
  if(t.dataset.joincode){
    const inp = document.getElementById('join-code');
    showAcceptInvite(inp ? inp.value : '');
    return;
  }
  if(t.dataset.acceptinv){ t.disabled = true; t.textContent = 'Hyväksytään…'; acceptInvite(t.dataset.acceptinv); return; }
  if(t.dataset.unshare){ showUnshare(t.dataset.unshare); return; }
  if(t.dataset.unshareok){
    const p = t.dataset.unshareok;
    t.disabled = true;
    removePartner(p).then(function(){
      overlayEl.innerHTML = '';
      if(state.view === 'together') setView('home'); else renderAll();
      syncRender();
    }, function(err){
      overlayEl.innerHTML = '<div class="ov"><div class="sheet" role="dialog" aria-label="Virhe"><h3>Jakamista ei voitu lopettaa</h3>' +
        '<p>Tarkista verkkoyhteys ja yritä uudelleen. (' + esc(err && err.code || 'virhe') + ')</p>' +
        '<div class="sticky-cta"><button class="btn primary" data-close="1">Sulje</button></div></div></div>';
    });
    return;
  }
  if(t.dataset.syncsheet){ showSyncSheet(); return; }
  if(t.dataset.signout){
    if(sync.api && sync.auth){
      sync.api.U.signOut(sync.auth).then(function(){ overlayEl.innerHTML = ''; renderAll(); syncRender(); });
    }
    return;
  }
  if(t.dataset.resetpw){
    const em = document.getElementById('si-email');
    const email = em ? em.value.trim() : '';
    if(!email){ siMsg('Kirjoita ensin sähköpostiosoitteesi yllä olevaan kenttään.', true); if(em) em.focus(); return; }
    if(!sync.api){ siMsg('Ei yhteyttä palveluun. Yritä hetken päästä.', true); return; }
    sync.api.U.sendPasswordResetEmail(sync.auth, email).then(function(){
      siMsg('Salasanan vaihtolinkki lähetettiin osoitteeseen ' + email + '. Tarkista myös roskaposti.', false);
    }, function(err){ siMsg(authErrorText(err), true); });
    return;
  }
  if(t.dataset.wacopy){
    /* linkki (Kopioi ja avaa WhatsApp) jatkaa kopioinnin jälkeen WhatsAppiin */
    const ok = copyFromTextarea('wa-text');
    if(t.tagName !== 'A'){
      if(ok){ t.textContent = '✓ Kopioitu'; bkNotice('Viesti kopioitu. Liitä se keskusteluun (pitkä painallus → Liitä).', false); }
      else bkNotice('Selain esti kopioinnin. Valitse teksti alta ja kopioi se pitkällä painalluksella.', true);
    }
    return;
  }
  if(t.dataset.washare){
    navigator.share({text:waMessage}).then(function(){ bkNotice('Jaettu.', false); }, function(err){
      if(err && err.name === 'AbortError') return;
      bkNotice('Jakaminen ei onnistunut. Käytä WhatsApp- tai Kopioi-nappia.', true);
    });
    return;
  }
  if(t.dataset.importclip){
    const msg = document.getElementById('imp-msg');
    const fail = function(){
      if(msg){ msg.hidden = false; msg.style.borderLeftColor = 'var(--warn)';
        msg.textContent = 'Selain ei antanut lukea leikepöytää. Liitä viesti alla olevaan kenttään (pitkä painallus → Liitä) ja paina Tuo liitetty teksti.'; }
      const ta = document.getElementById('imp-text'); if(ta) ta.focus();
    };
    if(!navigator.clipboard || !navigator.clipboard.readText){ fail(); return; }
    navigator.clipboard.readText().then(function(txt){
      if(!txt || !txt.trim()){
        if(msg){ msg.hidden = false; msg.style.borderLeftColor = 'var(--warn)'; msg.textContent = 'Leikepöytä on tyhjä. Kopioi ensin koko WhatsApp-viesti.'; }
        return;
      }
      importAny(txt);
    }, fail);
    return;
  }
  if(t.dataset.bkshare && backupFile){
    const f = shareableFile(backupFile.fname, backupFile.txt, 'application/json');
    if(!f){ bkNotice('Jakaminen ei ole käytettävissä tässä selaimessa. Käytä Lataa- tai Kopioi-vaihtoehtoa.', true); return; }
    shareFile(f, function(n){ bkNotice('Jaettu: ' + n + '. Tarkista, että tiedosto tallentui valitsemaasi paikkaan.', false); },
      function(){ bkNotice('Jakaminen ei onnistunut. Käytä Lataa- tai Kopioi-vaihtoehtoa.', true); });
    return;
  }
  if(t.dataset.bkdl && backupFile){
    if(downloadViaLink(backupFile.fname, backupFile.txt, 'application/json'))
      bkNotice('Lataus käynnistetty: ' + backupFile.fname + '. Jos tiedostoa ei näy Latauksissa, käytä Jaa- tai Kopioi-vaihtoehtoa.', false);
    else bkNotice('Lataus ei onnistunut tässä selaimessa. Käytä Jaa- tai Kopioi-vaihtoehtoa.', true);
    return;
  }
  if(t.dataset.copybk){
    const ta = document.getElementById('bk-text');
    if(!ta) return;
    const okMsg = function(){
      t.textContent = '✓ Kopioitu';
      bkNotice('Kopioitu leikepöydälle (' + ta.value.length.toLocaleString('fi-FI') +
        ' merkkiä). Liitä teksti talteen, esim. Muistiinpanoihin.', false);
    };
    const failMsg = function(){
      ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
      bkNotice('Selain esti kopioinnin. Teksti on nyt valittuna – paina sitä pitkään ja valitse Kopioi.', true);
    };
    let done = false;
    try{
      ta.removeAttribute('readonly');
      ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
      done = document.execCommand('copy');
    }catch(e){ done = false; }
    ta.setAttribute('readonly', 'readonly');
    if(done){ okMsg(); return; }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(okMsg, failMsg);
    }else failMsg();
    return;
  }
  if(t.dataset.bkselect){
    const ta = document.getElementById('bk-text');
    if(!ta) return;
    ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
    bkNotice('Teksti valittu – paina sitä pitkään ja valitse Kopioi.', false);
    return;
  }
  if(t.dataset.hidebar){ bottomHidden = true; renderBottom(); updateFinishState(); return; }
  if(t.dataset.showbar){ bottomHidden = false; renderBottom(); updateFinishState(); return; }
  if(t.dataset.open){
    const pid = t.dataset.open;
    const cur = store[state.person].active;
    if(cur && cur.pid !== pid && activeWork()){
      const np = progById(pid);
      guardReplace('Ohjelman ' + (np ? np.name : '') + ' aloittaminen',
        function(){ store[state.person].active = null; save(state.person); openProgram(pid); });
      return;
    }
    openProgram(pid);
    return;
  }
  if(t.dataset.replaceok){
    const fn = pendingReplace; pendingReplace = null;
    overlayEl.innerHTML = '';
    if(fn) fn();
    return;
  }
  if(t.dataset.view){ progDom = null; setView(t.dataset.view); return; }
  if(t.dataset.tab){ state.tab = t.dataset.tab; renderHistory(); return; }
  if(t.dataset.cardio){ showCardio(); return; }
  if(t.dataset.calmove){
    const dir = num(t.dataset.calmove);
    if(dir === 0){ const n = new Date(); state.calY = n.getFullYear(); state.calM = n.getMonth(); }
    else {
      const d = new Date(state.calY, state.calM + dir, 1);
      state.calY = d.getFullYear(); state.calM = d.getMonth();
    }
    renderCalendar();
    return;
  }
  if(t.dataset.calday){ showDay(t.dataset.calday); return; }
  if(t.dataset.weekday){
    const b = t.dataset.weekday.split('-');
    state.calY = +b[0]; state.calM = +b[1] - 1;
    progDom = null;
    setView('calendar');
    showDay(t.dataset.weekday);
    return;
  }
  if(t.dataset.ai){ showAI(); return; }
  if(t.dataset.airange){ state.aiRange = num(t.dataset.airange); showAI(); return; }
  if(t.dataset.aicopy){ aiCopy(t); return; }
  if(t.dataset.aitxt){
    const ta = document.getElementById('ai-text');
    aiSaveFile(aiFileName('txt'), ta ? ta.value : aiFullText(state.person, state.aiRange), 'text/plain;charset=utf-8');
    return;
  }
  if(t.dataset.aijson){
    aiSaveFile('saliohjelma-raakadata-' + isoDay(new Date()) + '.json', backupPayload(), 'application/json');
    return;
  }
  if(t.dataset.session){ showSession(t.dataset.session, t.dataset.sessionback || ''); return; }
  if(t.dataset.editsets){ startEdit(t.dataset.editsets); return; }
  if(t.dataset.del){ confirmDelete(t.dataset.del, t.dataset.delfrom || ''); return; }
  if(t.dataset.delok){
    const id = t.dataset.delok;
    const gone = store[state.person].sessions.filter(function(x){ return x.id === id; })[0];
    const backIso = gone ? isoDay(new Date(gone.end)) : null;
    store[state.person].sessions = store[state.person].sessions.filter(function(x){ return x.id !== id; });
    save(state.person);
    overlayEl.innerHTML = '';
    if(state.view === 'calendar'){
      renderCalendar();
      if(backIso) showDay(backIso);
    }else{
      renderAll();
    }
    return;
  }
  if(t.dataset.backtoday){ showDay(t.dataset.backtoday); return; }
  if(t.dataset.addcardio){ showCardio(t.dataset.addcardio); return; }
  if(t.dataset.addrest){
    store[state.person].sessions.push({id:'r' + Date.now(), pid:'rest', end:isoAtNoon(t.dataset.addrest)});
    save(state.person);
    renderCalendar();
    showDay(t.dataset.addrest);
    return;
  }
  if(t.dataset.abort){ showAbort(); return; }
  if(t.dataset.clearsets){
    const person = state.person;
    const a = store[person].active;
    if(a){ const pid = a.pid; store[person].active = null; ensureActive(pid); save(person); progDom = null; }
    overlayEl.innerHTML = '';
    renderAll();
    return;
  }
  if(t.dataset.discardAsk){ confirmDiscard(); return; }
  if(t.dataset.setskin){
    applySkin(t.dataset.setskin);
    showSkins();
    if(state.view === 'history' && state.tab === 'kehitys' && document.getElementById('chartbox')) drawChart();
    return;
  }
  if(t.dataset.finish){ finishSession(); return; }
  if(t.dataset.close && document.getElementById('signin-form')){ sync.promptHidden = true; }
  if(t.dataset.close){ overlayEl.innerHTML = ''; if(state.view === 'program' && !store[state.person].active) setView('home'); else renderAll(); return; }
  if(t.dataset.discard){
    store[state.person].active = null; progDom = null; save(state.person);
    overlayEl.innerHTML = ''; stopTimer(); setView('home'); return;
  }
  if(t.dataset.ckind){
    const mi = document.getElementById('c-min');
    if(mi) cardioPick.min = num(mi.value) || cardioPick.min;
    cardioPick.kind = t.dataset.ckind;
    showCardio(cardioPick.date);
    return;
  }
  if(t.dataset.ckindfilter){ state.cardioKind = t.dataset.ckindfilter; renderHistory(); return; }
  if(t.dataset.cmin){
    cardioPick.min = num(t.dataset.cmin);
    showCardio(cardioPick.date);
    return;
  }
  if(t.dataset.rest){
    store[state.person].sessions.push({id:'r' + Date.now(), pid:'rest', end:new Date().toISOString()});
    save(state.person);
    setView('home');
    return;
  }
  if(t.dataset.savecardio){
    const min = num(document.getElementById('c-min').value) || cardioPick.min || 30;
    const kind = cardioPick.kind;
    cardioPick.min = min;
    const cEnd = cardioPick.date ? isoAtNoon(cardioPick.date) : new Date().toISOString();
    store[state.person].sessions.push({id:'c' + Date.now(), pid:'cardio', end:cEnd, minutes:min, kind:kind});
    save(state.person);
    const backTo = cardioPick.date;
    cardioPick.date = null;
    overlayEl.innerHTML = '';
    if(backTo){ renderCalendar(); showDay(backTo); }
    else setView('home');
    return;
  }
  if(t.dataset.timer){
    if(t.dataset.timer === '30'){ timer.end += 30000; timer.total += 30; const b = document.getElementById('t-box'); if(b) b.classList.remove('zero'); }
    else if(t.dataset.timer === 'stop'){ stopTimer(); }
    else if(t.dataset.timer === 'mute'){ muted = !muted; try{ localStorage.setItem('salikirja-muted', muted ? '1' : '0'); }catch(e){} renderBottom(); }
    return;
  }
});

/* näppäimistö: historian rivit ovat role="button" -laatikoita */
document.addEventListener('keydown', function(ev){
  if(ev.key !== 'Enter' && ev.key !== ' ' && ev.key !== 'Spacebar') return;
  const t = ev.target;
  if(!t || !t.getAttribute || t.getAttribute('role') !== 'button') return;
  if(!t.getAttribute('data-session')) return;
  ev.preventDefault();
  t.click();
});

document.addEventListener('input', function(ev){
  const t = ev.target;
  if(t && t.id === 'sum-note'){
    const id = t.getAttribute('data-note');
    if(!id) return;
    const person = state.person;
    let hit = false;
    store[person].sessions = store[person].sessions.map(function(x){
      if(x.id !== id) return x;
      hit = true;
      return Object.assign({}, x, {note: t.value});
    });
    if(hit) save(person);
  }
});

document.addEventListener('change', function(ev){
  if(ev.target.id === 'togpick'){ state.togKey = ev.target.value; renderTogether(); }
  if(ev.target.id === 'chartpick'){ state.chartKey = ev.target.value; drawChart(); }
  if(ev.target.id === 'progpick'){ progChartKey = ev.target.value; drawProgChart(); }
  const sw = ev.target.getAttribute && ev.target.getAttribute('data-swap');
  if(sw){
    const person = state.person, val = ev.target.value;
    store[person].sessions = store[person].sessions.map(function(x){
      return x.id === sw ? Object.assign({}, x, {pid:val}) : x;
    });
    save(person);
    const day = state.calDay;
    renderCalendar();
    if(day) showDay(day);
    return;
  }
  const mv = ev.target.getAttribute && ev.target.getAttribute('data-movedate');
  if(mv){
    const person = state.person, val = ev.target.value;
    if(!val) return;
    store[person].sessions = store[person].sessions.map(function(x){
      return x.id === mv ? Object.assign({}, x, {end:isoAtNoon(val)}) : x;
    });
    save(person);
    renderCalendar();
    showDay(val);
    return;
  }
  const at = ev.target.getAttribute && ev.target.getAttribute('data-addtrain');
  if(at && ev.target.value){ startOnDate(ev.target.value, at); return; }
});

document.getElementById('btn-skin').addEventListener('click', function(){ showSkins(); });
document.getElementById('btn-home').addEventListener('click', function(){
  progDom = null;
  overlayEl.innerHTML = '';
  setView('home');
});
document.getElementById('btn-cal').addEventListener('click', function(){
  const n = new Date(); state.calY = n.getFullYear(); state.calM = n.getMonth();
  progDom = null; setView('calendar');
});


document.addEventListener('focusin', function(ev){
  const t = ev.target;
  if(t && t.matches && t.matches('#view-program input, #view-program textarea')) document.body.classList.add('typing');
});
document.addEventListener('focusout', function(){
  setTimeout(function(){
    const ae = document.activeElement;
    if(!(ae && ae.matches && ae.matches('#view-program input, #view-program textarea'))) document.body.classList.remove('typing');
  }, 60);
});

let rsz;
window.addEventListener('resize', function(){
  clearTimeout(rsz);
  rsz = setTimeout(function(){
    if(state.view === 'program'){ drawProgChart(); return; }
    if(state.view !== 'history') return;
    if(state.tab === 'kehitys' && document.getElementById('chartbox')) drawChart();
    if(state.tab === 'cardio' && document.getElementById('cardiobox')) drawCardioChart();
  }, 200);
});

/* ============================================================
   7. KÄYNNISTYS
   ============================================================ */

function captureInviteParam(){
  try{
    const u = new URL(location.href);
    const c = u.searchParams.get('kutsu');
    if(c){
      sessionStorage.setItem('salikirja-invite', c.toUpperCase().replace(/[^A-Z0-9]/g, ''));
      u.searchParams.delete('kutsu');
      history.replaceState(null, '', u.pathname + (u.search || '') + u.hash);
    }
  }catch(e){}
}
function boot(snap){
  captureInviteParam();
  applySkin(skin);
  loadLocal();
  if(snap && snap.person && PERSONS.indexOf(snap.person) >= 0) state.person = snap.person;
  if(snap && snap.view){ state.view = snap.view; state.pid = snap.pid || null; }
  for(const k in views) views[k].hidden = (k !== state.view);
  renderAll();
  connect();
  syncStart();
  syncRender();
  refreshPersons();
  if(sync.enabled){
    let c = ''; try{ c = sessionStorage.getItem('salikirja-invite') || ''; }catch(e){}
    if(c && !overlayEl.innerHTML) setTimeout(function(){ if(!sync.user && !overlayEl.innerHTML) showSignIn('Kirjaudu, niin voit hyväksyä treenikaverikutsun.'); }, 2500);
  }
}
if(window.claude && window.claude.hot){
  window.claude.hot.snapshot(function(){ return {person:state.person, view:state.view, pid:state.pid}; });
  if(window.claude.hot.ready) window.claude.hot.ready(boot); else boot(window.claude.hot.data || {});
}else{
  boot({});
}
})();
